  getClient(){
    if(this.client)return this.client;
    if(!window.supabase?.createClient)throw Error("Supabase JS não carregou.");
    if(!CFG.supabaseUrl||!CFG.supabaseAnonKey)throw Error("Informe Project URL e Publishable/anon key.");
    this.client=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
    return this.client;
  },
  db(){return this.getClient().schema(CFG.dbSchema)},
  async requireEditorSession(){
    await ensureSupabaseSDK();
    const root=this.getClient();

    const {data:userData,error:userError}=await withTimeout(
      root.auth.getUser(),
      10000,
      "Tempo excedido ao validar a sessão de edição."
    );
    if(userError)throw userError;

    const user=userData?.user;
    if(!user)throw Error("Sessão de edição não autenticada.");

    const db=this.db();

    const {data:org,error:orgError}=await withTimeout(
      db.from("organizations")
        .select("id,name,slug")
        .eq("slug",CFG.organizationSlug)
        .maybeSingle(),
      10000,
      "Tempo excedido ao localizar a organização."
    );
    if(orgError)throw orgError;
    if(!org)throw Error(`O usuário autenticado não possui acesso à organização "${CFG.organizationSlug}".`);

    const {data:membership,error:membershipError}=await withTimeout(
      db.from("organization_members")
        .select("role")
        .eq("organization_id",org.id)
        .eq("user_id",user.id)
        .maybeSingle(),
      10000,
      "Tempo excedido ao validar as permissões do usuário."
    );
    if(membershipError)throw membershipError;

    if(!membership||membership.role!=="admin"){
      throw Error("Acesso restrito. Somente usuários com perfil Administrador podem acessar a Gestão.");
    }

    this.orgId=org.id;
    this.accessMode="authenticated";
    state.editorEmail=user.email||"";
    state.editorRole=membership.role||"";
    return {user,org,role:membership.role};
  },

  async signInEditor(email,password){
    await ensureSupabaseSDK();

    email=normalizeAdminLoginIdentity(email);

    if(!email||!password){
      throw Error("Informe o usuário/e-mail e a senha.");
    }

    const root=this.getClient();
    const {data,error}=await withTimeout(
      root.auth.signInWithPassword({email,password}),
      15000,
      "Tempo excedido ao entrar no Supabase."
    );
    if(error)throw error;

    try{
      const ctx=await this.requireEditorSession();
      return ctx;
    }catch(error){
      await root.auth.signOut().catch(()=>{});
      this.accessMode="public-read";
      state.editorEmail="";
      state.editorRole="";
      throw error;
    }
  },

  async signOutEditor(){
    await ensureSupabaseSDK();
    const root=this.getClient();
    await withTimeout(root.auth.signOut(),10000,"Tempo excedido ao encerrar a sessão.");
    this.accessMode="public-read";
    state.editorEmail="";
    state.editorRole="";
  },

  async test(values=null){
    const cfg=values||CFG;
    if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error("Informe a Project URL e a Publishable/anon key.");
    if(looksLikeServiceRoleKey(cfg.supabaseAnonKey))throw Error("Chave service_role/secret detectada. Não use segredos administrativos no navegador.");
    const sdk=await ensureSupabaseSDK();
    const root=sdk.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
    const db=root.schema(cfg.dbSchema||"organograma");
    const {data,error}=await db.rpc("get_public_org_chart",{p_org_slug:cfg.organizationSlug||"orbia"});
    if(error)throw error;
    return {
      ok:true,
      rows:(data||[]).length,
      organization:data?.[0]?.organization_name||null,
      organizationId:data?.[0]?.organization_id||null
    };
  },
  async loadPublic(){
    const sb=this.db();
    const {data,error}=await sb.rpc("get_public_org_chart",{p_org_slug:CFG.organizationSlug});
    if(error)throw error;
    const rows=data||[];
    if(!rows.length)throw Error(`Conectado ao Supabase, mas nenhuma posição foi encontrada para a organização "${CFG.organizationSlug}".`);
    this.orgId=rows[0].organization_id;
    this.accessMode="public-read";

    const depMap=new Map();
    const pplMap=new Map();
    for(const r of rows){
      if(r.department_id&&!depMap.has(r.department_id)){
        depMap.set(r.department_id,{
          id:r.department_id,
          name:r.department_name||"Sem departamento",
          acronym:r.department_acronym||"",
          description:r.department_description||"",
          parentDepartmentId:r.department_parent_id||null,
          leaderPositionId:r.department_leader_position_id||null,
          active:true
        });
      }
      if(r.employee_id&&!pplMap.has(r.employee_id)){
        pplMap.set(r.employee_id,{
          id:r.employee_id,
          name:r.employee_name||"Colaborador",
          email:"",
          phone:"",
          avatarUrl:"",
          photoPath:"",
          hireDate:null,
          tenureDays:r.tenure_days??null,
          active:true
        });
      }
    }

    return {
      company:{id:rows[0].organization_id,name:rows[0].organization_name||CFG.organizationSlug},
      departments:[...depMap.values()],
      people:[...pplMap.values()],
      positions:rows.map(r=>({
        id:r.position_id,
        title:r.title,
        level:r.organizational_level,
        seniority:r.seniority||"Não informado",
        departmentId:r.department_id||null,
        reportsTo:r.manager_position_id||null,
        personId:r.employee_id||null,
        description:"",
        status:r.position_status||"active",
        order:r.sort_order||1
      })),
      reportingLines:rows.flatMap(r=>{
        const groups=[
          ["shared",r.shared_manager_position_ids,"Liderança compartilhada"],
          ["functional",r.functional_manager_position_ids,"Reporte funcional"],
          ["advisory",r.advisory_manager_position_ids,"Reporte consultivo"]
        ];
        return groups.flatMap(([type,ids,label])=>
          (Array.isArray(ids)?ids:[])
            .filter(parentId=>parentId&&parentId!==r.position_id)
            .map(parentId=>({
              id:`public:${type}:${parentId}:${r.position_id}`,
              parentId,
              childId:r.position_id,
              type,
              label
            }))
        );
      }),
      positionHistory:[],
      activity:[{
        id:"remote-read",
        text:"Organograma carregado do Supabase em modo leitura pública segura.",
        at:new Date().toISOString()
      }],
      settings:{accessProfile:"viewer"}
    };
  },
  async load(){
    await ensureSupabaseSDK();
    const root=this.getClient(),sb=this.db();

    // Primeiro tenta acesso completo (quando houver sessão autenticada).
    const {data:org,error:orgErr}=await sb
      .from("organizations")
      .select("id,name,slug")
      .eq("slug",CFG.organizationSlug)
      .maybeSingle();

    if(orgErr||!org){
      return this.loadPublic();
    }

    this.orgId=org.id;
    try{
      await this.requireEditorSession();
    }catch{
      this.accessMode="authenticated-read";
      const {data:userData}=await root.auth.getUser().catch(()=>({data:null}));
      state.editorEmail=userData?.user?.email||"";
      state.editorRole="";
    }

    const [depRes,empRes,posRes,asgRes,eventRes,leadRes,reportRes,historyRes,leadHistoryRes,auditRes]=await Promise.all([
      sb.from("departments").select("*").eq("organization_id",org.id).order("sort_order"),
      sb.from("employees").select("*").eq("organization_id",org.id).order("full_name"),
      sb.from("positions").select("*").eq("organization_id",org.id).order("sort_order"),
      sb.from("position_assignments").select("*").eq("organization_id",org.id).is("end_date",null),
      sb.from("employment_events").select("*").eq("organization_id",org.id).order("event_date",{ascending:false}).limit(250),
      sb.from("department_leaderships").select("department_id,position_id,start_date").eq("organization_id",org.id).is("end_date",null),
      sb.from("position_reporting_lines").select("id,parent_position_id,child_position_id,relationship_type,label").eq("organization_id",org.id).is("end_date",null),
      sb.from("position_assignments")
        .select("id,employee_id,position_id,start_date,end_date,assignment_type,notes,created_at")
        .eq("organization_id",org.id)
        .order("start_date",{ascending:false,nullsFirst:false}),
      sb.from("department_leaderships")
        .select("id,department_id,position_id,start_date,end_date,created_at")
        .eq("organization_id",org.id)
        .order("start_date",{ascending:false,nullsFirst:false}),
      sb.from("audit_log")
        .select("id,user_id,entity_type,entity_id,action,before_data,after_data,created_at")
        .eq("organization_id",org.id)
        .order("created_at",{ascending:false})
        .limit(100)
    ]);

    for(const r of [depRes,empRes,posRes,asgRes,eventRes,leadRes,historyRes,leadHistoryRes]){
      if(r.error)throw r.error;
    }
    const safeAuditRes=auditRes.error&&isMissingDatabaseObject(auditRes.error)?{data:[]}:auditRes;
    if(safeAuditRes.error)throw safeAuditRes.error;

    // Compatibilidade temporária: se migration 007 ainda não foi aplicada,
    // o restante do sistema continua carregando sem relações adicionais.
    const safeReportRes=reportRes.error&&isMissingDatabaseObject(reportRes.error)
      ?{data:[]}
      :reportRes;
    if(safeReportRes.error)throw safeReportRes.error;

    const assignmentByPosition=new Map((asgRes.data||[]).map(a=>[a.position_id,a]));
    const leaderByDepartment=new Map((leadRes.data||[]).map(x=>[x.department_id,x.position_id]));
    const positionRowById=new Map((posRes.data||[]).map(p=>[p.id,p]));
    const departmentRowById=new Map((depRes.data||[]).map(d=>[d.id,d]));
    const photoMap=new Map();
    const withPhotos=(empRes.data||[]).filter(e=>e.photo_path);

    await Promise.all(withPhotos.map(async e=>{
      try{
        const {data,error}=await root.storage.from(CFG.storageBucket).createSignedUrl(e.photo_path,3600);
        if(!error&&data?.signedUrl)photoMap.set(e.id,data.signedUrl);
      }catch{}
    }));

    return {
      company:{id:org.id,name:org.name},
      departments:(depRes.data||[]).map(d=>({
        id:d.id,name:d.name,acronym:d.acronym||"",description:d.description||"",
        parentDepartmentId:d.parent_department_id||null,
        leaderPositionId:leaderByDepartment.get(d.id)||null,
        active:d.active
      })),
      people:(empRes.data||[]).map(e=>({
        id:e.id,name:e.preferred_name||e.full_name,email:e.email||"",phone:e.phone||"",
        avatarUrl:photoMap.get(e.id)||"",photoPath:e.photo_path||"",hireDate:e.hire_date||null,
        tenureDays:e.hire_date?null:null,
        employmentStatus:e.employment_status||"active",
        active:e.employment_status!=="terminated"
      })),
      positions:(posRes.data||[]).map(p=>{
        const a=assignmentByPosition.get(p.id);
        return {
          id:p.id,title:p.title,level:p.organizational_level,seniority:p.seniority||"Não informado",
          departmentId:p.department_id,reportsTo:p.manager_position_id||null,personId:a?.employee_id||null,
          description:p.description||"",status:p.position_status,order:p.sort_order||1,
          registrationNumber:p.registration_number||"",
          contractStatus:p.contract_status||"pending",
          signedContracts:p.signed_contracts||"",
          historyNotes:p.history_notes||"",
          vacancySince:p.vacancy_since||null,
          vacancyReason:p.vacancy_reason||"",
          vacancyNotes:p.vacancy_notes||"",
          vacancyOwnerEmployeeId:p.vacancy_owner_employee_id||null
        }
      }),
      reportingLines:(safeReportRes.data||[]).map(r=>({
        id:r.id,
        parentId:r.parent_position_id,
        childId:r.child_position_id,
        type:r.relationship_type||"shared",
        label:r.label||""
      })),
      positionHistory:(historyRes.data||[]).map(a=>{
        const position=positionRowById.get(a.position_id);
        const department=position?departmentRowById.get(position.department_id):null;
        return {
          id:a.id,
          employeeId:a.employee_id,
          positionId:a.position_id,
          title:position?.title||"Cargo",
          departmentId:position?.department_id||null,
          departmentName:department?.name||"",
          startDate:a.start_date||null,
          endDate:a.end_date||null,
          assignmentType:a.assignment_type||"correction",
          notes:a.notes||"",
          current:!a.end_date
        };
      }),
      employmentEvents:(eventRes.data||[]).map(e=>({
        id:e.id,employeeId:e.employee_id,eventType:e.event_type,eventDate:e.event_date,
        fromPositionId:e.from_position_id||null,toPositionId:e.to_position_id||null,
        notes:e.notes||"",createdAt:e.created_at
      })),
      departmentLeadershipHistory:(leadHistoryRes.data||[]).map(x=>({
        id:x.id,departmentId:x.department_id,positionId:x.position_id,
        startDate:x.start_date||null,endDate:x.end_date||null,current:!x.end_date,createdAt:x.created_at
      })),
      auditLogs:(safeAuditRes.data||[]).map(x=>({
        id:x.id,userId:x.user_id||null,entityType:x.entity_type,entityId:x.entity_id||null,
        action:x.action,beforeData:x.before_data||null,afterData:x.after_data||null,createdAt:x.created_at
      })),
      activity:(eventRes.data||[]).slice(0,20).map(e=>({
        id:e.id,text:`${e.event_type}: movimentação registrada`,at:e.created_at
      })),
      settings:{
        accessProfile:this.accessMode==="authenticated"
          ?(state.editorRole||"viewer")
          :"viewer"
      }
    };
  },
  async getRestEditorContext(){
    await ensureSupabaseSDK();
    const root=this.getClient();

    const {data,error}=await withTimeout(
      root.auth.getSession(),
      7000,
      "Tempo excedido ao ler a sessão do Supabase."
    );
    if(error)throw error;

    const session=data?.session;
    const token=session?.access_token;
    const user=session?.user;

    if(!token||!user){
      throw Error("Sessão de edição não autenticada. Entre novamente em Conexão Supabase.");
    }

    const orgId=this.orgId||state.data?.company?.id;
    if(!orgId){
      throw Error("Não foi possível identificar a organização para salvar a foto.");
    }

    state.editorEmail=user.email||state.editorEmail||"";
    return {root,session,token,user,orgId};
  },

  async updatePositionManagerReliable(positionId,newParentId=null){
    const ctx=await this.requireEditorSession();
    const db=this.db();

    if(!positionId)throw Error("Cargo não identificado.");

    if(newParentId){
      const {data:parent,error:parentError}=await withTimeout(
        db.from("positions")
          .select("id,organization_id")
          .eq("id",newParentId)
          .eq("organization_id",ctx.org.id)
          .maybeSingle(),
        8000,
        "Tempo excedido ao validar o novo superior."
      );
      if(parentError)throw parentError;
      if(!parent)throw Error("O novo superior não pertence à organização atual.");
    }

    const {data,error}=await withTimeout(
      db.from("positions")
        .update({manager_position_id:newParentId||null})
        .eq("id",positionId)
        .eq("organization_id",ctx.org.id)
        .select("id,manager_position_id")
        .maybeSingle(),
      10000,
      "O Supabase excedeu o tempo ao atualizar a hierarquia."
    );

    if(error)throw error;
    if(!data?.id)throw Error("O banco não confirmou a atualização da hierarquia.");
    if((data.manager_position_id||null)!==(newParentId||null)){
      throw Error("O banco retornou um superior diferente do solicitado.");
    }

    return data;
  },

  async syncPositionReportingLines(position){
    const ctx=await this.requireEditorSession();
    const db=this.db();
    const parents=position.reportingParents||{};
    const hasAnyRelation=["shared","functional","advisory"]
      .some(type=>(parents[type]||[]).length);

    const params={
      p_position_id:position.id,
      p_shared_parent_ids:parents.shared||[],
      p_functional_parent_ids:parents.functional||[],
      p_advisory_parent_ids:parents.advisory||[]
    };

    const {error}=await withTimeout(
      db.rpc("set_position_reporting_lines",params),
      12000,
      "O Supabase excedeu o tempo ao salvar as relações complementares."
    );

    if(!error)return true;
    if(!isMissingDatabaseObject(error))throw error;

    // Compatibilidade: instalações sem migration de reporting_lines.
    // Se não existem relações complementares para persistir, não há nada
    // que deva bloquear uma edição comum de cargo/hierarquia.
    if(!hasAnyRelation){
      console.warn(
        "position_reporting_lines ainda não está disponível; " +
        "sincronização complementar ignorada porque não há relações a salvar."
      );
      return true;
    }

    const {error:probeError}=await db.from("position_reporting_lines")
      .select("id")
      .eq("organization_id",ctx.org.id)
      .limit(1);

    if(probeError&&isMissingDatabaseObject(probeError)){
      throw Error(
        "As relações complementares deste cargo precisam da migration " +
        "011_complete_organograma_v1.sql. A hierarquia principal continua disponível."
      );
    }
    if(probeError)throw probeError;

    const {error:delErr}=await db.from("position_reporting_lines")
      .delete()
      .eq("organization_id",ctx.org.id)
      .eq("child_position_id",position.id)
      .is("end_date",null);
    if(delErr)throw delErr;

    const rows=[];
    for(const type of ["shared","functional","advisory"]){
      for(const parentId of parents[type]||[]){
        rows.push({
          organization_id:ctx.org.id,
          parent_position_id:parentId,
          child_position_id:position.id,
          relationship_type:type,
          start_date:new Date().toISOString().slice(0,10)
        });
      }
    }

    if(rows.length){
      const {error:insErr}=await db.from("position_reporting_lines").insert(rows);
      if(insErr)throw insErr;
    }

    return true;
  },

  async verifyPositionPersisted(position){
    const ctx=await this.requireEditorSession();
    const db=this.db();

    const {data,error}=await withTimeout(
      db.from("positions")
        .select("id,organization_id,department_id,title,organizational_level,seniority,manager_position_id,description,position_status,sort_order,registration_number,contract_status,signed_contracts,history_notes")
        .eq("id",position.id)
        .eq("organization_id",ctx.org.id)
        .maybeSingle(),
      10000,
      "O banco não respondeu à verificação da posição."
    );

    if(error)throw error;
    if(!data)throw Error("O banco não retornou a posição após o salvamento.");
    if(data.title!==position.title)throw Error("O banco não confirmou o nome do cargo.");
    if(data.department_id!==position.departmentId)throw Error("O banco não confirmou o departamento do cargo.");
    if(data.organizational_level!==position.level)throw Error("O banco não confirmou o nível organizacional.");
    if((data.manager_position_id||null)!==(position.reportsTo||null))throw Error("O banco não confirmou o superior hierárquico.");

    return data;
  },

  async savePositionReliable(position){
    const ctx=await this.requireEditorSession();
    const db=this.db();

    const params={
      p_position_id:position.id,
      p_organization_id:ctx.org.id,
      p_department_id:position.departmentId,
      p_title:position.title,
      p_organizational_level:position.level,
      p_seniority:position.seniority||null,
      p_manager_position_id:position.reportsTo||null,
      p_description:position.description||null,
      p_requested_status:position.status||"active",
      p_sort_order:Number(position.order)||1,
      p_employee_id:position.personId||null,
      p_registration_number:position.registrationNumber||null,
      p_contract_status:position.contractStatus||"pending",
      p_signed_contracts:position.signedContracts||null,
      p_history_notes:position.historyNotes||null
    };

    const {error}=await withTimeout(
      db.rpc("save_position_profile",params),
      15000,
      "O Supabase excedeu o tempo ao salvar o cargo."
    );

    if(error){
      if(!isMissingDatabaseObject(error))throw error;

      // Fallback compatível com instalações ainda sem migration 007.
      const row={
        id:position.id,
        organization_id:ctx.org.id,
        department_id:position.departmentId,
        title:position.title,
        organizational_level:position.level,
        seniority:position.seniority||null,
        manager_position_id:position.reportsTo||null,
        description:position.description||null,
        position_status:position.status||"active",
        sort_order:Number(position.order)||1,
        registration_number:position.registrationNumber||null,
        contract_status:position.contractStatus||"pending",
        signed_contracts:position.signedContracts||null,
        history_notes:position.historyNotes||null
      };

      const {error:fallbackError}=await withTimeout(
        db.from("positions").upsert(row,{onConflict:"id"}),
        12000,
        "O Supabase excedeu o tempo ao gravar o cargo."
      );
      if(fallbackError)throw fallbackError;

      const old=Ppl.pos(position.personId||"");
      if(position.personId&&old?.id!==position.id){
        await this.syncEmployeePositionDirect(
          position.personId,
          old?.id||null,
          position.id,
          position.departmentId
        );
      }
    }

    const vacancyPatch={
      vacancy_since:position.status==="vacant"?(position.vacancySince||null):null,
      vacancy_reason:position.status==="vacant"?(position.vacancyReason||null):null,
      vacancy_notes:position.status==="vacant"?(position.vacancyNotes||null):null,
      vacancy_owner_employee_id:position.status==="vacant"?(position.vacancyOwnerEmployeeId||null):null
    };
    const {error:vacErr}=await db.from("positions").update(vacancyPatch)
      .eq("id",position.id).eq("organization_id",ctx.org.id);
    if(vacErr&&!isMissingDatabaseObject(vacErr))throw vacErr;

    await this.syncPositionReportingLines(position);
    await this.verifyPositionPersisted(position);
    return true;
  },

  async deletePositionReliable(positionId){
    const ctx=await this.requireEditorSession();
    const db=this.db();

    const {error}=await withTimeout(
      db.rpc("delete_position_safe",{p_position_id:positionId}),
      12000,
      "O Supabase excedeu o tempo ao excluir o cargo."
    );

    if(error){
      if(!isMissingDatabaseObject(error))throw error;
      const {error:fallbackError}=await withTimeout(
        db.from("positions")
          .delete()
          .eq("id",positionId)
          .eq("organization_id",ctx.org.id),
        10000,
        "O Supabase excedeu o tempo ao excluir o cargo."
      );
      if(fallbackError)throw fallbackError;
    }

  async saveDepartmentReliable(department){
    const ctx=await this.requireEditorSession();
    const db=this.db();

    const params={
      p_department_id:department.id,
      p_organization_id:ctx.org.id,
      p_name:department.name,
      p_acronym:department.acronym||null,
      p_description:department.description||null,
      p_parent_department_id:department.parentDepartmentId||null,
      p_active:department.active!==false,
      p_leader_position_id:department.leaderPositionId||null
    };

    const {error}=await withTimeout(
      db.rpc("save_department_profile",params),
      15000,
      "O Supabase excedeu o tempo ao salvar o departamento."
    );

    if(error){
      if(!isMissingDatabaseObject(error))throw error;

      const row={
        id:department.id,
        organization_id:ctx.org.id,
        name:department.name,
        acronym:department.acronym||null,
        description:department.description||null,
        parent_department_id:department.parentDepartmentId||null,
        active:department.active!==false
      };

      const {error:fallbackError}=await withTimeout(
        db.from("departments").upsert(row,{onConflict:"id"}),
        12000,
        "O Supabase excedeu o tempo ao gravar o departamento."
      );
      if(fallbackError)throw fallbackError;
    }

    // Garante liderança oficial mesmo em instalações onde a RPC antiga
    // save_department_profile ainda não existia.
    const {data:currentLead,error:leadReadError}=await db.from("department_leaderships")
      .select("id,position_id")
      .eq("organization_id",ctx.org.id)
      .eq("department_id",department.id)
      .is("end_date",null)
      .maybeSingle();
    if(leadReadError)throw leadReadError;

    const desiredLead=department.leaderPositionId||null;
    if((currentLead?.position_id||null)!==desiredLead){
      if(currentLead?.id){
        const {error:closeLeadError}=await db.from("department_leaderships")
          .update({end_date:new Date().toISOString().slice(0,10)})
          .eq("id",currentLead.id);
        if(closeLeadError)throw closeLeadError;
      }
      if(desiredLead){
        const {error:newLeadError}=await db.from("department_leaderships").insert({
          organization_id:ctx.org.id,
          department_id:department.id,
          position_id:desiredLead,
          start_date:new Date().toISOString().slice(0,10)
        });
        if(newLeadError)throw newLeadError;
      }
    }

    await this.verifyDepartmentPersisted(department);
    return true;
  },

      db.from("employees")

        .eq("id",person.id)

    );

    const expected={
      full_name:String(person.name||"").trim(),
      email:person.email||null,
      phone:person.phone||null,
      hire_date:person.hireDate||null,
      employment_status:person.active===false?"terminated":"active"
    };

    const mismatch=[];

    if((data.employment_status||"")!==expected.employment_status)mismatch.push("status");

    if(mismatch.length){

  async saveEmployeeReliable(person,onStatus=()=>{}){
    const ctx=await this.requireEditorSession();
    const db=this.db();

    const params={
      p_employee_id:person.id,
      p_organization_id:ctx.org.id,
      p_full_name:String(person.name||"").trim(),
      p_email:person.email||null,
      p_phone:person.phone||null,
      p_hire_date:person.hireDate||null,
      p_employment_status:person.active===false?"terminated":"active"
    };

    onStatus("Gravando integrante no Supabase…");

    let rpcWorked=false;
    let rpcMissing=false;

    try{
      const {data,error}=await withTimeout(
        db.rpc("save_employee_profile",params),
        12000,
        "O Supabase excedeu o tempo ao salvar o integrante."
      );

      if(error){
        const msg=error?.message||"";
        // PGRST202 / 404 means migration 005 was not applied yet.
        if(/PGRST202|Could not find the function|404|save_employee_profile/i.test(msg)){
          rpcMissing=true;
        }else{
          throw error;
        }
      }else{
        rpcWorked=true;
      }
    }catch(error){
      const msg=error?.message||"";
      if(/PGRST202|Could not find the function|404|save_employee_profile/i.test(msg)){
        rpcMissing=true;
      }else{
        throw error;
      }
    }

    // Safe fallback so existing installations can still save before migration 005.
    if(!rpcWorked){
      onStatus(
        rpcMissing
          ?"RPC 005 ainda não encontrada · usando gravação direta segura…"
          :"Usando gravação direta segura…"
      );

      const row={
        id:person.id,
        organization_id:ctx.org.id,
        full_name:String(person.name||"").trim(),
        preferred_name:null,
        email:person.email||null,
        phone:person.phone||null,
        hire_date:person.hireDate||null,
        employment_status:person.active===false?"terminated":"active"
      };

        db.from("employees")
          .upsert(row,{onConflict:"id"})
          .select("id,organization_id,full_name,email,phone,hire_date,employment_status,photo_path")
          .single(),
        12000,
        "O Supabase excedeu o tempo ao gravar diretamente o integrante."
      );

      if(error)throw error;
      if(!data?.id)throw Error("O Supabase não confirmou a gravação do integrante.");
    }

    const verified=await this.verifyEmployeePersisted(person,onStatus);
    return {verified,ctx,rpcWorked,rpcMissing};
  },

  async uploadEmployeePhotoDirect(employeeId,blob,onStatus=()=>{}){
    if(!employeeId)throw Error("Funcionário não identificado para o upload.");
    if(!blob?.size)throw Error("A imagem processada está vazia.");

    const ctx=await this.getRestEditorContext();
    const urlBase=CFG.supabaseUrl.replace(/\/+$/,"");
    const bucket=encodeURIComponent(CFG.storageBucket||"employee-photos");
    const path=`${ctx.orgId}/${employeeId}/avatar.webp`;
    const encodedPath=path.split("/").map(encodeURIComponent).join("/");

    onStatus("Enviando foto diretamente ao Storage…");

    const uploadResponse=await fetchWithTimeout(
      `${urlBase}/storage/v1/object/${bucket}/${encodedPath}`,
      {
        method:"POST",
        headers:{
          "apikey":CFG.supabaseAnonKey,
          "Authorization":`Bearer ${ctx.token}`,
          "Content-Type":"image/webp",
          "cache-control":"3600",
          "x-upsert":"true"
        },
        body:blob
      },
      15000,
      "O upload da foto excedeu 15 segundos e foi cancelado."
    );

    if(!uploadResponse.ok){
      throw await readHttpError(uploadResponse,"O Storage recusou o upload da foto.");
    }

    onStatus("Foto recebida pelo Storage · registrando no funcionário…");

    const patchUrl=
      `${urlBase}/rest/v1/employees`+
      `?id=eq.${encodeURIComponent(employeeId)}`+
      `&organization_id=eq.${encodeURIComponent(ctx.orgId)}`+
      `&select=id,photo_path`;

    const patchResponse=await fetchWithTimeout(
      patchUrl,
      {
        method:"PATCH",
        headers:this.restHeaders(ctx.token,{
          "Content-Type":"application/json",
          "Prefer":"return=representation"
        }),
        body:JSON.stringify({photo_path:path})
      },
      10000,
      "A foto chegou ao Storage, mas o registro no funcionário excedeu o tempo limite."
    );

    if(!patchResponse.ok){
      const error=await readHttpError(
        patchResponse,
        "A foto chegou ao Storage, mas photo_path não pôde ser gravado."
      );
      error.photoUploaded=true;
      error.photoPath=path;
      throw error;
    }

    const rows=await patchResponse.json().catch(()=>[]);
    const updated=Array.isArray(rows)?rows[0]:rows;
    if(!updated?.id||updated.photo_path!==path){
      const error=Error("A foto foi enviada ao Storage, mas o Supabase não confirmou photo_path no funcionário.");
      error.photoUploaded=true;
      error.photoPath=path;
      throw error;
    }

    // Preview is optional. Never delete a successfully stored photo because this fails.
    let signedUrl="";
    try{
      onStatus("Foto salva · preparando visualização…");
      const {data:signed,error:signedError}=await withTimeout(
        ctx.root.storage.from(CFG.storageBucket).createSignedUrl(path,3600),
        6000,
        "Preview temporariamente indisponível."
      );
      if(!signedError&&signed?.signedUrl){
        signedUrl=`${signed.signedUrl}${signed.signedUrl.includes("?")?"&":"?"}v=${Date.now()}`;
      }
    }catch(error){
      console.warn("Foto salva; falha apenas ao gerar preview:",error);
    }

    return {path,signedUrl,stored:true};
  },

  async deleteEmployeePhotoDirect(employeeId,currentPath,onStatus=()=>{}){
    if(!employeeId)throw Error("Funcionário não identificado.");

    const ctx=await this.getRestEditorContext();
    const urlBase=CFG.supabaseUrl.replace(/\/+$/,"");
    const bucket=encodeURIComponent(CFG.storageBucket||"employee-photos");
    const path=currentPath||`${ctx.orgId}/${employeeId}/avatar.webp`;

    onStatus("Removendo foto…");

    // Primeiro limpa o vínculo no cadastro. Assim o sistema nunca mantém
    // referência quebrada mesmo se a remoção física do arquivo falhar.
    const patchUrl=
      `${urlBase}/rest/v1/employees`+
      `?id=eq.${encodeURIComponent(employeeId)}`+
      `&organization_id=eq.${encodeURIComponent(ctx.orgId)}`+
      `&select=id,photo_path`;

    const patchResponse=await fetchWithTimeout(
      patchUrl,
      {
        method:"PATCH",
        headers:this.restHeaders(ctx.token,{
          "Content-Type":"application/json",
          "Prefer":"return=representation"
        }),
        body:JSON.stringify({photo_path:null})
      },
      10000,
      "Tempo excedido ao remover o vínculo da foto."
    );

    if(!patchResponse.ok){
      throw await readHttpError(patchResponse,"Não foi possível remover a foto do cadastro.");
    }

    if(path){
      const encodedPath=path.split("/").map(encodeURIComponent).join("/");
      const deleteResponse=await fetchWithTimeout(
        `${urlBase}/storage/v1/object/${bucket}/${encodedPath}`,
        {
          method:"DELETE",
          headers:{
            "apikey":CFG.supabaseAnonKey,
            "Authorization":`Bearer ${ctx.token}`
          }
        },
        12000,
        "O vínculo foi removido, mas o Storage demorou para excluir o arquivo."
      );

      // 404 significa que o arquivo já não existia; o cadastro já está correto.
      if(!deleteResponse.ok&&deleteResponse.status!==404){
        console.warn("photo_path limpo; Storage não confirmou exclusão física.",await deleteResponse.text().catch(()=>""));
      }
    }

    return {removed:true};
  },

  async syncEmployeePositionDirect(employeeId,oldPositionId,newPositionId,departmentId,onStatus=()=>{}){
    if(oldPositionId===newPositionId)return {changed:false};

    const ctx=await this.getRestEditorContext();
    const db=this.db();

    if(departmentId&&newPositionId){
      onStatus("Atualizando departamento do cargo…");
      const {error}=await withTimeout(
        db.from("positions")
          .update({department_id:departmentId})
          .eq("id",newPositionId)
          .eq("organization_id",ctx.orgId),
        8000,
        "Tempo excedido ao atualizar o departamento."
      );
      if(error)throw error;
    }

    if(newPositionId){
      onStatus("Atualizando vínculo com o cargo…");
      const {error}=await withTimeout(
        db.rpc("change_employee_position",{
          p_employee_id:employeeId,
          p_new_position_id:newPositionId,
          p_effective_date:new Date().toISOString().slice(0,10),
          p_event_type:oldPositionId?"reassignment":"admission",
          p_notes:"Atualização realizada pela gestão do organograma."
        }),
        10000,
        "Tempo excedido ao atualizar o vínculo com o cargo."
      );
      if(error)throw error;
    }else if(oldPositionId){
      onStatus("Encerrando vínculo com o cargo…");
      const today=new Date().toISOString().slice(0,10);
      const {error}=await withTimeout(
        db.from("position_assignments")
          .update({end_date:today})
          .eq("employee_id",employeeId)
          .eq("position_id",oldPositionId)
          .is("end_date",null),
        8000,
        "Tempo excedido ao encerrar o vínculo com o cargo."
      );
      if(error)throw error;
    }

    return {changed:true};
  },

  async saveEmployee(person,desiredPositionId=null,desiredDepartmentId=null,onStatus=()=>{}){
    await ensureSupabaseSDK();
    const ctx=await this.requireEditorSession();
    const db=this.db();
    const orgId=ctx.org.id;

    const employeeRow={
      id:person.id,
      organization_id:orgId,
      full_name:person.name,
      preferred_name:null,
      email:person.email||null,
      phone:person.phone||null,
      hire_date:person.hireDate||null,
      employment_status:person.active===false?"terminated":"active",
      photo_path:person.photoPath||null
    };

    onStatus("Gravando dados do funcionário…");
    const {data:saved,error:employeeError}=await withTimeout(
      db.from("employees")
        .upsert(employeeRow)
        .select("id,full_name,email,phone,hire_date,employment_status,photo_path")
        .single(),
      18000,
      "Tempo excedido ao salvar o funcionário."
    );
    if(employeeError)throw employeeError;
    if(!saved?.id)throw Error("O Supabase não confirmou o salvamento do funcionário.");

    onStatus("Sincronizando cargo atual…");
    const {data:current,error:currentError}=await withTimeout(
      db.from("position_assignments")
        .select("id,position_id,start_date")
        .eq("employee_id",person.id)
        .is("end_date",null)
        .maybeSingle(),
      12000,
      "Tempo excedido ao consultar o cargo atual."
    );
    if(currentError)throw currentError;

    const desired=desiredPositionId||null;

    if(desiredDepartmentId&&desired){
      const {error:positionDeptError}=await withTimeout(
        db.from("positions")
          .update({department_id:desiredDepartmentId})
          .eq("id",desired)
          .eq("organization_id",orgId),
        12000,
        "Tempo excedido ao atualizar o departamento da posição."
      );
      if(positionDeptError)throw positionDeptError;
    }

    if(current?.position_id!==desired){
      if(desired){
        const {error:moveError}=await withTimeout(
          db.rpc("change_employee_position",{
            p_employee_id:person.id,
            p_new_position_id:desired,
            p_effective_date:new Date().toISOString().slice(0,10),
            p_event_type:current?"reassignment":"admission",
            p_notes:"Atualização realizada pela gestão do organograma."
          }),
          18000,
          "Tempo excedido ao atualizar o cargo do funcionário."
        );
        if(moveError)throw moveError;
      }else if(current){
        const today=new Date().toISOString().slice(0,10);
        const {error:endError}=await withTimeout(
          db.from("position_assignments")
            .update({end_date:today})
            .eq("id",current.id),
          12000,
          "Tempo excedido ao remover o vínculo com o cargo."
        );
        if(endError)throw endError;
      }
    }

    onStatus("Dados confirmados no Supabase.");
    return saved;
  },

    }));

    for(const [table,rows] of [["departments",deps],["employees",emps],["positions",positions]]){
      const {error}=await sb.from(table).upsert(rows);
      if(error)throw error;
    }

    const {data:current,error:curErr}=await sb.from("position_assignments")
      .select("id,employee_id,position_id,start_date")
      .eq("organization_id",orgId)
      .is("end_date",null);

    if(curErr)throw curErr;

    const byEmp=new Map((current||[]).map(a=>[a.employee_id,a]));
    const desiredByEmp=new Map(d.positions.filter(p=>p.personId).map(p=>[p.personId,p.id]));
    const today=new Date().toISOString().slice(0,10);

    for(const a of current||[]){
      if(desiredByEmp.get(a.employee_id)!==a.position_id){
        const end=new Date(`${today}T00:00:00`);
        end.setDate(end.getDate()-1);
        const {error}=await sb.from("position_assignments")
          .update({end_date:end.toISOString().slice(0,10)})
          .eq("id",a.id);
        if(error)throw error;
      }
    }

    for(const [employeeId,positionId] of desiredByEmp){
      const curr=byEmp.get(employeeId);
      if(curr?.position_id===positionId)continue;
      const {error}=await sb.rpc("change_employee_position",{
        p_employee_id:employeeId,
        p_new_position_id:positionId,
        p_effective_date:today,
        p_event_type:curr?"reassignment":"admission",
        p_notes:"Atualização realizada pelo organograma web."
      });
      if(error)throw error;
    }
  },
  async reset(){throw Error("Reset do seed não é permitido no provider Supabase.")}
};


async function registerLocalMovement(employeeId,eventType,effectiveDate,newPositionId=null,notes=""){
  const person=Ppl.get(employeeId);
  if(!person)throw Error("Funcionário não encontrado.");
  if(!effectiveDate)throw Error("Informe a data efetiva.");
  if(effectiveDate>new Date().toISOString().slice(0,10))throw Error("A data efetiva não pode estar no futuro.");

  const current=Ppl.pos(employeeId);
  const target=newPositionId?Pos.get(newPositionId):null;
  const changeTypes=new Set(["admission","promotion","transfer","role_change"]);

  if(changeTypes.has(eventType)){
    if(!target)throw Error("Selecione o novo cargo para esta movimentação.");
    if(target.status==="inactive")throw Error("O cargo de destino está inativo.");
    if(target.personId&&target.personId!==employeeId)throw Error("O cargo de destino já está ocupado.");
    if(current?.id===target.id)throw Error("O funcionário já ocupa este cargo.");
    if(eventType!=="admission"&&!current)throw Error("O funcionário não possui cargo atual para esta movimentação.");

    const currentHistory=employeePositionHistory(employeeId).find(x=>x.current||!x.endDate);
    if(currentHistory?.startDate&&effectiveDate<currentHistory.startDate){
      throw Error("A data não pode ser anterior ao início do cargo atual.");
    }
    if(currentHistory){
      currentHistory.endDate=previousIsoDate(effectiveDate);
      currentHistory.current=false;
    }
    if(current){
      current.personId=null;
      if(current.status!=="inactive"){
        current.status="vacant";
        current.vacancySince=effectiveDate;
      }
    }

    target.personId=employeeId;
    target.status="active";
    target.vacancySince=null;
    target.vacancyReason="";
    target.vacancyNotes="";
    target.vacancyOwnerEmployeeId=null;

    const assignmentType=eventType==="role_change"?"reassignment":eventType;
    state.data.positionHistory.push({
      id:U.id("history"),employeeId,positionId:target.id,title:target.title,
      departmentId:target.departmentId||null,
      departmentName:Dep.get(target.departmentId)?.name||"",
      startDate:effectiveDate,endDate:null,assignmentType,
      notes:String(notes||"").trim(),current:true
    });

    person.employmentStatus="active";
    person.active=true;
  }else if(eventType==="leave"){
    person.employmentStatus="leave";
    person.active=true;
  }else if(eventType==="return"){
    person.employmentStatus="active";
    person.active=true;
  }else if(eventType==="termination"){
    person.employmentStatus="terminated";
    person.active=false;
    const currentHistory=employeePositionHistory(employeeId).find(x=>x.current||!x.endDate);
    if(currentHistory){
      currentHistory.endDate=effectiveDate;
      currentHistory.current=false;
    }
    if(current){
      current.personId=null;
      if(current.status!=="inactive"){
        current.status="vacant";
        current.vacancySince=effectiveDate;
      }
    }
  }

  state.data.employmentEvents??=[];
  state.data.employmentEvents.unshift({
    id:U.id("event"),employeeId,eventType,eventDate:effectiveDate,
    fromPositionId:current?.id||null,toPositionId:target?.id||null,
    notes:String(notes||"").trim(),createdAt:new Date().toISOString()
  });

  activity(`${historyTypeLabel(eventType)}: ${person.name}${target?` → ${target.title}`:""}`);
  await LocalProvider.save(state.data);
  return true;
}

async function registerLocalPromotion(employeeId,newPositionId,acquiredOn,notes=""){
  return registerLocalMovement(employeeId,"promotion",acquiredOn,newPositionId,notes);
}

const Ppl={get:id=>state.data.people.find(x=>x.id===id)||null,pos:id=>state.data.positions.find(x=>x.personId===id)||null};
const Dep={get:id=>state.data.departments.find(x=>x.id===id)||null,pos:id=>state.data.positions.filter(x=>x.departmentId===id&&x.status!=="inactive")};
const Pos={
get:id=>state.data.positions.find(x=>x.id===id)||null,
kids:id=>state.data.positions.filter(x=>x.reportsTo===id&&x.status!=="inactive").sort((a,b)=>a.order-b.order||a.title.localeCompare(b.title,"pt-BR")),
desc(id){const s=new Set(),go=x=>this.kids(x).forEach(c=>{if(!s.has(c.id)){s.add(c.id);go(c.id)}});go(id);return s},
validParent(id,parent){return !parent||id!==parent&&!this.desc(id).has(parent)},
async upsert(input){
  const e={};
  if(!String(input.title||"").trim())e.title="Informe o nome do cargo.";
  if(!LEVELS[input.level])e.level="Selecione um nível válido.";
  if(!Dep.get(input.departmentId))e.departmentId="Selecione um departamento.";
  if(input.id&&input.reportsTo&&!this.validParent(input.id,input.reportsTo))e.reportsTo="Este superior criaria um ciclo hierárquico.";
  if(input.reportsTo&&!this.get(input.reportsTo))e.reportsTo="Superior inválido.";
  if(input.personId){
    const q=state.data.positions.find(x=>x.personId===input.personId&&x.id!==input.id);
    if(q)e.personId="Este colaborador já ocupa outra posição.";
  }
  if(Object.keys(e).length)return{ok:false,e};

  const p={
    ...input,
    id:input.id||U.id("pos"),
    title:String(input.title||"").trim(),
    reportsTo:input.reportsTo||null,
    personId:input.personId||null,
    order:+input.order||1,
    status:input.status||"active",
    registrationNumber:String(input.registrationNumber||"").trim(),
    contractStatus:["pending","signed","not_applicable"].includes(input.contractStatus)?input.contractStatus:"pending",
    signedContracts:String(input.signedContracts||"").trim(),
    historyNotes:String(input.historyNotes||"").trim(),
    vacancySince:input.status==="vacant"?(input.vacancySince||null):null,
    vacancyReason:input.status==="vacant"?String(input.vacancyReason||"").trim():"",
    vacancyNotes:input.status==="vacant"?String(input.vacancyNotes||"").trim():"",
    vacancyOwnerEmployeeId:input.status==="vacant"?(input.vacancyOwnerEmployeeId||null):null,
    reportingParents:input.reportingParents||{shared:[],functional:[],advisory:[]}
  };

  for(const type of ["shared","functional","advisory"]){
    p.reportingParents[type]=[...new Set((p.reportingParents[type]||[])
      .filter(parentId=>parentId&&parentId!==p.id&&parentId!==p.reportsTo))];
  }

  const wasExisting=!!this.get(p.id);

  if(CFG.dataProvider==="supabase"){
    try{
      await SupabaseProvider.savePositionReliable(p);
      state.data=normalizeLiveHierarchy(normalizeAppData(await SupabaseProvider.load()));
      activity(`${wasExisting?"Cargo atualizado":"Cargo criado"}: ${p.title}`);
      return{ok:true,p:this.get(p.id)||p};
    }catch(error){
      return{ok:false,e:{_global:friendlySupabaseError(error)}};
    }
  }

  const ex=this.get(p.id);
  if(ex)Object.assign(ex,p);
  else state.data.positions.push(p);

  state.data.reportingLines=(state.data.reportingLines||[]).filter(line=>line.childId!==p.id);
  for(const type of ["shared","functional","advisory"]){
    for(const parentId of p.reportingParents?.[type]||[]){
      state.data.reportingLines.push({id:U.id("report"),parentId,childId:p.id,type,label:""});
    }
  }

  activity(`${ex?"Cargo atualizado":"Cargo criado"}: ${p.title}`);
  await LocalProvider.save(state.data);
  return{ok:true,p:ex||p};
},
async remove(id){
  const p=this.get(id);
  if(!p)return{ok:false,msg:"Cargo não encontrado."};
  if(this.kids(id).length)return{ok:false,msg:"Mova ou exclua os subordinados antes."};

  const supplementalChildren=(state.data.reportingLines||[]).filter(x=>x.parentId===id);
  if(supplementalChildren.length){
    return{ok:false,msg:"Remova as relações complementares de liderança antes de excluir este cargo."};
  }

  if(CFG.dataProvider==="supabase"){
    try{
      await SupabaseProvider.deletePositionReliable(id);
      state.data=normalizeLiveHierarchy(normalizeAppData(await SupabaseProvider.load()));
      activity(`Cargo excluído: ${p.title}`);
      return{ok:true};
    }catch(error){
      return{ok:false,msg:friendlySupabaseError(error)};
    }
  }

  state.data.positions=state.data.positions.filter(x=>x.id!==id);
  state.data.reportingLines=(state.data.reportingLines||[]).filter(x=>x.parentId!==id&&x.childId!==id);
  state.data.departments.forEach(d=>{
    if(d.leaderPositionId===id)d.leaderPositionId=null;
  });
  activity(`Cargo excluído: ${p.title}`);
  await LocalProvider.save(state.data);
  return{ok:true};
}
};
function activity(text){state.data.activity??=[];state.data.activity.unshift({id:U.id("a"),text,at:new Date().toISOString()});state.data.activity=state.data.activity.slice(0,20)}
function stats(){const p=state.data.positions.filter(x=>x.status!=="inactive");return{dep:state.data.departments.filter(x=>x.active).length,pos:p.length,occ:p.filter(x=>x.personId&&x.status!=="vacant").length,vac:p.filter(x=>!x.personId||x.status==="vacant").length,ppl:state.data.people.filter(x=>x.active).length}}
function tree(){const map=new Map(state.data.positions.filter(x=>x.status!=="inactive").map(x=>[x.id,{...x,children:[]}])) ,roots=[];map.forEach(n=>{if(n.reportsTo&&map.has(n.reportsTo))map.get(n.reportsTo).children.push(n);else roots.push(n)});map.forEach(n=>n.children.sort((a,b)=>a.order-b.order||a.title.localeCompare(b.title,"pt-BR")));roots.sort((a,b)=>a.order-b.order);return{roots,map}}
function chain(id){const a=[],seen=new Set();let p=Pos.get(id);while(p&&!seen.has(p.id)){seen.add(p.id);a.unshift(p);p=p.reportsTo?Pos.get(p.reportsTo):null}return a}
function expandAnc(id){chain(id).forEach(p=>{state.exp.add(p.id);state.mexp.add(p.id);state.aexp.add(p.id)})}
function vm(p){return{p,person:Ppl.get(p.personId),dep:Dep.get(p.departmentId),kids:Pos.kids(p.id),lev:LEVELS[p.level]}}
function matches(p){const v=vm(p),q=U.norm(state.search.trim()),s=!q||[v.person?.name,p.title,v.dep?.name,p.seniority].some(x=>U.norm(x||"").includes(q)),l=state.filters.level==="all"||p.level===state.filters.level,d=state.filters.dep==="all"||p.departmentId===state.filters.dep,st=!p.personId||p.status==="vacant"?"vacant":p.status,z=state.filters.status==="all"||st===state.filters.status;return s&&l&&d&&z}
function visible(){const ps=state.data.positions.filter(x=>x.status!=="inactive"),m=new Set(ps.filter(matches).map(x=>x.id));if(!state.search&&Object.values(state.filters).every(x=>x==="all"))return new Set(ps.map(x=>x.id));const v=new Set(m);m.forEach(id=>chain(id).forEach(x=>v.add(x.id)));return v}

function commandItems(query=""){
  const q=U.norm(String(query||"").trim());

  if(!q){
    return [
      {kind:"route",route:"#/organograma",title:"Abrir Organograma",subtitle:"Visão hierárquica da empresa",icon:I.hier,group:"Atalhos"},
      {kind:"route",route:"#/departamentos",title:"Abrir Departamentos",subtitle:"Áreas, líderes e composição",icon:I.building,group:"Atalhos"},
      {kind:"route",route:"#/pessoas",title:"Abrir Pessoas",subtitle:"Diretório de colaboradores",icon:I.users,group:"Atalhos"},
      {kind:"route",route:"#/gestao",title:"Gestão da estrutura",subtitle:"Administração do organograma",icon:I.set,group:"Administração"}
    ];
  }

  const results=[];

  state.data.people.forEach(person=>{
    const position=Ppl.pos(person.id);
    const department=position?Dep.get(position.departmentId):null;
    const hay=U.norm([
      person.name,
      person.email,
      person.phone,
      position?.title,
      department?.name
    ].filter(Boolean).join(" "));

    if(!hay.includes(q))return;

    const nameNorm=U.norm(person.name);
    results.push({
      kind:"person",
      id:person.id,
      positionId:position?.id||"",
      title:person.name,
      subtitle:[position?.title,department?.name].filter(Boolean).join(" · ")||"Sem posição vinculada",
      icon:avatar(person),
      group:"Pessoas",
      score:nameNorm.startsWith(q)?0:nameNorm.includes(q)?1:2
    });
  });

  state.data.positions
    .filter(p=>p.status!=="inactive")
    .forEach(position=>{
      const person=Ppl.get(position.personId);
      const department=Dep.get(position.departmentId);
      const hay=U.norm([
        position.title,
        position.seniority,
        person?.name,
        department?.name
      ].filter(Boolean).join(" "));

      if(!hay.includes(q))return;

      const titleNorm=U.norm(position.title);
      results.push({
        kind:"position",
        id:position.id,
        title:position.title,
        subtitle:[person?.name||"Posição em aberto",department?.name].filter(Boolean).join(" · "),
        icon:I.brief,
        group:"Cargos",
        score:titleNorm.startsWith(q)?0:titleNorm.includes(q)?1:2
      });
    });

  state.data.departments
    .filter(d=>d.active)
    .forEach(department=>{
      const hay=U.norm([
        department.name,
        department.acronym,
        department.description
      ].filter(Boolean).join(" "));

      if(!hay.includes(q))return;

      const nameNorm=U.norm(department.name);
      results.push({
        kind:"department",
        id:department.id,
        title:department.name,
        subtitle:department.description||`${Dep.pos(department.id).length} posições`,
        icon:I.building,
        group:"Departamentos",
        score:nameNorm.startsWith(q)?0:nameNorm.includes(q)?1:2
      });
    });

  return results
    .sort((a,b)=>a.score-b.score||a.group.localeCompare(b.group,"pt-BR")||a.title.localeCompare(b.title,"pt-BR"))
    .slice(0,12);
}

function commandResultsMarkup(query=""){
  const items=commandItems(query);

  if(!items.length){
    return `<div class="command-empty">
      <span class="command-empty-icon">${I.search}</span>
      <strong>Nenhum resultado</strong>
      <span>Tente buscar por nome, cargo, e-mail ou departamento.</span>
    </div>`;
  }

  let currentGroup="";
  return items.map((item,index)=>{
    const group=item.group!==currentGroup
      ? `<div class="command-group-label">${U.esc(item.group)}</div>`
      :"";
    currentGroup=item.group;

    return `${group}<button
      type="button"
      id="command-result-${index}"
      class="command-result ${index===state.commandIndex?"selected":""}"
      data-command-index="${index}"
      data-command-kind="${item.kind}"
      ${item.id?`data-command-id="${U.esc(item.id)}"`:""}
      ${item.positionId?`data-command-position="${U.esc(item.positionId)}"`:""}
      ${item.route?`data-command-route="${U.esc(item.route)}"`:""}
    >
      <span class="command-result-icon">${item.icon}</span>
      <span class="command-result-copy">
        <strong>${U.esc(item.title)}</strong>
        <small>${U.esc(item.subtitle||"")}</small>
      </span>
      <span class="command-result-enter">↵</span>
    </button>`;
  }).join("");
}

function ensureCommandCenter(){
  let host=document.getElementById("commandCenterHost");
  if(!host){
    host=document.createElement("div");
    host.id="commandCenterHost";
    document.body.appendChild(host);
  }
  return host;
}

function renderCommandCenter(){
  const host=ensureCommandCenter();

  host.innerHTML=`<div
    id="commandBackdrop"
    class="command-backdrop ${state.commandOpen?"open":""}"
    aria-hidden="${state.commandOpen?"false":"true"}"
  >
    <section
      id="commandCenter"
      class="command-center"
      role="dialog"
      aria-modal="true"
      aria-label="Busca global"
    >
      <div class="command-search-row">
        ${I.search}
        <input
          id="commandSearchInput"
          type="search"
          autocomplete="off"
          spellcheck="false"
          value="${U.esc(state.commandQuery||"")}"
          placeholder="Buscar pessoa, cargo ou departamento..."
          aria-label="Buscar pessoa, cargo ou departamento"
          aria-controls="commandResults"
          aria-activedescendant="command-result-${state.commandIndex}"
        >
        <kbd>Esc</kbd>
      </div>

      <div id="commandResults" class="command-results">
        ${commandResultsMarkup(state.commandQuery)}
      </div>

      <div class="command-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> navegar</span>
        <span><kbd>↵</kbd> abrir</span>
        <span>Busca global</span>
      </div>
    </section>
  </div>`;

  requestAnimationFrame(()=>{
    const input=document.getElementById("commandSearchInput");
    if(state.commandOpen&&input){
      input.focus({preventScroll:true});
      const len=input.value.length;
      input.setSelectionRange?.(len,len);
    }
  });
}

function openCommandCenter(initial=""){
  if(!state.data)return;
  state.commandReturnFocus=document.activeElement instanceof HTMLElement?document.activeElement:null;
  state.profileOpen=false;
  document.getElementById("profileMenu")?.classList.remove("open");
  document.getElementById("profileMenuBtn")?.classList.remove("active");

  state.commandOpen=true;
  state.commandQuery=String(initial||"");
  state.commandIndex=0;

  const app=document.getElementById("app");
  if(app)app.inert=true;

  renderCommandCenter();
}

function closeCommandCenter(){
  state.commandOpen=false;
  state.commandQuery="";
  state.commandIndex=0;

  const app=document.getElementById("app");
  if(app)app.inert=false;

  document.getElementById("commandCenterHost")?.remove();

  const target=state.commandReturnFocus;
  state.commandReturnFocus=null;
  requestAnimationFrame(()=>{
    if(target?.isConnected)target.focus({preventScroll:true});
  });
}

function refreshCommandResults(){
  const results=document.getElementById("commandResults");
  if(!results)return;

  const items=commandItems(state.commandQuery);
  state.commandIndex=Math.max(0,Math.min(state.commandIndex,Math.max(0,items.length-1)));
  results.innerHTML=commandResultsMarkup(state.commandQuery);
}

function syncCommandSelection(){
  const results=[...document.querySelectorAll(".command-result")];
  if(!results.length)return;

  results.forEach((el,index)=>{
    el.classList.toggle("selected",index===state.commandIndex);
  });

  const active=results[state.commandIndex];
  document.getElementById("commandSearchInput")
    ?.setAttribute("aria-activedescendant",active?.id||"");

  active?.scrollIntoView({
    block:"nearest",
    behavior:"auto"
  });

function openCommandPosition(positionId){
  if(!positionId)return;

  closeCommandCenter();
  state.search="";
  state.filters={level:"all",dep:"all",status:"all"};
  state.selected=positionId;
  navigateTo("#/organograma");

  let attempts=0;
  const reveal=()=>{
    attempts++;
    const card=document.querySelector(`[data-slot-pos="${positionId}"] .ref-node`);
    if(card){
      openDrawer(positionId);
      requestAnimationFrame(()=>centerSelected?.());
      return;
    }
    if(attempts<16)setTimeout(reveal,45);
  };
  setTimeout(reveal,40);
}

function openCommandDepartment(departmentId){
  const department=Dep.get(departmentId);
  if(!department)return;

  closeCommandCenter();
  navigateTo("#/departamentos");

  let attempts=0;
  const reveal=()=>{
    attempts++;
    const card=document.querySelector(`[data-department-card="${departmentId}"]`);
    if(card){
      card.scrollIntoView({block:"center",behavior:"smooth"});
      card.classList.add("command-highlight");
      setTimeout(()=>card.classList.remove("command-highlight"),1500);
      return;
    }
    if(attempts<16)setTimeout(reveal,45);
  };
  setTimeout(reveal,40);
}

function activateCommandElement(element){
  if(!element)return;

  const kind=element.dataset.commandKind;
  const id=element.dataset.commandId||"";
  const route=element.dataset.commandRoute||"";

  if(kind==="route"&&route){
    closeCommandCenter();
    navigateTo(route);
    return;
  }

  if(kind==="position"){
    openCommandPosition(id);
    return;
  }

  if(kind==="person"){
    const positionId=element.dataset.commandPosition||Ppl.pos(id)?.id||"";
    if(positionId){
      openCommandPosition(positionId);
    }else{
      const person=Ppl.get(id);
      closeCommandCenter();
      state.search=person?.name||"";
      navigateTo("#/pessoas");
    }
    return;
  }

  if(kind==="department"){
    openCommandDepartment(id);
  }
}

function renderZoneGraph(vis){
  const all=(state.data.positions||[])
    .filter(p=>p.status!=="inactive"&&vis.has(p.id));

  const byId=new Map(all.map(p=>[p.id,p]));
  const normalizeLevel=p=>
    ["strategic","tactical","operational"].includes(p?.level)
      ?p.level
      :"operational";

  const baseSort=(a,b)=>
    (a.order||0)-(b.order||0)||
    String(a.title||"").localeCompare(String(b.title||""),"pt-BR");

  const strategic=all.filter(p=>normalizeLevel(p)==="strategic").sort(baseSort);
  const tactical=all.filter(p=>normalizeLevel(p)==="tactical").sort(baseSort);
  const operational=all.filter(p=>normalizeLevel(p)==="operational").sort(baseSort);

  const xById=new Map();

  // Mantém exatamente a composição estratégica atual.
  if(strategic.length===1){
    xById.set(strategic[0].id,50);
  }else if(strategic.length===2){
    xById.set(strategic[0].id,41);
    xById.set(strategic[1].id,59);
  }else{
    strategic.forEach((p,i)=>{
      xById.set(p.id,32+(36*(i/(strategic.length-1))));
    });
  }

  // Mantém exatamente a faixa tática atual.
  if(tactical.length===1){
    xById.set(tactical[0].id,50);
  }else{
    const min=34,max=66;
    tactical.forEach((p,i)=>{
      xById.set(p.id,min+(max-min)*(i/(tactical.length-1)));
    });
  }

  // Ordena os operacionais pelo líder real, sem alterar nenhum vínculo.
  const groups=new Map();
  operational.forEach(position=>{
    const key=position.reportsTo||"__root__";
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(position);
  });

  const parentX=parentId=>{
    if(parentId==="__root__")return 50;
    const direct=xById.get(parentId);
    if(direct!=null)return direct;
    const parent=byId.get(parentId)||Pos.get(parentId);
    if(parent?.reportsTo){
      const ancestor=xById.get(parent.reportsTo);
      if(ancestor!=null)return ancestor;
    }
    return 50;
  };

  const orderedGroups=[...groups.entries()]
    .map(([parentId,children])=>({
      parentId,
      targetX:parentX(parentId),
      children:[...children].sort(baseSort)
    }))
    .sort((a,b)=>a.targetX-b.targetX);

  const operationalOrdered=orderedGroups.flatMap(group=>group.children);

  // A largura é calculada pelo espaço VISUAL real de cada card.
  // Isso elimina sobreposição sem mexer nos dados ou na hierarquia.
  const visualCardStep=236;
  const sideAllowance=400;
  const minWidth=Math.max(
    1380,
    operationalOrdered.length
      ?operationalOrdered.length*visualCardStep+sideAllowance
      :1380
  );

  if(operationalOrdered.length===1){
    const only=operationalOrdered[0];
    xById.set(only.id,parentX(only.reportsTo||"__root__"));
  }else if(operationalOrdered.length>1){
    const desired=[];

    orderedGroups.forEach(group=>{
      const count=group.children.length;
      const localStep=(visualCardStep/minWidth)*100;
      const localSpan=(count-1)*localStep;

      group.children.forEach((child,index)=>{
        desired.push({
          child,
          x:group.targetX-localSpan/2+index*localStep
        });
      });
    });

    desired.sort((a,b)=>a.x-b.x);

    // Espaçamento mínimo baseado na largura do card + retrato externo.
    const minStepPct=(visualCardStep/minWidth)*100;
    const desiredCenter=desired.reduce((sum,item)=>sum+item.x,0)/desired.length;
    const totalSpan=minStepPct*(desired.length-1);

    let first=desiredCenter-totalSpan/2;
    const minCenter=10.5;
    const maxCenter=89.5;

    first=Math.max(minCenter,Math.min(first,maxCenter-totalSpan));

    desired.forEach((item,index)=>{
      xById.set(item.child.id,first+index*minStepPct);
    });
  }

  const zone=(label,cls,items,depth)=>{
    return `<section class="map-zone ${cls} ${items.length?"":"empty-zone"}">
      <div class="map-zone-label">${U.esc(label)}</div>
      <div class="map-zone-grid anchored-zone-grid">
        ${items.map((p,index)=>{
          const x=xById.get(p.id)??50;
          const secondStrategic=
            normalizeLevel(p)==="strategic"&&strategic.length>1&&index===1;

          return `<div
            class="map-zone-slot hierarchy-slot anchored-slot ${secondStrategic?"strategic-secondary":""}"
            data-slot-pos="${p.id}"
            data-parent-pos="${U.esc(p.reportsTo||"")}"
            data-zone-level="${normalizeLevel(p)}"
            data-zone-index="${index}"
            style="--slot-x:${x.toFixed(3)}%"
          >${node(p,depth)}</div>`;
        }).join("")}
      </div>
    </section>`;
  };

  return `<div
    id="orgZoneGraph"
    class="org-zone-graph hierarchy-zone-graph hierarchy-zone-compact"
    style="--hier-min-width:${minWidth}px"
  >
    <svg id="orgLinksSvg" class="org-links-svg" aria-hidden="true"></svg>
    ${zone("Estratégico","map-zone-strategic",strategic,0)}
    ${zone("Tático","map-zone-tactical",tactical,1)}
    ${zone("Operacional","map-zone-operational",operationalOrdered,2)}
  </div>`;
}
function drawOrgLinks(){
  const graph=document.getElementById("orgZoneGraph");
  const svg=document.getElementById("orgLinksSvg");
  if(!graph||!svg)return;

  const slots=[...graph.querySelectorAll("[data-slot-pos]")];
  if(!slots.length){
    svg.innerHTML="";
    return;
  }

  const graphRect=graph.getBoundingClientRect();
  const zoom=state.zoom||1;
  const width=Math.max(1,graph.scrollWidth);
  const height=Math.max(1,graph.scrollHeight);

  svg.setAttribute("viewBox",`0 0 ${width} ${height}`);
  svg.setAttribute("width",width);
  svg.setAttribute("height",height);

  const esc=value=>window.CSS?.escape
    ?CSS.escape(value)
    :String(value).replace(/["\\]/g,"\\$&");

  const rectFor=id=>{
    const el=graph.querySelector(`[data-slot-pos="${esc(id)}"] .ref-node`);
    if(!el)return null;
    const r=el.getBoundingClientRect();

    return {
      left:(r.left-graphRect.left)/zoom,
      right:(r.right-graphRect.left)/zoom,
      top:(r.top-graphRect.top)/zoom,
      bottom:(r.bottom-graphRect.top)/zoom,
      width:r.width/zoom,
      height:r.height/zoom,
      cx:(r.left-graphRect.left+r.width/2)/zoom,
      cy:(r.top-graphRect.top+r.height/2)/zoom
    };
  };

  const visibleAll=new Set(
    slots.map(x=>x.dataset.slotPos).filter(Boolean)
  );

  const focusActive=!!state.orgFocusId;
  const activeIds=focusActive
    ?orgVisualFocusSet(state.orgFocusId)
    :visibleAll;

  const visibleIds=new Set(
    [...visibleAll].filter(id=>activeIds.has(id))
  );

  const pathClass=focusActive
    ?"org-connector focus-link"
    :"org-connector";
  const fmt=n=>(Math.round(n*10)/10).toFixed(1);

  const paths=[];

  // --------------------------------------------------------
  // SHARED STRATEGIC -> TACTICAL
  // One common bus from Ricardo and Dariane to all tactical leaders.
  // --------------------------------------------------------
  const sharedGroups=reportingParentSets().filter(group=>
    group.type==="shared"&&
    group.parentIds.filter(id=>Pos.get(id)?.level==="strategic").length>=2
  );

  const representedPairs=new Set();

  sharedGroups.forEach(group=>{
    const leaders=group.parentIds
      .filter(id=>visibleIds.has(id)&&Pos.get(id)?.level==="strategic")
      .map(id=>({id,rect:rectFor(id)}))
      .filter(x=>x.rect)
      .sort((a,b)=>a.rect.cx-b.rect.cx);

    const children=group.childIds
      .filter(id=>visibleIds.has(id)&&Pos.get(id)?.level==="tactical")
      .map(id=>({id,rect:rectFor(id)}))
      .filter(x=>x.rect)
      .sort((a,b)=>a.rect.cx-b.rect.cx);

    if(!leaders.length||!children.length)return;

    leaders.forEach(l=>{
      children.forEach(c=>representedPairs.add(`${l.id}>${c.id}`));
    });

    const lowestLeaderBottom=Math.max(...leaders.map(x=>x.rect.bottom));
    const childTop=Math.min(...children.map(x=>x.rect.top));

    // Bus sits cleanly in the empty band between Strategic and Tactical.
    const busY=lowestLeaderBottom+(childTop-lowestLeaderBottom)*.56;
    const xs=[...leaders.map(x=>x.rect.cx),...children.map(x=>x.rect.cx)];

    const commands=[
      `M ${fmt(Math.min(...xs))} ${fmt(busY)} H ${fmt(Math.max(...xs))}`
    ];

    leaders.forEach(({rect})=>{
      commands.push(
        `M ${fmt(rect.cx)} ${fmt(rect.bottom-1)} V ${fmt(busY)}`
      );
    });

    children.forEach(({rect})=>{
      commands.push(
        `M ${fmt(rect.cx)} ${fmt(busY)} V ${fmt(rect.top+1)}`
      );
    });

    paths.push(`<path
      class="${pathClass} supplemental-connector relation-shared strategic-shared-bus"
      data-kind="shared"
      data-from="${U.esc(leaders.map(x=>x.id).join(","))}"
      data-to="${U.esc(children.map(x=>x.id).join(","))}"
      d="${commands.join(" ")}"
    />`);
  });

  // --------------------------------------------------------
  // FORMAL RELATIONSHIPS
  // Group children by their actual manager.
  // Shared Strategic -> Tactical is omitted because the bus above
  // already represents it.
  // --------------------------------------------------------
  const childrenByParent=new Map();

  (state.data.positions||[]).forEach(child=>{
    if(
      child.status==="inactive"||
      !child.reportsTo||
      !visibleIds.has(child.id)||
      !visibleIds.has(child.reportsTo)
    )return;

    const parent=Pos.get(child.reportsTo);
    if(!parent)return;

    // Shared bus owns the strategic/tactical relation visually.
    if(
      parent.level==="strategic"&&
      child.level==="tactical"&&
      sharedGroups.some(group=>
        group.parentIds.includes(parent.id)&&group.childIds.includes(child.id)
      )
    )return;

    if(!childrenByParent.has(parent.id))childrenByParent.set(parent.id,[]);
    childrenByParent.get(parent.id).push(child);
  });

  for(const [parentId,children] of childrenByParent){
    const parentRect=rectFor(parentId);
    const childRects=children
      .map(c=>({position:c,rect:rectFor(c.id)}))
      .filter(x=>x.rect)
      .sort((a,b)=>a.rect.cx-b.rect.cx);

    if(!parentRect||!childRects.length)continue;

    const startY=parentRect.bottom-1;
    const endY=Math.min(...childRects.map(x=>x.rect.top))+1;
    const busY=startY+(endY-startY)*.48;

    const commands=[];

    if(childRects.length===1){
      const child=childRects[0].rect;

      if(Math.abs(parentRect.cx-child.cx)<3){
        commands.push(
          `M ${fmt(parentRect.cx)} ${fmt(startY)} V ${fmt(child.top+1)}`
        );
      }else{
        commands.push(
          `M ${fmt(parentRect.cx)} ${fmt(startY)} V ${fmt(busY)}`,
          `H ${fmt(child.cx)}`,
          `V ${fmt(child.top+1)}`
        );
      }
    }else{
      const left=Math.min(...childRects.map(x=>x.rect.cx));
      const right=Math.max(...childRects.map(x=>x.rect.cx));

      commands.push(
        `M ${fmt(parentRect.cx)} ${fmt(startY)} V ${fmt(busY)}`,
        `M ${fmt(left)} ${fmt(busY)} H ${fmt(right)}`
      );

      childRects.forEach(({rect})=>{
        commands.push(
          `M ${fmt(rect.cx)} ${fmt(busY)} V ${fmt(rect.top+1)}`
        );
      });
    }

    paths.push(`<path
      class="${pathClass} formal-connector grouped-connector"
      data-kind="formal"
      data-from="${U.esc(parentId)}"
      data-to="${U.esc(children.map(x=>x.id).join(","))}"
      d="${commands.join(" ")}"
    />`);
  }

  // --------------------------------------------------------
  // Other supplemental relations, only when not already handled.
  // --------------------------------------------------------
  reportingParentSets()
    .filter(group=>!sharedGroups.includes(group))
    .forEach(group=>{
      const leaders=group.parentIds
        .filter(id=>visibleIds.has(id))
        .map(id=>({id,rect:rectFor(id)}))
        .filter(x=>x.rect);

      const children=group.childIds
        .filter(id=>visibleIds.has(id))
        .map(id=>({id,rect:rectFor(id)}))
        .filter(x=>x.rect);

      if(!leaders.length||!children.length)return;

      const leaderBottom=Math.max(...leaders.map(x=>x.rect.bottom));
      const childTop=Math.min(...children.map(x=>x.rect.top));

      if(childTop<=leaderBottom+18&&!focusActive)return;

      const railY=leaderBottom+(childTop-leaderBottom)*.50;
      const xs=[...leaders.map(x=>x.rect.cx),...children.map(x=>x.rect.cx)];

      const commands=[
        `M ${fmt(Math.min(...xs))} ${fmt(railY)} H ${fmt(Math.max(...xs))}`
      ];

      leaders.forEach(({rect})=>{
        commands.push(`M ${fmt(rect.cx)} ${fmt(rect.bottom-1)} V ${fmt(railY)}`);
      });
      children.forEach(({rect})=>{
        commands.push(`M ${fmt(rect.cx)} ${fmt(railY)} V ${fmt(rect.top+1)}`);
      });

      paths.push(`<path
        class="${pathClass} supplemental-connector relation-${group.type}"
        data-kind="${group.type}"
        data-from="${U.esc(leaders.map(x=>x.id).join(","))}"
        data-to="${U.esc(children.map(x=>x.id).join(","))}"
        d="${commands.join(" ")}"
      />`);
    });

  svg.innerHTML=paths.join("");
}

function activeReportingLines(){
  return (state.data.reportingLines||[]).filter(line=>
    line&&
    line.parentId&&
    line.childId&&
    line.parentId!==line.childId&&
    Pos.get(line.parentId)?.status!=="inactive"&&
    Pos.get(line.childId)?.status!=="inactive"
  );
}

function supplementalParents(positionId){
  return activeReportingLines()
    .filter(line=>line.childId===positionId)
    .map(line=>Pos.get(line.parentId))
    .filter(Boolean);
}

function supplementalChildren(positionId){
  return activeReportingLines()
    .filter(line=>line.parentId===positionId)
    .map(line=>Pos.get(line.childId))
    .filter(Boolean);
}

function reportingParentSets(){
  const parentsByChildAndType=new Map();

  activeReportingLines().forEach(line=>{
    const type=["shared","functional","advisory"].includes(line.type)?line.type:"shared";
    const key=`${type}:${line.childId}`;
    if(!parentsByChildAndType.has(key)){
      parentsByChildAndType.set(key,{type,childId:line.childId,parentIds:new Set()});
    }
    parentsByChildAndType.get(key).parentIds.add(line.parentId);
  });

  const groups=new Map();
  for(const entry of parentsByChildAndType.values()){
    const parentIds=[...entry.parentIds].sort();
    if(!parentIds.length)continue;
    const key=`${entry.type}:${parentIds.join("|")}`;
    if(!groups.has(key))groups.set(key,{type:entry.type,parentIds,childIds:[]});
    groups.get(key).childIds.push(entry.childId);
  }

  return [...groups.values()];
}

function reportingParentIds(positionId,type){
  return activeReportingLines()
    .filter(line=>line.childId===positionId&&line.type===type)
    .map(line=>line.parentId);
}

function orgFocusSet(id){
  const set=new Set();
  const current=Pos.get(id);
  if(!current)return set;

  set.add(id);

  // Hierarquia formal: superiores + descendentes.
  let p=current;
  const guard=new Set();
  while(p?.reportsTo&&!guard.has(p.id)){
    guard.add(p.id);
    set.add(p.reportsTo);
    p=Pos.get(p.reportsTo);
  }
  Pos.desc(id).forEach(x=>set.add(x));

  // Relações complementares vindas do banco.
  // Expande apenas enquanto novos nós entram no conjunto.
  let changed=true;
  let rounds=0;
  while(changed&&rounds++<state.data.positions.length+2){
    changed=false;

    activeReportingLines().forEach(line=>{
      if(set.has(line.childId)&&!set.has(line.parentId)){
        set.add(line.parentId);
        changed=true;
      }

      if(set.has(line.parentId)&&!set.has(line.childId)){
        set.add(line.childId);
        Pos.desc(line.childId).forEach(x=>set.add(x));
        changed=true;
      }
    });
  }

  return set;
}

function orgVisualFocusSet(id){
  const focus=new Set();
  const selected=Pos.get(id);
  if(!selected)return focus;

  const positions=(state.data.positions||[])
    .filter(p=>p&&p.status!=="inactive");

  const strategicIds=positions
    .filter(p=>p.level==="strategic")
    .map(p=>p.id);

  const formalChildren=parentId=>
    positions.filter(p=>p.reportsTo===parentId);

  const addFormalDescendants=parentId=>{
    const seen=new Set();
    const walk=currentId=>{
      if(!currentId||seen.has(currentId))return;
      seen.add(currentId);

      formalChildren(currentId).forEach(child=>{
        focus.add(child.id);
        walk(child.id);
      });
    };
    walk(parentId);
  };

  const supplementalParents=childId=>
    activeReportingLines()
      .filter(line=>line.childId===childId)
      .map(line=>Pos.get(line.parentId))
      .filter(Boolean);

  const supplementalChildren=parentId=>
    activeReportingLines()
      .filter(line=>line.parentId===parentId)
      .map(line=>Pos.get(line.childId))
      .filter(Boolean);

  const addSupplementalDescendants=parentId=>{
    const seen=new Set();
    const walk=currentId=>{
      if(!currentId||seen.has(currentId))return;
      seen.add(currentId);

      supplementalChildren(currentId).forEach(child=>{
        focus.add(child.id);
        addFormalDescendants(child.id);
        walk(child.id);
      });
    };
    walk(parentId);
  };

  focus.add(id);

  // Estratégico: somente o líder selecionado permanece no topo.
  // Todos abaixo continuam visíveis porque respondem à liderança escolhida.
  if(selected.level==="strategic"){
    positions
      .filter(p=>p.level!=="strategic")
      .forEach(p=>focus.add(p.id));
    return focus;
  }

  // Tático / Operacional:
  // mostra o ramo selecionado e seus subordinados.
  addFormalDescendants(id);
  addSupplementalDescendants(id);

  // Sobe a cadeia formal e complementar sem trazer irmãos.
  const seenAncestors=new Set();
  const addAncestors=currentId=>{
    if(!currentId||seenAncestors.has(currentId))return;
    seenAncestors.add(currentId);

    const current=Pos.get(currentId);
    if(!current)return;

    if(current.reportsTo){
      focus.add(current.reportsTo);
      addAncestors(current.reportsTo);
    }

    supplementalParents(currentId).forEach(parent=>{
      focus.add(parent.id);
      addAncestors(parent.id);
    });
  };
  addAncestors(id);

  // Toda posição abaixo do Estratégico responde à liderança
  // compartilhada Ricardo + Dariane. Ambos aparecem como contexto
  // superior quando o foco está abaixo deles.
  strategicIds.forEach(strategicId=>focus.add(strategicId));

  return focus;
}

function paintOrgFocus(id,mode="hover"){
  const graph=document.getElementById("orgZoneGraph");
  if(!graph||!Pos.get(id))return;

  const ids=orgVisualFocusSet(id);

  graph.classList.add("org-interaction-focus");
  graph.dataset.interactionFocusId=id;
  graph.dataset.interactionFocusMode=mode;

  graph.querySelectorAll("[data-slot-pos]").forEach(slot=>{
    const positionId=slot.dataset.slotPos;
    const visible=ids.has(positionId);

    slot.classList.toggle("org-focus",visible);
    slot.classList.toggle("org-focus-primary",positionId===id);
    slot.classList.toggle("org-hidden",!visible);
  });

  // Reconstrói somente os conectores da cadeia, sem alterar geometria.
  drawOrgLinks();
}

function clearOrgFocus(){
  const graph=document.getElementById("orgZoneGraph");

  state.orgFocusId=null;
  state.orgFocusMode="";

  if(!graph)return;

  graph.classList.remove(
    "org-focus-mode",
    "org-focus-hover",
    "org-focus-selected",
    "org-interaction-focus"
  );

  delete graph.dataset.focusId;
  delete graph.dataset.focusMode;
  delete graph.dataset.interactionFocusId;

    el.classList.remove("org-focus","org-focus-primary","org-hidden");
  });

  // Restaura todos os conectores.

}

function applyOrgFocus(id,mode="hover"){
