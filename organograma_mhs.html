}


function normalizeLiveHierarchy(data){
  if(!data?.positions?.length||!data?.people?.length)return data;

  const peopleByName=new Map(
    data.people.map(person=>[U.norm(person.name||""),person])
  );
  const positionByPersonName=name=>{
    const person=peopleByName.get(U.norm(name));
    return person?data.positions.find(p=>p.personId===person.id):null;
  };

  const ricardo=positionByPersonName("Ricardo");
  const dariane=positionByPersonName("Dariane");
  const orelan=positionByPersonName("Orelan");
  const francis=positionByPersonName("Francis");
  const luan=positionByPersonName("Luan");
  const jefferson=positionByPersonName("Jefferson");
  const barbara=positionByPersonName("Barbara");
  const mickaely=positionByPersonName("Mickaely");
  const lucas=positionByPersonName("Lucas Gabriel");
  const breno=positionByPersonName("Breno");
  const sebastiao=positionByPersonName("Sebastiao");

  // Two strategic leaders stay at the top.
  [ricardo,dariane].filter(Boolean).forEach((p,index)=>{
    p.level="strategic";
    p.reportsTo=null;
    p.order=index+1;
  });

  // Tactical layer.
  [
    [orelan,1],
    [francis,2],
    [luan,3]
  ].forEach(([p,order])=>{
    if(!p)return;
    p.level="tactical";
    // Ricardo is the formal parent; Dariane is represented as shared leadership.
    p.reportsTo=ricardo?.id||dariane?.id||null;
    p.order=order;
  });

  // Operational layer.
  const operationalAssignments=[
    [jefferson,ricardo,1],
    [barbara,ricardo,2],
    [mickaely,dariane,1],
    [lucas,dariane,2],
    [breno,francis,1],
    [sebastiao,luan,1]
  ];

  operationalAssignments.forEach(([p,parent,order])=>{
    if(!p)return;
    p.level="operational";
    p.reportsTo=parent?.id||null;
    p.order=order;
  });

  // Rebuild only the intended shared strategic -> tactical relationships.
  const leaderIds=[ricardo?.id,dariane?.id].filter(Boolean);
  const tacticalIds=[orelan?.id,francis?.id,luan?.id].filter(Boolean);
  const keep=(data.reportingLines||[]).filter(line=>
    !(leaderIds.includes(line.parentId)&&tacticalIds.includes(line.childId))
  );

  const intended=[];

  // Ambos os Estratégicos lideram o Tático.
  for(const parentId of leaderIds){
    for(const childId of tacticalIds){
      intended.push({
        id:`live:${parentId}:${childId}`,
        parentId,
        childId,
        type:"shared",
        label:"Liderança estratégica compartilhada"
      });
    }
  }

  // Nos Operacionais ligados diretamente a um Estratégico,
  // o outro Estratégico entra como liderança compartilhada.
  const directStrategicOperational=[
    jefferson,
    barbara,
    mickaely,
    lucas
  ].filter(Boolean);

  directStrategicOperational.forEach(child=>{
    const formalParent=child.reportsTo;
    leaderIds
      .filter(parentId=>parentId!==formalParent)
      .forEach(parentId=>{
        intended.push({
          id:`live:${parentId}:${child.id}`,
          parentId,
          childId:child.id,
          type:"shared",
          label:"Liderança estratégica compartilhada"
        });
      });
  });

  const deduped=new Map();
  [...keep,...intended].forEach(line=>{
    const key=`${line.type||"shared"}:${line.parentId}:${line.childId}`;
    deduped.set(key,line);
  });

  data.reportingLines=[...deduped.values()];
  return data;
}

function departmentAccent(department){
  const key=U.norm(`${department?.name||""} ${department?.acronym||""}`);

  if(key.includes("administr"))return "#248bab";
  if(key.includes("comercial")||key.includes(" com"))return "#2998b9";
  if(key.includes("automacao")||key.includes("manutencao")||key.includes(" aut"))return "#17243f";
  if(key.includes("engenharia")||key.includes(" eng"))return "#d95a57";
  if(key.includes("producao")||key.includes(" prod"))return "#487a98";

  return "#61758d";
}

function departmentLeader(department,positions){
  const explicit=department?.leaderPositionId
    ?Pos.get(department.leaderPositionId)
    :null;

  if(explicit&&explicit.status!=="inactive"){
    return {
      position:explicit,
      person:Ppl.get(explicit.personId),
      inferred:false
    };
  }

  // Fallback apenas para payloads antigos/locais ainda sem liderança formal.
  // Em Supabase pós-migration 007, leaderPositionId vem de department_leaderships.
  const candidates=[...positions]
    .filter(p=>p.status!=="inactive")
    .filter(p=>{
      const formalChildren=Pos.kids(p.id).length;
      const supplemental=supplementalChildren(p.id).length;
      return formalChildren+supplemental>0;
    })
    .sort((a,b)=>{
      const occupiedA=a.personId?0:1;
      const occupiedB=b.personId?0:1;
      const rank={strategic:0,tactical:1,operational:2};
      return occupiedA-occupiedB||
        (rank[a.level]??9)-(rank[b.level]??9)||
        (a.order||0)-(b.order||0)||
        a.title.localeCompare(b.title,"pt-BR");
    });

  const leader=candidates[0]||null;
  return {
    position:leader,
    person:leader?Ppl.get(leader.personId):null,
    inferred:!!leader
  };
}

function departmentTeamPeople(positions){
  const seen=new Set();
  const people=[];

  positions.forEach(position=>{
    const person=Ppl.get(position.personId);
    if(!person||seen.has(person.id))return;
    seen.add(person.id);
    people.push({person,position});
  });

  return people.sort((a,b)=>{
    const rank={strategic:0,tactical:1,operational:2};
    return (rank[a.position.level]??9)-(rank[b.position.level]??9)||
      (a.position.order||0)-(b.position.order||0)||
      a.person.name.localeCompare(b.person.name,"pt-BR");
  });
}

function integrityDiagnostics(){
  const issues=[];
  const positions=state.data.positions||[];
  const deps=new Map((state.data.departments||[]).map(d=>[d.id,d]));
  const posMap=new Map(positions.map(p=>[p.id,p]));
  const personOccupancy=new Map();

  positions.forEach(p=>{
    if(!deps.has(p.departmentId))issues.push({severity:"error",title:"Cargo sem departamento válido",detail:p.title});
    if(p.reportsTo&&!posMap.has(p.reportsTo))issues.push({severity:"error",title:"Superior inexistente",detail:p.title});
    if(p.personId){
      if(personOccupancy.has(p.personId))issues.push({severity:"error",title:"Pessoa em mais de um cargo",detail:Ppl.get(p.personId)?.name||p.personId});
      personOccupancy.set(p.personId,p.id);
      if(Ppl.get(p.personId)?.active===false)issues.push({severity:"error",title:"Funcionário inativo ocupando cargo",detail:p.title});
    }
    if(p.status==="vacant"&&p.personId)issues.push({severity:"error",title:"Vaga marcada como ocupada",detail:p.title});
    if(p.status==="active"&&!p.personId)issues.push({severity:"warning",title:"Cargo ativo sem ocupante",detail:p.title});
  });

  // Ciclos formais.
  positions.forEach(start=>{
    const seen=new Set();
    let p=start;
    while(p?.reportsTo){
      if(seen.has(p.id)){
        issues.push({severity:"error",title:"Ciclo hierárquico detectado",detail:start.title});
        break;
      }
      seen.add(p.id);
      p=posMap.get(p.reportsTo);
    }
  });

  // Relações complementares.
  const relKeys=new Set();
  activeReportingLines().forEach(line=>{
    const key=`${line.type}:${line.parentId}:${line.childId}`;
    if(relKeys.has(key))issues.push({severity:"warning",title:"Relação complementar duplicada",detail:key});
    relKeys.add(key);
    if(!posMap.has(line.parentId)||!posMap.has(line.childId))issues.push({severity:"error",title:"Relação complementar órfã",detail:key});
  });

  (state.data.departments||[]).filter(d=>d.active).forEach(d=>{
    if(!d.leaderPositionId)issues.push({severity:"warning",title:"Departamento sem liderança formal",detail:d.name});
    else if(!posMap.has(d.leaderPositionId))issues.push({severity:"error",title:"Liderança de departamento inválida",detail:d.name});
  });

  (state.data.people||[]).filter(p=>p.active!==false).forEach(person=>{
    if(!Ppl.pos(person.id)){
      issues.push({severity:"warning",title:"Pessoa ativa sem posição atual",detail:person.name});
    }
    if(!person.hireDate)issues.push({severity:"info",title:"Data de admissão não informada",detail:person.name});
  });

  // Vínculos históricos sobrepostos / múltiplos atuais.
  const byEmp=new Map();
  (state.data.positionHistory||[]).forEach(h=>{
    if(!byEmp.has(h.employeeId))byEmp.set(h.employeeId,[]);
    byEmp.get(h.employeeId).push(h);
  });
  byEmp.forEach((rows,empId)=>{
    const current=rows.filter(x=>x.current||!x.endDate);
    if(current.length>1)issues.push({severity:"error",title:"Mais de um vínculo histórico atual",detail:Ppl.get(empId)?.name||empId});
  });

  return issues;
}

function managementSpan(position){
  return Pos.kids(position.id).length+supplementalChildren(position.id).length;
}

function csvEscape(value){
  const s=String(value??"");
  return `"${s.replaceAll('"','""')}"`;
}

function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function exportOrgCsv(){
  const header=["Pessoa","Cargo","Departamento","Nível","Superior principal","Status","Data de admissão"];
  const rows=state.data.positions
    .filter(p=>p.status!=="inactive")
    .map(p=>{
      const person=Ppl.get(p.personId),dep=Dep.get(p.departmentId),manager=Pos.get(p.reportsTo);
      return [
        person?.name||"",p.title,dep?.name||"",LEVELS[p.level]?.label||p.level,
        Ppl.get(manager?.personId)?.name||manager?.title||"",
        p.status,person?.hireDate||""
      ];
    });
  const csv="\ufeff"+[header,...rows].map(row=>row.map(csvEscape).join(";")).join("\n");
  downloadBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}),`organograma-${new Date().toISOString().slice(0,10)}.csv`);
  toast("CSV gerado","O arquivo contém a estrutura atual e os filtros não alteram os dados exportados.");
}

async function exportOrgPng(){
  const graph=document.getElementById("orgZoneGraph");
  if(!graph){toast("Organograma indisponível","Abra a rota Organograma antes de exportar.",true);return;}
  const clone=graph.cloneNode(true);
  clone.querySelectorAll("img").forEach(img=>{if(!img.src.startsWith("data:"))img.remove();});
  clone.style.margin="0";
  const width=Math.max(1200,graph.scrollWidth);
  const height=Math.max(700,graph.scrollHeight);
  const css=document.querySelector("style")?.textContent||"";
  const html=`<div xmlns="http://www.w3.org/1999/xhtml"><style>${css}</style>${clone.outerHTML}</div>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}"><foreignObject width="100%" height="100%">${html}</foreignObject></svg>`;
  const blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  try{
    const img=new Image();
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});
    const canvas=document.createElement("canvas");
    canvas.width=width;canvas.height=height;
    const ctx=canvas.getContext("2d");
    ctx.fillStyle="#f5f7f8";ctx.fillRect(0,0,width,height);
    ctx.drawImage(img,0,0);
    const png=await new Promise(resolve=>canvas.toBlob(resolve,"image/png",0.95));
    if(!png)throw Error("O navegador não conseguiu gerar o PNG.");
    downloadBlob(png,`organograma-${new Date().toISOString().slice(0,10)}.png`);
    toast("PNG gerado","O organograma atual foi exportado.");
  }catch(error){
    toast("PNG não disponível neste navegador","Use Imprimir / PDF como alternativa.",true);
  }finally{
    URL.revokeObjectURL(url);
  }
}

async function copyDeepLink(kind,id){
  const base=location.href.split("#")[0];
  const route=kind==="position"?`#/organograma/position/${id}`:kind==="person"?`#/pessoas/${id}`:`#/departamentos/${id}`;
  const link=`${base}${route}`;
  try{await navigator.clipboard.writeText(link);toast("Link copiado",link);}
  catch{toast("Link direto",link);}
}

function parseDeepLink(route){
  let m=String(route||"").match(/^#\/organograma\/position\/([^/?#]+)/);
  if(m)return{kind:"position",id:m[1]};
  m=String(route||"").match(/^#\/pessoas\/([^/?#]+)/);
  if(m)return{kind:"person",id:m[1]};
  m=String(route||"").match(/^#\/departamentos\/([^/?#]+)/);
  if(m)return{kind:"department",id:m[1]};
  return null;
}

function applyDeepLink(link){
  if(!link)return;
  if(link.kind==="position"&&Pos.get(link.id)){
    setTimeout(()=>{openDrawer(link.id);centerSelected(false);},100);
  }else if(link.kind==="person"){
    const person=Ppl.get(link.id),position=person?Ppl.pos(person.id):null;
    if(position)setTimeout(()=>openDrawer(position.id),80);
  }else if(link.kind==="department"){
    setTimeout(()=>{
      const card=document.querySelector(`[data-department-card="${link.id}"]`);
      card?.scrollIntoView({block:"center",behavior:"smooth"});
      card?.classList.add("command-highlight");
      setTimeout(()=>card?.classList.remove("command-highlight"),1400);
    },80);
  }
}

function render(){
  const a=document.getElementById("app");
  state.route=location.hash||"#/organograma";
  const deep=parseDeepLink(state.route);
  const baseRoute=deep
    ?(deep.kind==="position"?"#/organograma":deep.kind==="person"?"#/pessoas":"#/departamentos")
    :state.route;

  if(baseRoute==="#/login"){
    a.innerHTML=adminLoginPage();
    requestAnimationFrame(()=>document.getElementById("adminLoginEmail")?.focus());
    return;
  }

  if(isProtectedAdminRoute(baseRoute)&&!canEditStructure()){
    a.innerHTML=adminAccessGate();
    requestAnimationFrame(()=>document.getElementById("adminLoginEmail")?.focus());
    return;
  }

  if(baseRoute==="#/departamentos")a.innerHTML=renderDeps();
  else if(baseRoute==="#/pessoas")a.innerHTML=renderPeople(true);
  else if(baseRoute==="#/gestao")a.innerHTML=dashboard();
  else if(baseRoute==="#/gestao/estrutura")a.innerHTML=structure();
  else if(baseRoute==="#/gestao/pessoas")a.innerHTML=adminPeople();
  else if(/^#\/gestao\/pessoas\/(.+)$/.test(baseRoute)){
    const personRouteId=decodeURIComponent(baseRoute.match(/^#\/gestao\/pessoas\/(.+)$/)[1]);
    a.innerHTML=personAdminPage(personRouteId);
  }
  else if(baseRoute==="#/gestao/cargos")a.innerHTML=cargos();
  else if(baseRoute==="#/gestao/departamentos")a.innerHTML=adminDeps();
  else if(baseRoute==="#/gestao/diagnostico")a.innerHTML=diagnosticsPage();
  else if(baseRoute==="#/gestao/auditoria")a.innerHTML=auditPage();
  else if(baseRoute==="#/gestao/conexao")a.innerHTML=connectionPage();
  else if(baseRoute==="#/gestao/configuracoes")a.innerHTML=settings();
  else a.innerHTML=renderOrg();

  if(baseRoute==="#/organograma")initOrgViewport();
  applyDeepLink(deep);
}

function employeePositionHistory(employeeId){
  return (state.data.positionHistory||[])
    .filter(item=>item.employeeId===employeeId)
    .sort((a,b)=>{
      const ad=a.startDate||"0000-00-00";

function formatHistoryDate(value){
  if(!value)return "Data não informada";
  try{
    return new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"short",year:"numeric"})
      .format(new Date(`${value}T00:00:00`));
  }catch{
    return value;
  }
}

function previousIsoDate(value){
  const d=new Date(`${value}T12:00:00`);
  if(Number.isNaN(d.getTime()))return value;
  d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}

function employeeTimelineItems(employeeId){
  const assignments=employeePositionHistory(employeeId).map(item=>({
    ...item,
    timelineKind:"assignment",
    date:item.startDate,
    type:item.assignmentType
  }));

  const eventOnly=new Set(["leave","return","termination","correction"]);
  const events=(state.data.employmentEvents||[])
    .filter(item=>item.employeeId===employeeId&&eventOnly.has(item.eventType))
    .map(item=>({
      id:`event:${item.id}`,
      employeeId,
      timelineKind:"event",
      date:item.eventDate,
      type:item.eventType,
      title:historyTypeLabel(item.eventType),
      notes:item.notes||"",
      current:false
    }));

  return [...assignments,...events].sort((a,b)=>
    String(b.date||"0000-00-00").localeCompare(String(a.date||"0000-00-00"))
  );
}

function contactEmailHref(email){
  const value=String(email||"").trim();
  return value?`mailto:${value}`:"";
}

function whatsappNumber(phone){
  const raw=String(phone||"").trim();
  if(!raw)return "";

  let digits=raw.replace(/\D/g,"");
  if(digits.startsWith("00"))digits=digits.slice(2);

  // Brazilian local numbers (DDD + number) receive country code automatically.
  if(!raw.startsWith("+")&&!digits.startsWith("55")&&(digits.length===10||digits.length===11)){
    digits=`55${digits}`;
  }

  return digits.length>=10?digits:"";
}

function whatsappHref(phone){
  const number=whatsappNumber(phone);
  return number?`https://wa.me/${number}`:"";
}

async function imageToWebp(file){
  if(!file)throw Error("Nenhuma imagem selecionada.");
  const allowed=["image/jpeg","image/png","image/webp","image/avif"];
  if(!allowed.includes(file.type))throw Error("Use uma imagem JPG, PNG, WebP ou AVIF.");
  if(file.size>5*1024*1024)throw Error("A foto deve ter no máximo 5 MB.");

  const sourceUrl=URL.createObjectURL(file);
  try{
    const img=await new Promise((resolve,reject)=>{
      const el=new Image();
      el.onload=()=>resolve(el);
      el.onerror=()=>reject(Error("Não foi possível ler essa imagem."));
      el.src=sourceUrl;
    });

    const maxSide=900;
    const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    const width=Math.max(1,Math.round(img.naturalWidth*scale));
    const height=Math.max(1,Math.round(img.naturalHeight*scale));
    const canvas=document.createElement("canvas");
    canvas.width=width;
    canvas.height=height;
    const ctx=canvas.getContext("2d",{alpha:false});
    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,width,height);
    ctx.drawImage(img,0,0,width,height);

    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/webp",.88));
    if(!blob)throw Error("Não foi possível otimizar a imagem.");
    return blob;
  }finally{
    URL.revokeObjectURL(sourceUrl);
  }
}

function blobToDataUrl(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(Error("Não foi possível preparar a foto."));
    reader.readAsDataURL(blob);
  });
}

async function persistEmployeePhoto(person,file){
  if(!file)return person;

  setEmployeePhotoStatus("working","Otimizando a imagem…");

  const blob=await withTimeout(
    imageToWebp(file),
    10000,
    "A imagem demorou demais para ser processada."
  );

  if(CFG.dataProvider==="supabase"){
    const result=await SupabaseProvider.uploadEmployeePhotoDirect(
      person.id,
      blob,
      message=>{
        setEmployeePhotoStatus("working",message);
        setPersonSaveStatus("working",message);
      }
    );

    person.photoPath=result.path;

    if(result.signedUrl){
      person.avatarUrl=result.signedUrl;
      const preview=document.getElementById("employeePhotoPreview");
      if(preview){
        preview.innerHTML=`<img src="${U.esc(result.signedUrl)}" alt="Foto salva de ${U.esc(person.name||"funcionário")}">`;

      setEmployeePhotoStatus("success","Foto salva no Storage e vinculada ao funcionário.");

    setEmployeePhotoStatus("working","Salvando foto no navegador…");
    person.photoPath="";

      8000,

  }

}

function orgMetrics(){
  const c=document.getElementById("canvas"),
    s=document.getElementById("stage"),
    t=s?.querySelector(".org-zone-graph,.tree");
  if(!c||!s||!t)return null;

  const cs=getComputedStyle(s);
  const padX=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const padY=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);

  return {
    c,s,t,
    width:Math.max(1,t.scrollWidth+padX),
    height:Math.max(1,t.scrollHeight+padY)
  };
}

function updateZoomLabel(){
  const l=document.getElementById("zlabel");
  if(l)l.textContent=`${Math.round(state.zoom*100)}%`;
}

function orgCenteredOffset(c,width,zoom){
  return Math.max(0,(c.clientWidth-width*zoom)/2);
}

function applyOrgTransform(s,zoom,offsetX=0){
  // matrix() deixa explícito: escala + deslocamento horizontal em pixels de tela.
  s.style.transform=`matrix(${zoom},0,0,${zoom},${offsetX},0)`;
}

function setZoom(z,opts={}){
  const m=orgMetrics();
  const old=state.zoom||1;
  const oldOffset=state.orgOffsetX||0;
  const next=Math.max(.45,Math.min(1.45,+z.toFixed(3)));

  if(!m){
    state.zoom=next;
    return;
  }

  const {c,s,width}=m;
  const ax=opts.x??c.clientWidth/2;
  const ay=opts.y??c.clientHeight/2;

  const contentX=(c.scrollLeft+ax-oldOffset)/old;
  const contentY=(c.scrollTop+ay)/old;

  state.zoom=next;
  state.orgOffsetX=orgCenteredOffset(c,width,next);
  applyOrgTransform(s,next,state.orgOffsetX);
  updateZoomLabel();

  requestAnimationFrame(()=>{
    c.scrollLeft=Math.max(0,contentX*next+state.orgOffsetX-ax);
    c.scrollTop=Math.max(0,contentY*next-ay);

    if(opts.user!==false){
      state.orgFitMode=false;
      rememberOrgView();
    }
  });
}

function rememberOrgView(){
  const m=orgMetrics();
  if(!m)return;
  const {c}=m;
  const offset=state.orgOffsetX||0;
  state.orgView={
    zoom:state.zoom,
    x:(c.scrollLeft+c.clientWidth/2-offset)/state.zoom,
    y:(c.scrollTop+c.clientHeight/2)/state.zoom
  };
}

function restoreOrgView(smooth=false){
  const m=orgMetrics(),v=state.orgView;
  if(!m||!v)return false;

  const {c,s,width}=m;
  state.zoom=Math.max(.45,Math.min(1.45,v.zoom||state.zoom||1));
  state.orgOffsetX=orgCenteredOffset(c,width,state.zoom);
  applyOrgTransform(s,state.zoom,state.orgOffsetX);
  updateZoomLabel();

  requestAnimationFrame(()=>{
    c.scrollTo({
      left:Math.max(0,v.x*state.zoom+state.orgOffsetX-c.clientWidth/2),
      top:Math.max(0,v.y*state.zoom-c.clientHeight/2),
      behavior:smooth?"smooth":"auto"
    });
  });

  return true;
}

function fitOrgToView(smooth=true){
  const m=orgMetrics();
  if(!m)return;

  const {c,s,width,height}=m;
  const gutterX=Math.max(34,Math.min(90,c.clientWidth*.055));
  const gutterY=Math.max(28,Math.min(70,c.clientHeight*.07));
  const maxW=Math.max(1,c.clientWidth-gutterX*2);
  const maxH=Math.max(1,c.clientHeight-gutterY*2);

  let next=Math.min(maxW/width,maxH/height,1.08);

  // "Ajustar" deve realmente enquadrar o organograma inteiro.
  // O limite mínimo só evita uma escala impraticável em telas estreitas.
  next=Math.max(.50,Math.min(1.08,next));

  state.zoom=+next.toFixed(3);
  state.orgFitMode=true;
  state.orgView=null;

  const scaledW=width*state.zoom;
  const scaledH=height*state.zoom;

  // Quando sobra largura, divide exatamente o espaço livre entre esquerda e direita.
  state.orgOffsetX=orgCenteredOffset(c,width,state.zoom);
  applyOrgTransform(s,state.zoom,state.orgOffsetX);
  updateZoomLabel();

  requestAnimationFrame(()=>{
    c.scrollTo({
      left:scaledW>c.clientWidth
        ? Math.max(0,(scaledW-c.clientWidth)/2)
        : 0,
      top:Math.max(0,(scaledH-c.clientHeight)/2),
      behavior:smooth?"smooth":"auto"
    });

    rememberOrgView();
    state.orgFitMode=true;
  });
}

function center(smooth=true){
  const m=orgMetrics();
  if(!m)return;

  const {c,width,height}=m;
  const offset=state.orgOffsetX||0;
  const scaledW=width*state.zoom;
  const scaledH=height*state.zoom;

  c.scrollTo({
    left:Math.max(0,(scaledW-c.clientWidth)/2+offset),
    top:Math.max(0,(scaledH-c.clientHeight)/2),
    behavior:smooth?"smooth":"auto"
  });

  requestAnimationFrame(rememberOrgView);
}

function centerSelected(smooth=true){
  const c=document.getElementById("canvas");
  const n=document.querySelector(".node.sel,.node.hit");
  if(!c||!n){
    center(smooth);
    return;
  }
  const a=c.getBoundingClientRect(),b=n.getBoundingClientRect();
  c.scrollBy({
    left:b.left-a.left-a.width/2+b.width/2,
    top:b.top-a.top-a.height/2+b.height/2,
    behavior:smooth?"smooth":"auto"
  });
  requestAnimationFrame(rememberOrgView);
}

let __orgLayoutObserver=null;
function bindOrgLayoutObserver(){
  __orgLayoutObserver?.disconnect?.();
  const graph=document.getElementById("orgZoneGraph");
  if(!graph||!("ResizeObserver" in window))return;

  let raf=0;
  __orgLayoutObserver=new ResizeObserver(()=>{

  });

  __orgLayoutObserver.observe(graph);

  if(document.fonts?.ready){

  });

function bindPan(){
  const c=document.getElementById("canvas");
  if(!c)return;

  const points=new Map();
  let drag=null,pinch=null;

  const localPoint=e=>{
    const r=c.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  };
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});

  c.onpointerdown=e=>{
    if(e.button&&e.pointerType!=="touch")return;
    if(e.target.closest("button"))return;

    const p=localPoint(e);
    points.set(e.pointerId,p);
    c.setPointerCapture?.(e.pointerId);

    if(points.size===1){
      drag={id:e.pointerId,x:e.clientX,y:e.clientY,l:c.scrollLeft,t:c.scrollTop};
      c.classList.add("drag");
    }else if(points.size===2){
      const [a,b]=[...points.values()];
      pinch={distance:Math.max(1,dist(a,b)),zoom:state.zoom,anchor:mid(a,b)};
      drag=null;
    }
  };

  c.onpointermove=e=>{
    if(!points.has(e.pointerId))return;
    const p=localPoint(e);
    points.set(e.pointerId,p);

    if(points.size>=2){
      const [a,b]=[...points.values()].slice(0,2);
      if(!pinch)pinch={distance:Math.max(1,dist(a,b)),zoom:state.zoom,anchor:mid(a,b)};
      const scale=dist(a,b)/pinch.distance;
      setZoom(pinch.zoom*scale,{x:pinch.anchor.x,y:pinch.anchor.y,user:true});
      e.preventDefault();
      return;
    }

    if(drag&&drag.id===e.pointerId){
      c.scrollLeft=drag.l-(e.clientX-drag.x);
      c.scrollTop=drag.t-(e.clientY-drag.y);
      state.orgFitMode=false;
      e.preventDefault();
    }
  };

  const endPointer=e=>{
    points.delete(e.pointerId);
    c.releasePointerCapture?.(e.pointerId);
    if(points.size<2)pinch=null;
    if(points.size===0){
      drag=null;
      c.classList.remove("drag");
      rememberOrgView();
    }else if(points.size===1){
      const [id,p]=[...points.entries()][0];
      drag={id,x:e.clientX,y:e.clientY,l:c.scrollLeft,t:c.scrollTop};
    }
  };
  c.onpointerup=endPointer;
  c.onpointercancel=endPointer;

  c.onwheel=e=>{
    const rect=c.getBoundingClientRect();
    if(e.ctrlKey||e.metaKey){
      e.preventDefault();
      const factor=Math.exp(-e.deltaY*.0015);
      setZoom(state.zoom*factor,{
        x:e.clientX-rect.left,
        y:e.clientY-rect.top,
        user:true
      });
      return;
    }

    const canPanX=c.scrollWidth>c.clientWidth+2;
    const canPanY=c.scrollHeight>c.clientHeight+2;
    if(canPanX||canPanY){
      e.preventDefault();
      if(e.shiftKey){
        c.scrollLeft+=e.deltaY||e.deltaX;
      }else{
        c.scrollLeft+=e.deltaX;
        c.scrollTop+=e.deltaY;
      }
      state.orgFitMode=false;
      rememberOrgView();
    }
  };

  c.ondblclick=e=>{
    if(e.target.closest(".node,.toggle"))return;
    fitOrgToView(true);
  };

  c.onkeydown=e=>{
    const step=e.shiftKey?120:55;
    if(e.key==="ArrowLeft"){c.scrollBy({left:-step,behavior:"smooth"});e.preventDefault()}
    else if(e.key==="ArrowRight"){c.scrollBy({left:step,behavior:"smooth"});e.preventDefault()}
    else if(e.key==="ArrowUp"){c.scrollBy({top:-step,behavior:"smooth"});e.preventDefault()}
    else if(e.key==="ArrowDown"){c.scrollBy({top:step,behavior:"smooth"});e.preventDefault()}
    else if(e.key==="+"||e.key==="="){setZoom(state.zoom+.1,{user:true});e.preventDefault()}
    else if(e.key==="-"||e.key==="_"){setZoom(state.zoom-.1,{user:true});e.preventDefault()}
    else if(e.key==="0"){fitOrgToView(true);e.preventDefault()}
  };
}



const orgHoverCapable=window.matchMedia("(hover:hover) and (pointer:fine)");

  if(!orgHoverCapable.matches)return;

  const card=e.target.closest?.("#orgZoneGraph .ref-node");
  if(!card)return;
  if(e.relatedTarget&&card.contains(e.relatedTarget))return;

  // Com o drawer aberto, o clique selecionado continua sendo a referência.
  const drawer=document.getElementById("drawer");
  if(drawer?.classList.contains("open")&&state.selected)return;

  const id=card.dataset.pos;
  if(id)applyOrgFocus(id,"hover");
});

document.addEventListener("pointerout",e=>{
  if(!orgHoverCapable.matches)return;

  const card=e.target.closest?.("#orgZoneGraph .ref-node");
  if(!card)return;
  if(e.relatedTarget&&card.contains(e.relatedTarget))return;

  const drawer=document.getElementById("drawer");
  if(drawer?.classList.contains("open")&&state.selected){
    applyOrgFocus(state.selected,"selected");
  }else{
    clearOrgFocus();
  }
});

document.addEventListener("focusin",e=>{
  const card=e.target.closest?.("#orgZoneGraph .ref-node");
  if(!card)return;

  const drawer=document.getElementById("drawer");
  if(drawer?.classList.contains("open")&&state.selected)return;

  const id=card.dataset.pos;
  if(id)applyOrgFocus(id,"keyboard");
});

document.addEventListener("focusout",e=>{
  const card=e.target.closest?.("#orgZoneGraph .ref-node");
  if(!card)return;
  if(e.relatedTarget&&card.contains(e.relatedTarget))return;

  const drawer=document.getElementById("drawer");
  if(drawer?.classList.contains("open")&&state.selected){
    applyOrgFocus(state.selected,"selected");
  }else{
    clearOrgFocus();
  }
});

function resetNavigationUi(){
  state.profileOpen=false;
  state.mobnav=false;
  state.side=false;
  state.commandOpen=false;
  state.commandQuery="";
  state.commandIndex=0;
  state.commandReturnFocus=null;
  const appRoot=document.getElementById("app");
  if(appRoot)appRoot.inert=false;
  document.getElementById("commandCenterHost")?.remove();

  document.getElementById("profileMenu")?.classList.remove("open");
  document.getElementById("profileMenuBtn")?.classList.remove("active");
  document.getElementById("profileMenuBtn")?.setAttribute("aria-expanded","false");
  document.getElementById("nav")?.classList.remove("open");
  document.getElementById("side")?.classList.remove("open");
  document.documentElement.classList.remove("admin-sidebar-open");
  document.body.classList.remove("admin-sidebar-open");
  document.getElementById("sideToggle")?.setAttribute("aria-expanded","false");

  const drawer=document.getElementById("drawer");
  if(drawer){
    drawer.classList.remove("open");
    drawer.setAttribute("aria-hidden","true");
  }

  const modal=document.getElementById("modal");
  if(modal&&state.modal){
    state.modal=null;
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden","true");
    modal.innerHTML="";
    clearPendingEmployeePhoto();
  }

  document.getElementById("overlay")?.classList.remove("open");
  clearOrgFocus();
}

function navigateTo(route){
  const target=String(route||"#/organograma").startsWith("#")
    ? String(route||"#/organograma")
    : `#${route}`;

  resetNavigationUi();

  if(location.hash===target){
    state.route=target;
    render();
    window.scrollTo({top:0,left:0,behavior:"auto"});
    return;
  }

  location.hash=target;
}

const movementButton=e.target.closest?.("#registerMovementBtn");
if(movementButton){

  if(movementButton.dataset.saving==="true")return;

  const employeeId=movementButton.dataset.employeeId||"";
  const type=document.getElementById("movementType")?.value||"";
  const effectiveDate=document.getElementById("movementEffectiveDate")?.value||"";
  const positionId=document.getElementById("movementPositionId")?.value||"";
  const notes=document.getElementById("movementNotes")?.value||"";
  const statusEl=document.getElementById("movementSaveStatus");
  const requiresPosition=["admission","promotion","transfer","role_change"].includes(type);

  const setStatus=(kind,message)=>{
    if(!statusEl)return;
    statusEl.classList.remove("working","success","error");
    if(kind)statusEl.classList.add(kind);
    statusEl.textContent=message||"";
  };

  if(!effectiveDate){setStatus("error","Informe a data efetiva.");return;}
  if(requiresPosition&&!positionId){setStatus("error","Selecione o novo cargo.");return;}

  const oldHtml=movementButton.innerHTML;
  movementButton.dataset.saving="true";movementButton.disabled=true;
  movementButton.innerHTML=`${I.hier}<span>Registrando…</span>`;
  setStatus("working","Registrando movimentação e atualizando a estrutura…");

  try{
    if(CFG.dataProvider==="supabase"){
      await SupabaseProvider.registerEmployeeMovement(employeeId,type,effectiveDate,positionId||null,notes);
      state.data=normalizeLiveHierarchy(normalizeAppData(await SupabaseProvider.load()));
    }else{
      await registerLocalMovement(employeeId,type,effectiveDate,positionId||null,notes);
    }
    setStatus("success","Movimentação confirmada.");
    toast("Movimentação registrada",`${historyTypeLabel(type)} registrada com sucesso.`);
    if(location.hash.startsWith("#/gestao/pessoas/")){
      navigateTo(`#/gestao/pessoas/${employeeId}`);
    }else{
      openModal("person",{id:employeeId});
    }
  }catch(error){
    const message=friendlySupabaseError(error);
    setStatus("error",message);
    toast("Não foi possível registrar",message,true);
  }finally{
    movementButton.dataset.saving="false";
    if(document.body.contains(movementButton)){movementButton.disabled=false;movementButton.innerHTML=oldHtml;}

  return;
}

  if(!pendingEmployeePhotoFile){
    toast("Selecione uma foto","Escolha uma imagem antes de enviar.",true);

    return;
  }

  const old=btn.innerHTML;

  try{
    await SupabaseProvider.getRestEditorContext();

    const result=await withTimeout(
      (async()=>{
        const blob=await imageToWebp(pendingEmployeePhotoFile);
        return SupabaseProvider.uploadEmployeePhotoDirect(
          employeeId,
          blob,
          message=>{
            setEmployeePhotoStatus("working",message);
            setPersonSaveStatus("working",message);
          }
        );
      })(),
      28000,
      "O envio da foto excedeu o tempo máximo de 28 segundos."
    );

    person.photoPath=result.path;
    if(result.signedUrl){
      person.avatarUrl=result.signedUrl;
      const preview=document.getElementById("employeePhotoPreview");
      if(preview){
        preview.innerHTML=`<img src="${U.esc(result.signedUrl)}" alt="Foto salva de ${U.esc(person.name||"funcionário")}">`;
      }
    }

    clearPendingEmployeePhoto();
    setEmployeePhotoStatus("success","Foto salva.");
    setPersonSaveStatus("success","Foto salva.");

    if(CFG.dataProvider==="supabase"){
      state.data=normalizeLiveHierarchy(normalizeAppData(await SupabaseProvider.load()));
    }

    if(location.hash.startsWith("#/gestao/pessoas/")){
      setTimeout(()=>navigateTo(`#/gestao/pessoas/${employeeId}`),120);
    }

  }catch(error){
    console.error("Falha no upload direto da foto:",error);
    const message=photoErrorMessage(error);
    setEmployeePhotoStatus("error",message);
    setPersonSaveStatus("error",message);
    toast("Não foi possível salvar a foto",message,true);

  }finally{
    btn.dataset.uploading="false";
    if(document.body.contains(btn)){
      btn.disabled=!pendingEmployeePhotoFile;
      btn.removeAttribute("aria-busy");
      btn.innerHTML=old;
    }
  }
  return;
}

async function saveUnifiedPersonPosition(form,personId,positionId){
  if(!form||!personId||!positionId)return {changed:false};

  const position=Pos.get(positionId);
  if(!position)return {changed:false};

  const title=String(form.elements.positionTitle?.value||position.title||"").trim();
  const level=form.elements.positionLevel?.value||position.level;
  const seniority=form.elements.positionSeniority?.value||position.seniority||"Não informado";
  const reportsTo=form.elements.reportsTo?.value||null;
  const description=String(form.elements.positionDescription?.value||position.description||"").trim();
  const departmentId=form.elements.departmentId?.value||position.departmentId;

  if(!title)return {changed:false};

  const reportingParents={
    shared:reportingParentIds(position.id,"shared"),
    functional:reportingParentIds(position.id,"functional"),
    advisory:reportingParentIds(position.id,"advisory")
  };

  const payload={
    ...position,
    title,
    level,
    seniority,
    reportsTo,
    description,
    departmentId,
    personId,
    reportingParents
  };

  const result=await Pos.upsert(payload);
  if(!result.ok){
    throw Error(result.e?._global||Object.values(result.e||{})[0]||"Não foi possível salvar o cargo.");
  }

  return {changed:true,position:result.p};
}

async function savePersonForm(form){
  if(!form||form.dataset.submitting==="true")return;

  const raw=Object.fromEntries(new FormData(form).entries());
  const errors={};

  if(!String(raw.name||"").trim())errors.name="Informe o nome completo.";
  if(raw.email&&!/^\S+@\S+\.\S+$/.test(raw.email))errors.email="Informe um e-mail válido.";
  if(raw.positionId&&raw.departmentId&&!Dep.get(raw.departmentId)){
    errors.departmentId="Departamento inválido.";
  }

  if(Object.keys(errors).length){
    showErrors(form,errors);
    setPersonSaveStatus("error","Revise os campos destacados.");
    toast("Revise os campos","Há dados inválidos.",true);
    return;
  }

  const saveButton=form.querySelector("#savePersonBtn");
  const oldButton=saveButton?.innerHTML||"";
  const stateBefore=U.clone(state.data);

  const existing=raw.id?Ppl.get(raw.id):null;
  const oldPosition=Ppl.pos(raw.id||"");
  const oldPositionId=oldPosition?.id||null;
  const positionId=raw.positionId||null;
  const departmentId=raw.departmentId||null;
  const hadPhotoUpload=!!pendingEmployeePhotoFile;

  form.dataset.submitting="true";

  if(saveButton){
    saveButton.disabled=true;
    saveButton.setAttribute("aria-busy","true");
    saveButton.innerHTML=`${I.save}<span>Salvando…</span>`;
  }

  let timeoutId=0;
  let timedOut=false;
  const timeoutPromise=new Promise((_,reject)=>{
    timeoutId=setTimeout(()=>{
      timedOut=true;
      reject(Error("O salvamento excedeu 30 segundos e foi interrompido."));
    },30000);
  });

  let coreSaved=false;
  let photoSaved=false;

  try{
    setPersonSaveStatus("working","Validando dados e sessão…");

    const payload={
      id:raw.id||U.id("person"),
      name:String(raw.name||"").trim(),
      email:String(raw.email||"").trim(),
      phone:String(raw.phone||"").trim(),
      hireDate:raw.hireDate||null,
      active:raw.active==="true",
      avatarUrl:existing?.avatarUrl||"",
      photoPath:existing?.photoPath||""
    };

    const work=async()=>{
      let person;

      if(existing){
        Object.assign(existing,payload);
        person=existing;
      }else{
        state.data.people.push(payload);
        person=payload;
      }

      if(CFG.dataProvider==="supabase"){
        const saveResult=await SupabaseProvider.saveEmployeeReliable(
          person,
          message=>{
            setPersonSaveStatus("working",message);
            if(saveButton){
              saveButton.innerHTML=`${I.save}<span>${U.esc(message)}</span>`;
            }
          }
        );

        coreSaved=true;

        if(hadPhotoUpload){
          setPersonSaveStatus("working","Dados confirmados · enviando foto…");
          if(saveButton)saveButton.innerHTML=`${I.save}<span>Enviando foto…</span>`;

          try{
            await persistEmployeePhoto(person,pendingEmployeePhotoFile);
            photoSaved=true;
          }catch(photoError){
            const message=photoErrorMessage(photoError);
            setPersonSaveStatus("error",`Dados salvos. Foto pendente: ${message}`);
            setEmployeePhotoStatus("error",message);
            toast("Dados salvos, foto não enviada",message,true);
            return {person,partial:true};
          }
        }

        if(oldPositionId!==positionId){
          try{
            await SupabaseProvider.syncEmployeePositionDirect(
              person.id,
              oldPositionId,
              positionId,
              departmentId,
              message=>setPersonSaveStatus("working",message)
            );
          }catch(positionError){
            const msg=friendlySupabaseError(positionError);
            setPersonSaveStatus("error",`Pessoa salva. Cargo pendente: ${msg}`);
            toast("Pessoa salva; cargo pendente",msg,true);
            return {person,partial:true};
          }
        }

        if(positionId&&form.elements.positionTitle){
          setPersonSaveStatus("working","Atualizando cargo e hierarquia…");
          await saveUnifiedPersonPosition(form,person.id,positionId);
        }

        setPersonSaveStatus("working","Atualizando perfil…");

        // Reload from Supabase so UI is based on persisted DB state, not optimistic local data.
        state.data=await withTimeout(
          SupabaseProvider.load(),
          12000,
          "Os dados foram salvos, mas a atualização da tela excedeu o tempo."
        );

        return {person,partial:false};
      }

      // Local mode
      if(hadPhotoUpload){
        await persistEmployeePhoto(person,pendingEmployeePhotoFile);
        photoSaved=true;
      }

      if(positionId&&form.elements.positionTitle){
        await saveUnifiedPersonPosition(form,person.id,positionId);
      }

      await withTimeout(
        LocalProvider.save(state.data),
        8000,
        "Tempo excedido ao salvar os dados locais."
      );
      coreSaved=true;
      return {person,partial:false};
    };

    const result=await Promise.race([work(),timeoutPromise]);

    if(result?.partial){
      return;
    }

    clearPendingEmployeePhoto();
    setPersonSaveStatus(
      "success",
      photoSaved
        ?"Integrante e foto confirmados no banco."
        :"Integrante confirmado no banco."
    );

    toast(
      "Integrante salvo",
      photoSaved
        ?"Dados e foto foram confirmados no Supabase."
        :"Os dados foram gravados e relidos do Supabase com sucesso."
    );

    await new Promise(resolve=>setTimeout(resolve,180));

    const savedPersonId=result?.person?.id||payload.id;
    const onPersonAdminPage=location.hash.startsWith("#/gestao/pessoas/");

    if(onPersonAdminPage){
      clearPendingEmployeePhoto();
      navigateTo(`#/gestao/pessoas/${savedPersonId}`);
    }else{
      closeModal();
      render();
    }

  }catch(error){
    console.error("Falha ao salvar integrante:",error);

    if(!coreSaved){
      state.data=stateBefore;
    }

    const message=timedOut
      ?"O salvamento foi interrompido por tempo excedido. Nenhuma confirmação de gravação foi recebida."
      :friendlySupabaseError(error);

    setPersonSaveStatus("error",message);
    if(hadPhotoUpload&&!photoSaved)setEmployeePhotoStatus("error",message);
    toast("Não foi possível salvar o integrante",message,true);

  }finally{
    clearTimeout(timeoutId);
    form.dataset.submitting="false";

    if(saveButton&&document.body.contains(saveButton)){
      saveButton.disabled=false;
      saveButton.removeAttribute("aria-busy");
      saveButton.innerHTML=oldButton;
    }
  }
}

if(e.target.id==="adminLoginForm"){

  const email=normalizeAdminLoginIdentity(identity);
  const password=document.getElementById("adminLoginPassword")?.value||"";
  const btn=document.getElementById("adminLoginSubmit");
  const statusEl=document.getElementById("adminLoginStatus");

  const setStatus=(kind,message)=>{
    if(!statusEl)return;
    statusEl.className=`admin-login-status ${kind||""}`;
    statusEl.textContent=message||"";
  };

  if(!email||!password){
    setStatus("error","Informe seu usuário/e-mail e sua senha.");
    return;
  }

  if(!CFG.supabaseUrl||!CFG.supabaseAnonKey){
    setStatus("error","O Supabase ainda não está configurado.");
    return;
  }

  const original=btn?.innerHTML||"";
  if(btn){
    btn.disabled=true;
    btn.setAttribute("aria-busy","true");
    btn.innerHTML=`${I.lock}<span>Validando acesso…</span>`;
  }
  setStatus("working","Autenticando e verificando o perfil Administrador…");

  try{
    const ctx=await SupabaseProvider.signInEditor(email,password);

    if(ctx.role!=="admin"){
      await SupabaseProvider.signOutEditor().catch(()=>{});
      throw Error("Acesso negado. Esta área é exclusiva para Administradores.");
    }

    // Reativa o Supabase mesmo quando o boot precisou exibir fallback local.
    activateSupabaseProvider();

    try{
      state.data=normalizeLiveHierarchy(normalizeAppData(await SupabaseProvider.load()));
    }catch(loadError){
      console.error("Autenticação válida, mas falhou o carregamento da Gestão:",loadError);
      throw Error(`Login autorizado, mas a Gestão não conseguiu carregar os dados: ${friendlySupabaseError(loadError)}`);
    }

    state.connectionMode="authenticated";
    state.connectionError=null;
    setStatus("success","Acesso autorizado. Abrindo a Gestão…");
    toast("Bem-vindo à Gestão",`${ctx.user.email||"Administrador"} · acesso administrativo liberado.`);
    navigateTo("#/gestao");

  }catch(error){
    console.error("Falha no login administrativo:",error);
    const message=friendlySupabaseError(error);
    setStatus("error",message);
    document.getElementById("adminLoginPassword")?.focus();
  }finally{
    if(btn?.isConnected){
      btn.disabled=false;
      btn.removeAttribute("aria-busy");
      btn.innerHTML=original;
    }
  }
  return;
}
if(e.target.id==="posForm"){
  const fd=new FormData(e.target);

  p.reportingParents={
    shared:fd.getAll("sharedParentIds").filter(Boolean),

if(e.target.id==="personForm"){

if(e.target.id==="depForm"){
  const form=e.target;
  const d=Object.fromEntries(new FormData(form).entries());
  const er={};

  d.name=String(d.name||"").trim();
  d.acronym=String(d.acronym||"").trim();
  d.description=String(d.description||"").trim();

  if(!d.name)er.name="Informe o nome do departamento.";
  if(d.parentDepartmentId&&d.parentDepartmentId===d.id)er.parentDepartmentId="Um departamento não pode ser superior a si mesmo.";

  if(Object.keys(er).length){
    showErrors(form,er);
    toast("Revise os campos","Há dados inválidos no departamento.",true);
    return;
  }

  d.active=d.active==="true";
  d.parentDepartmentId=d.parentDepartmentId||null;
  d.leaderPositionId=d.leaderPositionId||null;
  d.id=d.id||U.id("dep");

  const existed=!!Dep.get(d.id);
  const before=U.clone(state.data);

  try{
    if(CFG.dataProvider==="supabase"){
      await SupabaseProvider.saveDepartmentReliable(d);
      state.data=normalizeLiveHierarchy(normalizeAppData(await SupabaseProvider.load()));
    }else{
      const ex=Dep.get(d.id);
      const previousLeader=ex?.leaderPositionId||null;
      if(ex)Object.assign(ex,d);
      else state.data.departments.push(d);

      if(previousLeader!==d.leaderPositionId){
        const current=(state.data.departmentLeadershipHistory||[])
          .find(x=>x.departmentId===d.id&&(x.current||!x.endDate));
        if(current){
          current.endDate=previousIsoDate(new Date().toISOString().slice(0,10));
          current.current=false;
        }
        if(d.leaderPositionId){
          state.data.departmentLeadershipHistory??=[];
          state.data.departmentLeadershipHistory.unshift({
            id:U.id("lead"),departmentId:d.id,positionId:d.leaderPositionId,
            startDate:new Date().toISOString().slice(0,10),endDate:null,current:true
          });
        }
      }

      await LocalProvider.save(state.data);
    }

    activity(`${existed?"Departamento atualizado":"Departamento criado"}: ${d.name}`);
    closeModal();
    toast("Departamento salvo","Os dados foram confirmados.");
    render();
  }catch(error){
    state.data=before;
    toast("Não foi possível salvar o departamento",friendlySupabaseError(error),true);
  }
}
},true);

document.addEventListener("keydown",e=>{
  const shortcut=(e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==="k";
  if(shortcut){
    e.preventDefault();
    e.stopPropagation();
    state.commandOpen?closeCommandCenter():openCommandCenter();
    return;
  }

  if(!state.commandOpen)return;

  if(e.key==="Tab"){
    const modal=document.getElementById("commandCenter");
    const focusable=[...modal?.querySelectorAll('input,button,[href],[tabindex]:not([tabindex="-1"])')||[]]
      .filter(el=>!el.disabled&&!el.hidden);
    if(focusable.length){
      const first=focusable[0],last=focusable.at(-1);
      if(e.shiftKey&&document.activeElement===first){
        e.preventDefault();last.focus();
      }else if(!e.shiftKey&&document.activeElement===last){
        e.preventDefault();first.focus();
      }
    }
    return;
  }

  if(e.key==="Escape"){
    e.preventDefault();
    e.stopImmediatePropagation();
    closeCommandCenter();
    return;
  }

  const results=[...document.querySelectorAll(".command-result")];

  if(e.key==="ArrowDown"&&results.length){
    e.preventDefault();
    state.commandIndex=(state.commandIndex+1)%results.length;
    syncCommandSelection();
    return;
  }

  if(e.key==="ArrowUp"&&results.length){
    e.preventDefault();
    state.commandIndex=(state.commandIndex-1+results.length)%results.length;
    syncCommandSelection();
    return;
  }

  if(e.key==="Enter"&&document.activeElement?.id==="commandSearchInput"&&results.length){
    e.preventDefault();
    activateCommandElement(results[state.commandIndex]||results[0]);
  }
},true);

function syncViewportMetrics(){
  const vv=window.visualViewport;
  const height=Math.max(320,Math.round(vv?.height||window.innerHeight||document.documentElement.clientHeight));
  const width=Math.max(280,Math.round(vv?.width||window.innerWidth||document.documentElement.clientWidth));
  const keyboard=Math.max(0,Math.round((window.innerHeight||height)-height-(vv?.offsetTop||0)));
  const root=document.documentElement;

  root.style.setProperty("--app-vh",`${height}px`);
  root.style.setProperty("--app-vw",`${width}px`);
  root.style.setProperty("--keyboard-h",`${keyboard}px`);
  root.classList.toggle("keyboard-open",keyboard>120);
}

let viewportRaf=0;
function scheduleViewportSync(){
  cancelAnimationFrame(viewportRaf);
  viewportRaf=requestAnimationFrame(syncViewportMetrics);
}
syncViewportMetrics();
window.addEventListener("resize",scheduleViewportSync,{passive:true});

async function boot(){
  try{
    if(CFG.dataProvider==="supabase"){
      try{
        state.data=await SupabaseProvider.load();
        state.connectionMode=SupabaseProvider.accessMode;
      }catch(remoteErr){
        console.warn("Falha ao restaurar dados do Supabase; exibindo fallback local sem perder a conexão configurada.",remoteErr);
        state.connectionError=friendlySupabaseError(remoteErr);
        state.data=normalizeLiveHierarchy(normalizeAppData(LocalProvider.load()));
        state.connectionMode="supabase-fallback";
        SupabaseProvider.accessMode="public-read";
        state.editorEmail="";
        state.editorRole="";
      }
    }else{
      state.data=normalizeAppData(await DataService.load());
      state.connectionMode="local";
    }

    const t=tree();
    const visualDesktop=window.matchMedia("(min-width:901px)").matches;
    t.roots.forEach(x=>{
      state.exp.add(x.id);
      state.mexp.add(x.id);
      state.aexp.add(x.id);
      if(visualDesktop){
        x.children.forEach(child=>state.exp.add(child.id));
      }
    });

    if(!location.hash)history.replaceState(null,"","#/organograma");
    render();

    if(state.connectionError){
      setTimeout(()=>toast("Supabase indisponível",state.connectionError,true),250);
    }
  }catch(err){
    console.error(err);
    document.getElementById("app").innerHTML=`<main class="page"><section class="panel pb"><h2>Não foi possível iniciar</h2><p>${U.esc(err.message)}</p></section></main>`;
  }
}
boot();
