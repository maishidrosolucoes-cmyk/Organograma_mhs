/* =========================================================
   PREMIUM HOME / ORGANOGRAMA — visual layer
   ========================================================= */
:root{
  --premium-ink:#111827;
  --premium-navy:#172033;
  --premium-blue:#4665ec;
  --premium-blue-soft:#eef2ff;
  --premium-warm:#fbfaf8;
  --premium-line:#e7e9ee;
  --premium-shadow:0 18px 60px rgba(23,32,51,.08);
  --premium-shadow-card:0 10px 32px rgba(23,32,51,.085);
}
body{background:#f7f8fa}
.top{
  background:rgba(250,250,251,.88);
  border-bottom-color:rgba(226,229,235,.78);
}
.topin{height:74px}
.top .brand{letter-spacing:-.025em}
.top .mark{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(145deg,#131b2d,#263149);
  box-shadow:inset 0 1px rgba(255,255,255,.10),0 8px 18px rgba(17,24,39,.13);
}
.top .nav{
  padding:4px;
  border:1px solid rgba(223,227,234,.8);
  background:rgba(255,255,255,.68);
  border-radius:12px;
}
.top .nav button{min-height:36px;padding:0 13px;border-radius:9px;font-size:13px}
.top .nav button.on{background:#fff;box-shadow:0 2px 8px rgba(17,24,39,.06)}
.top .btn.pri{
  min-height:40px;border-radius:11px;padding-inline:15px;
  background:#171f31;border-color:#171f31;
  box-shadow:0 8px 18px rgba(17,24,39,.11)
}
.page.premium-home{
  max-width:1520px;
  padding-top:28px;
}
.premium-hero{
  position:relative;
  overflow:hidden;
  min-height:330px;
  padding:clamp(28px,4vw,54px);
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);
  align-items:center;
  gap:clamp(28px,5vw,72px);
  background:
    radial-gradient(circle at 86% 12%,rgba(78,103,237,.11),transparent 30%),
    radial-gradient(circle at 58% 105%,rgba(172,184,235,.14),transparent 36%),
    #fff;
  border:1px solid var(--premium-line);
  border-radius:28px;
  box-shadow:0 1px 2px rgba(17,24,39,.02);
}
.premium-hero:after{
  content:"";
  position:absolute;
  width:410px;height:410px;
  right:-180px;bottom:-260px;
  border:1px solid rgba(70,101,236,.11);
  border-radius:50%;
  box-shadow:0 0 0 44px rgba(70,101,236,.018),0 0 0 90px rgba(70,101,236,.012);
  pointer-events:none;
}
.hero-copy{position:relative;z-index:1;max-width:840px}
.hero-kicker{
  display:inline-flex;align-items:center;gap:8px;
  min-height:30px;padding:0 11px;
  border:1px solid #e2e6f6;border-radius:999px;
  background:#f8f9ff;color:#4457ad;
  font-size:11px;font-weight:850;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:18px;
}
.hero-kicker:before{
  content:"";width:7px;height:7px;border-radius:50%;
  background:#5872eb;box-shadow:0 0 0 4px #5872eb16;
}
.premium-hero h1{
  max-width:900px;
  font-size:clamp(36px,5vw,64px);
  line-height:.98;
  letter-spacing:-.055em;
  color:#121a2a;
  margin-bottom:18px;
}
.premium-hero .lead{
  max-width:720px;
  font-size:clamp(15px,1.55vw,18px);
  color:#647084;
  line-height:1.7;
}
.hero-proof{
  position:relative;z-index:1;
  padding:18px;
  border:1px solid rgba(224,228,236,.94);
  border-radius:20px;
  background:rgba(252,252,253,.82);
  backdrop-filter:blur(8px);
}
.hero-proof-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:13px;
}
.hero-proof-head strong{font-size:13px;letter-spacing:-.01em}
.live-pill{
  display:inline-flex;align-items:center;gap:7px;
  color:#47705e;font-size:11px;font-weight:800;
}
.live-pill:before{content:"";width:7px;height:7px;border-radius:50%;background:#4b9a72;box-shadow:0 0 0 4px #4b9a7214}
.premium-metrics{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.premium-metric{
  min-width:0;padding:14px 12px;
  border-radius:14px;background:#fff;border:1px solid #eceef2;
}
.premium-metric b{display:block;font-size:24px;letter-spacing:-.045em;color:#172033}
.premium-metric span{display:block;margin-top:4px;font-size:10px;color:#7b8798;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.hero-proof-note{
  display:flex;align-items:center;gap:9px;
  margin-top:12px;padding-top:12px;border-top:1px solid #e9ecf1;
  color:#7a8798;font-size:11px;line-height:1.45
}
.hero-proof-note .mini-ring{
  width:26px;height:26px;border-radius:9px;background:#edf1ff;color:#526be5;
  display:grid;place-items:center;flex:0 0 auto
}

.org-premium{
  border-color:#e4e7ed;
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--premium-shadow);
  background:#fff;
}
.org-premium>.ph{
  padding:22px 24px 18px;
  border-bottom:0;
  background:#fff;
}
.org-title-row{display:flex;align-items:center;gap:11px}
.org-title-icon{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  color:#4057c9;background:#f0f3ff;border:1px solid #e0e5ff;
}
.org-title-copy h2{
  margin:0;font-size:18px;letter-spacing:-.025em
}
.org-title-copy span{display:block;margin-top:3px;color:#7b8798;font-size:12px}
.org-legend{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.legend-chip{
  display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 9px;
  border:1px solid #e6e8ed;border-radius:999px;background:#fff;
  color:#6d7888;font-size:10px;font-weight:780
}

   ORGANOGRAMA — inspirado na referência visual enviada

.reference-org{
  height:760px!important;
  background:
    radial-gradient(circle at 50% 8%,rgba(255,255,255,.92),transparent 28%),
    linear-gradient(135deg,#f0f2f4 0%,#e8ebee 48%,#eef0f2 100%)!important;
}
.reference-org:after{
  content:"";
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.22),transparent 30%,transparent 70%,rgba(255,255,255,.18));
}
.reference-org .stage{padding:92px 100px 150px!important}
.reference-org .branch{padding-inline:22px}
.reference-org .children{padding-top:68px;margin-top:28px}
.reference-org .children:before,
.reference-org .child:before,
.reference-org .child>.branch:before{
  border-color:#aeb6bf!important;
}
.reference-org .children:before{height:36px!important}
.reference-org .child>.branch:before{height:40px!important}

.reference-org .ref-node{
  --level:#f0ad10;
  position:relative;
  width:286px!important;
  min-height:106px!important;
  padding:22px 26px 18px 86px!important;
  border:1px solid rgba(255,255,255,.95)!important;
  border-radius:54px!important;
  background:rgba(255,255,255,.96)!important;
  text-align:left!important;
  overflow:visible!important;
  box-shadow:
    0 18px 35px rgba(77,85,94,.14),
    inset 0 1px 0 rgba(255,255,255,.95)!important;
}
.reference-org .ref-node.str{--level:#199a9a}
.reference-org .ref-node.tac{--level:#56b83e}
.reference-org .ref-node.op{--level:#f0ad10}
.reference-org .ref-node:before{display:none!important}
.reference-org .ref-node:hover{
  transform:translateY(-4px)!important;
  box-shadow:
    0 22px 44px rgba(77,85,94,.18),
    0 0 0 1px color-mix(in srgb,var(--level) 34%,transparent)!important;
}
.reference-org .ref-node.sel,
.reference-org .ref-node.hit{
  border-color:color-mix(in srgb,var(--level) 52%,white)!important;
  box-shadow:
    0 0 0 5px color-mix(in srgb,var(--level) 14%,transparent),
    0 22px 44px rgba(77,85,94,.18)!important;
}

.portrait-orbit{
  position:absolute;
  left:-34px;
  top:50%;
  transform:translateY(-50%);
  width:92px;height:92px;
  border-radius:50%;
  display:grid;place-items:center;
  background:conic-gradient(var(--level) 0 73%,rgba(255,255,255,.15) 73% 100%);
  filter:drop-shadow(0 10px 16px rgba(75,83,91,.16));
}
.portrait-orbit:before{
  content:"";
  position:absolute;
  inset:8px;
  border-radius:50%;
  background:#f4f5f6;
  border:4px solid rgba(255,255,255,.96);
  box-shadow:inset 0 0 0 1px #d6dbe0;
}
.portrait-orbit .avatar{
  position:relative;
  z-index:1;
  width:62px!important;height:62px!important;
  border-radius:50%!important;
  border:0!important;
  background:#e8ebef!important;
  color:#344152!important;
  font-size:15px!important;
  box-shadow:none!important;
}
.portrait-orbit .avatar img{
  width:100%;height:100%;object-fit:cover;border-radius:50%;
}

.level-ribbon{
  position:absolute;
  right:20px;
  top:-10px;
  min-height:28px;
  padding:0 12px;
  display:inline-flex;
  align-items:center;
  border-radius:0 0 10px 10px;
  background:var(--level);
  color:#fff;
  font-size:9px;
  font-weight:900;
  letter-spacing:.06em;
  text-transform:uppercase;
  box-shadow:0 6px 12px color-mix(in srgb,var(--level) 25%,transparent);
}
.level-ribbon:after{
  content:"";
  position:absolute;
  right:-8px;top:0;
  border-top:10px solid color-mix(in srgb,var(--level) 78%,black);
  border-right:8px solid transparent;
}

.ref-copy{display:block;min-width:0}
.ref-name{
  display:block;
  color:#172132;
  font-size:15px;
  line-height:1.2;
  font-weight:850;
  letter-spacing:-.02em;
}
.ref-title{
  display:block;
  margin-top:6px;
  color:var(--level);
  font-size:11px;
  line-height:1.35;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.025em;
}
.ref-dept{
  display:block;
  margin-top:6px;
  color:#8a949f;
  font-size:9px;
  line-height:1.35;
  font-weight:680;
}

  width:330px!important;

  text-align:center!important;

}

  left:50%;
  top:-54px;
  transform:translateX(-50%);
  width:104px;height:104px;
}
.reference-org .ref-node.depth-0 .portrait-orbit .avatar{
  width:72px!important;height:72px!important;
}

  top:-5px;right:22px;
}
.reference-org .ref-node.depth-0 .ref-name{
  font-size:17px;
}
.reference-org .ref-node.depth-0 .ref-title{
  font-size:11px;
}
.reference-org .toggle{
  bottom:-18px!important;
  border:1px solid rgba(186,193,201,.95)!important;
  background:rgba(255,255,255,.96)!important;
}

/* níveis organizacionais — estrutura vertical clara */

  z-index:1;
  pointer-events:none;
  display:grid;

}
.app-header-main{
  height:58px;
  display:grid;
  grid-template-columns:minmax(180px,1fr) auto;
  align-items:center;

}

.profile-menu-wrap{

  -webkit-backdrop-filter:blur(28px) saturate(170%);

.dept-code{
  flex:0 0 auto;
  min-height:22px;
  padding:0 7px;
  display:inline-flex;
  align-items:center;
  border-radius:7px;
  background:#f1f3f6;
  color:#8390a1;
  font-size:9px;
  font-weight:850;
  letter-spacing:.04em;
}
.dept-title-wrap p{
  margin:8px 0 0;
  color:#677487;
  font-size:11px;
  line-height:1.5;
}

.dept-leader-block{
  margin-top:18px;
  min-height:57px;
  padding:9px 10px;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid #e8ebef;
  border-radius:13px;
  background:rgba(248,249,251,.82);
}
.dept-leader-block .avatar{
  width:38px!important;
  height:38px!important;
  border-radius:11px!important;
  font-size:10px!important;
}
.dept-leader-copy{
  min-width:0;
  flex:1;
}
.dept-leader-copy>span{
  display:block;
  margin-bottom:2px;
  color:#929ba7;
  font-size:8px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.055em;
}
.dept-leader-copy strong{
  display:block;
  color:#26303d;
  font-size:11px;
  line-height:1.2;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.dept-leader-copy small{
  display:block;
  margin-top:2px;
  color:#7c8797;
  font-size:9px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.dept-leader-action{
  width:30px;
  height:30px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border:0;
  border-radius:9px;
  background:#fff;
  color:#748094;
  cursor:pointer;
  box-shadow:0 1px 4px rgba(25,31,39,.05);
}
.dept-leader-action:hover{
  background:#edf0f4;
  color:#2d3744;
}
.dept-leader-action .icon{
  width:14px;
  height:14px;
}

.dept-metrics{
  margin-top:auto;
  padding-top:15px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;
}
.dept-metric{
  min-width:0;
  padding:0 10px;
  border-right:1px solid #e9ecf0;
}
.dept-metric:first-child{padding-left:0}
.dept-metric:last-child{
  padding-right:0;
  border-right:0;
}
.dept-metric strong{
  display:block;
  color:#1d2633;
  font-size:16px;
  line-height:1;
  letter-spacing:-.035em;
}
.dept-metric span{
  display:block;
  margin-top:5px;
  color:#8a94a3;
  font-size:8px;
  font-weight:700;
}
.dept-metric-soft strong{
  color:#7b8491;
}

@media(max-width:1100px){
  .dept-premium-card:nth-child(1),
  .dept-premium-card:nth-child(2),
  .dept-premium-card:nth-child(n+3){
    grid-column:span 6;
  }
  .dept-premium-card:last-child:nth-child(odd){
    grid-column:3/span 8;
  }
}

@media(max-width:720px){
  .departments-page{
    padding:12px 10px 90px;
  }
  .departments-heading{
    min-height:52px;
    margin-bottom:8px;
  }
  .departments-heading h1{
    font-size:22px!important;
  }
  .departments-premium-grid{
    grid-template-columns:1fr;
    gap:10px;
  }
  .dept-premium-card:nth-child(n){
    grid-column:auto!important;
    min-height:220px;
    padding:17px;
  }
  .dept-title-line h2{
    font-size:15px!important;
  }
}


/* =========================================================
   RESPONSIVE SYSTEM — adaptive premium UI
   ========================================================= */
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --app-vh:100dvh;
  --app-vw:100vw;
  --tap:44px;
}

html{
  width:100%;
  min-width:280px;
  min-height:100%;
  overflow-x:hidden;
  text-size-adjust:100%;
  -webkit-text-size-adjust:100%;
}
body,#app{
  width:100%;
  max-width:100%;
  min-height:100%;
  overflow-x:hidden;
}
body{
  min-height:100vh;
  min-height:100dvh;
  min-height:var(--app-vh);
}
img,svg,video,canvas{
  max-width:100%;
}
button,a,input,select,textarea{
  -webkit-tap-highlight-color:transparent;
}
button,a,[role="button"]{
  touch-action:manipulation;
}
input,select,textarea{
  max-width:100%;
}
p,h1,h2,h3,strong,b,span,label{
  overflow-wrap:break-word;
}
.ellipsis{
  overflow-wrap:normal;
}

/* Safe-area aware public shell */
.app-header-main{
  padding-left:max(clamp(14px,2.2vw,26px),var(--safe-left))!important;
  padding-right:max(clamp(14px,2.2vw,26px),var(--safe-right))!important;
}
.app-public-header{
  padding-top:var(--safe-top)!important;
}
.app-public-header + .ios-org-home{
  height:calc(var(--app-vh) - 94px - var(--safe-top))!important;
  max-height:none!important;
}
.page,
.departments-page{
  padding-left:max(clamp(13px,2.5vw,30px),calc(var(--safe-left) + 10px))!important;
  padding-right:max(clamp(13px,2.5vw,30px),calc(var(--safe-right) + 10px))!important;
}

/* Fluid content widths */
.page,
.departments-shell{
  width:100%;
}
.page{
  max-width:1560px;
}
.acont{
  width:100%;
  max-width:1600px;
  margin-inline:auto;
  padding-left:max(clamp(16px,3vw,30px),calc(var(--safe-left) + 12px))!important;
  padding-right:max(clamp(16px,3vw,30px),calc(var(--safe-right) + 12px))!important;
}
.panel,.hero,.dept-premium-card,.setting,.connection-panel{
  min-width:0;
}

/* Public header adapts progressively instead of abruptly */
@media(max-width:1040px){
  .app-header-brand .brand>span:last-child{
    max-width:170px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .app-section-nav{
    gap:clamp(12px,2vw,20px)!important;
  }
}

@media(max-width:820px){
  .app-header-main{
    height:54px!important;
    grid-template-columns:minmax(0,1fr) auto!important;
  }
  .app-header-brand .brand>span:last-child{
    max-width:130px;
  }

  /* Persistent mobile tab bar: fewer taps, iOS-like navigation */
  .app-section-nav{
    position:fixed!important;
    left:max(10px,var(--safe-left))!important;
    right:max(10px,var(--safe-right))!important;
    bottom:max(10px,var(--safe-bottom))!important;
    z-index:64!important;
    height:60px!important;
    display:grid!important;
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
    gap:3px!important;
    padding:5px!important;
    border:1px solid rgba(207,212,220,.84)!important;
    border-radius:19px!important;
    background:rgba(248,249,251,.88)!important;
    box-shadow:0 14px 40px rgba(20,25,32,.15)!important;
    backdrop-filter:blur(26px) saturate(180%)!important;
    -webkit-backdrop-filter:blur(26px) saturate(180%)!important;
    transform:none!important;
    opacity:1!important;
    visibility:visible!important;
    pointer-events:auto!important;
  }
  .app-section-nav button{
    height:48px!important;
    justify-content:center!important;
    flex-direction:column!important;
    gap:2px!important;
    border-radius:14px!important;
    font-size:8px!important;
  }
  .app-section-nav button .icon{
    display:block!important;
    width:16px!important;
    height:16px!important;
  }
  .app-section-nav button.on{
    background:#fff!important;
    box-shadow:0 2px 9px rgba(24,30,38,.075)!important;
  }
  .app-section-nav button.on:after{
    display:none!important;
  }
  #mobileMenu{
    display:none!important;
  }

  .profile-popover{
    position:fixed!important;
    top:calc(var(--safe-top) + 60px)!important;
    right:max(10px,var(--safe-right))!important;
    width:min(300px,calc(100vw - var(--safe-left) - var(--safe-right) - 20px))!important;
    max-height:calc(var(--app-vh) - var(--safe-top) - 78px)!important;
    overflow:auto!important;
  }

  .app-public-header + .ios-org-home{
    height:calc(var(--app-vh) - 54px - var(--safe-top))!important;
    padding:8px 8px calc(78px + var(--safe-bottom))!important;
  }
  .app-public-header + .page,
  .departments-page{
    padding-bottom:calc(88px + var(--safe-bottom))!important;
  }
}

@media(max-width:520px){
  .app-header-brand .brand>span:last-child{
    display:none!important;
  }
  .app-header-brand .mark{
    width:32px!important;
    height:32px!important;
  }
  .app-header-actions{
    gap:4px!important;
  }
  .app-header-icon,.profile-trigger{
    width:36px!important;
    height:36px!important;
  }
}

/* Organogram controls intelligently reflow */
@media(max-width:1100px){
  .ios-org-controls .toolbar{
    gap:5px!important;
  }
  .ios-org-controls select.control{
    min-width:118px!important;
  }
  .ios-zoom #center span{
    display:none!important;
  }
  .ios-zoom #center{
    min-width:34px!important;
    width:34px!important;
    padding:0!important;
  }
}
@media(max-width:900px){
  .ios-org-controls .toolbar{
    display:grid!important;
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
    gap:6px!important;
  }
  .ios-org-controls .search{
    grid-column:1/-1!important;
    min-width:0!important;
  }
  .ios-org-controls select.control{
    width:100%!important;
    min-width:0!important;
  }
  .ios-mobile-tree{
    overscroll-behavior:contain;
  }
  .premium-mobile .trow{
    padding-left:calc(8px + min(calc(var(--d) * 14px),48px))!important;
    padding-right:8px!important;
    gap:7px!important;
  }
}
@media(max-width:560px){
  .ios-org-controls .toolbar{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
  }
  .ios-org-controls .search{
    grid-column:1/-1!important;
  }
  .ios-org-controls #fStatus{
    grid-column:1/-1!important;
  }
  .ios-org-topbar{
    min-height:52px!important;
    padding:10px 12px 7px!important;
  }
  .ios-org-heading h1{
    font-size:17px!important;
  }
  .ios-org-heading>span{
    font-size:9px!important;
  }
}
@media(max-width:380px){
  .ios-org-controls .toolbar{
    grid-template-columns:1fr!important;
  }
  .ios-org-controls .search,
  .ios-org-controls #fStatus{
    grid-column:auto!important;
  }
  .ios-org-heading>span{
    display:none!important;
  }
  .premium-mobile .badge{
    width:8px!important;
    min-width:8px!important;
    height:8px!important;
    min-height:8px!important;
    padding:0!important;
    border:0!important;
    border-radius:50%!important;
    font-size:0!important;
  }
}

/* Departments: graceful 3 -> 2 -> 1 column progression */
@media(min-width:1400px){
  .departments-premium-grid{
    gap:16px!important;
  }
}
@media(max-width:1180px){
  .dept-premium-card:nth-child(n){
    grid-column:span 6!important;
  }
  .dept-premium-card:last-child:nth-child(odd){
    grid-column:3/span 8!important;
  }
}
@media(max-width:760px){
  .departments-heading{
    align-items:center!important;
  }
  .departments-count{
    min-height:28px!important;
  }
  .dept-premium-card:nth-child(n){
    grid-column:1/-1!important;
  }
}
@media(max-width:420px){
  .departments-page{
    padding-top:8px!important;
  }
  .departments-heading{
    min-height:48px!important;
  }
  .departments-kicker{
    display:none!important;
  }
  .departments-heading h1{
    font-size:21px!important;
  }
  .dept-premium-card{
    padding:15px!important;
    border-radius:17px!important;
  }
  .dept-symbol{
    width:38px!important;
    height:38px!important;
  }
  .dept-title-line{
    align-items:flex-start!important;
  }
  .dept-title-line h2{
    white-space:normal!important;
    font-size:15px!important;
  }
  .dept-metrics{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:10px 0!important;
  }
  .dept-metric:nth-child(2){
    border-right:0!important;
  }
  .dept-metric:nth-child(3),
  .dept-metric:nth-child(4){
    padding-top:9px!important;
    border-top:1px solid #e9ecf0!important;
  }
}

/* Lists/tables become informative touch cards on phones */
@media(max-width:680px){
  .panel>.list,
  .list{
    gap:8px!important;
    padding:8px!important;
  }
  .list .row.head{
    display:none!important;
  }
  .list .row:not(.head){
    margin:0!important;
    padding:12px!important;
    display:grid!important;
    grid-template-columns:minmax(0,1fr) auto!important;
    grid-template-rows:auto auto auto!important;
    gap:4px 9px!important;
    border:1px solid #e7eaef!important;
    border-radius:13px!important;
    background:#fff!important;
  }
  .list .row:not(.head)>.pcell{
    grid-column:1!important;
    grid-row:1!important;
    min-width:0!important;
  }
  .list .row:not(.head)>*:last-child{
    display:grid!important;
    grid-column:2!important;
    grid-row:1!important;
    align-self:center!important;
  }
  .list .row:not(.head)>*:nth-child(2){
    display:block!important;
    grid-column:1!important;
    grid-row:2!important;
    color:#5d697a!important;
    font-size:11px!important;
    overflow:hidden!important;
    text-overflow:ellipsis!important;
    white-space:nowrap!important;
  }
  .list .row:not(.head)>*:nth-child(3){
    display:block!important;
    grid-column:1!important;
    grid-row:3!important;
    color:#8a94a2!important;
    font-size:9px!important;
    overflow:hidden!important;
    text-overflow:ellipsis!important;
    white-space:nowrap!important;
  }
  .list .row:not(.head)>*:nth-child(4){
    display:flex!important;
    grid-column:2!important;
    grid-row:2/4!important;
    align-self:center!important;
    justify-self:end!important;
  }
  .list .row:not(.head) .badge{
    white-space:nowrap!important;
  }
}

/* Admin shell — sidebar becomes off-canvas before content gets cramped */
@media(max-width:1100px){
  .admin{
    display:block!important;
  }
  .side{
    position:fixed!important;
    left:0!important;
    top:0!important;
    width:min(276px,calc(100vw - 54px))!important;
    height:var(--app-vh)!important;
    padding:
      max(16px,var(--safe-top))
      13px
      max(16px,var(--safe-bottom))!important;
    transform:translateX(-103%)!important;
    transition:transform .2s ease!important;
    z-index:82!important;
  }
  .side.open{
    transform:none!important;
  }
  .sidebarToggle{
    display:grid!important;
  }
  .amain{
    width:100%!important;
  }
}
.atop{
  min-width:0;
  padding-left:max(clamp(12px,2vw,24px),calc(var(--safe-left) + 10px))!important;
  padding-right:max(clamp(12px,2vw,24px),calc(var(--safe-right) + 10px))!important;
}
.atop-title{
  min-width:0;
  display:flex;
  align-items:center;
  gap:9px;
}
.atop-title h1{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.atop-action:empty{
  display:none;
}
@media(max-width:580px){
  .atop{
    height:60px!important;
  }
  .atop-title{
    min-width:0;
  }
  .atop h1{
    font-size:17px!important;
  }
  .atop-action .responsive-action{
    width:42px!important;
    min-width:42px!important;
    padding:0!important;
  }
  .atop-action .responsive-action .action-label{
    display:none!important;
  }
  .atop-action .responsive-action .icon{
    width:18px!important;
    height:18px!important;
  }
  .acont{
    padding-top:14px!important;
    padding-bottom:calc(24px + var(--safe-bottom))!important;
    gap:14px!important;
  }
}
@media(max-width:420px){
  .akpis{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:8px!important;
  }
  .akpi{
    padding:14px!important;
  }
  .akpi b{
    font-size:24px!important;
  }
  .supabase-dashboard-cta{
    padding:16px!important;
  }
  .supabase-dashboard-cta .cta-responsive-action{
    width:44px!important;
    min-width:44px!important;
    padding:0!important;
    align-self:flex-end!important;
  }
  .supabase-dashboard-cta .cta-responsive-action .action-label{
    display:none!important;
  }
}

/* Admin hierarchy: indentation is capped to avoid horizontal overflow */
@media(max-width:680px){
  .structure{
    padding:4px!important;
  }
  .srow{
    min-height:58px!important;
    padding-left:calc(5px + min(calc(var(--d) * 14px),46px))!important;
    padding-right:5px!important;
    gap:5px!important;
  }
  .smain{
    gap:7px!important;
    min-width:0!important;
  }
  .smain .avatar{
    width:34px!important;
    height:34px!important;
    border-radius:10px!important;
  }
  .sactions button{
    width:38px!important;
    height:38px!important;
  }
}

/* Forms and native controls: avoid iOS auto-zoom, preserve ergonomics */
@media(hover:none), (pointer:coarse){
  .btn,.iconbtn,.kebab,.zbtn,.ttog,.sactions button,
  .app-header-icon,.profile-trigger,.dept-leader-action,
  .secret-toggle{
    min-height:var(--tap);
  }
  .control,
  input.control,
  select.control,
  textarea.control{
    font-size:16px!important;
  }
  select.control{
    padding-right:30px!important;
  }
}
@media(max-width:700px){
  .formgrid{
    grid-template-columns:1fr!important;
    gap:12px!important;
  }
  .field.full{
    grid-column:auto!important;
  }
  .mbody{
    padding:16px max(14px,calc(var(--safe-right) + 10px))
      16px max(14px,calc(var(--safe-left) + 10px))!important;
  }
}
@media(max-width:460px){
  .employee-photo-dropzone{
    padding:13px!important;
    gap:12px!important;
  }
  .employee-photo-preview{
    width:62px!important;
    height:62px!important;
    border-radius:17px!important;
  }
  .employee-photo-copy span{
    font-size:10px!important;
  }
  .employee-photo-action{
    min-height:30px!important;
  }
}

/* Modal/drawer: safe areas + dynamic viewport + keyboard */
.drawer{
  height:var(--app-vh)!important;
  padding-top:var(--safe-top)!important;
  padding-bottom:var(--safe-bottom)!important;
}
.modal{
  max-width:calc(100vw - var(--safe-left) - var(--safe-right) - 24px)!important;
  max-height:min(88dvh,calc(var(--app-vh) - 20px))!important;
}
@media(max-width:620px){
  .drawer{
    top:auto!important;
    bottom:0!important;
    left:var(--safe-left)!important;
    right:var(--safe-right)!important;
    width:auto!important;
    height:min(88dvh,calc(var(--app-vh) - var(--safe-top) - 8px))!important;
    border-radius:20px 20px 0 0!important;
    padding-top:0!important;
  }
  .modal{
    left:var(--safe-left)!important;
    right:var(--safe-right)!important;
    bottom:0!important;
    top:auto!important;
    width:auto!important;
    max-width:none!important;
    max-height:calc(var(--app-vh) - var(--safe-top) - 6px)!important;
    border-radius:20px 20px 0 0!important;
  }
  .mhead{
    position:sticky!important;
    top:0!important;
    z-index:2!important;
    background:rgba(255,255,255,.94)!important;
    backdrop-filter:blur(20px)!important;
    -webkit-backdrop-filter:blur(20px)!important;
  }
  .mfoot{
    position:sticky!important;
    bottom:0!important;
    z-index:2!important;
    padding-bottom:max(13px,var(--safe-bottom))!important;
    background:rgba(248,250,252,.96)!important;
    backdrop-filter:blur(20px)!important;
    -webkit-backdrop-filter:blur(20px)!important;
  }
}
.keyboard-open .modal{
  max-height:calc(var(--app-vh) - 4px)!important;
}
.keyboard-open .drawer{
  max-height:var(--app-vh)!important;
}

/* Toasts never collide with cutouts / home indicator */
.toasts{
  right:max(12px,var(--safe-right))!important;
  left:auto!important;
  bottom:max(12px,var(--safe-bottom))!important;
  max-width:calc(100vw - var(--safe-left) - var(--safe-right) - 24px)!important;
}
@media(max-width:520px){
  .toasts{
    left:max(12px,var(--safe-left))!important;
    right:max(12px,var(--safe-right))!important;
    width:auto!important;
  }
}

/* Supabase/settings adapt without squeezing */
@media(max-width:840px){
  .settings{
    grid-template-columns:1fr!important;
  }
  .connection-mini-grid{
    grid-template-columns:1fr!important;
  }
  .connection-steps{
    grid-template-columns:1fr!important;
  }
}
@media(max-width:560px){
  .connection-hero{
    padding:18px!important;
  }
  .connection-form{
    padding:17px 16px 6px!important;
  }
  .connection-actions{
    padding:12px 16px 16px!important;
    display:grid!important;
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
  }
  .connection-actions .btn{
    width:100%!important;
    min-width:0!important;
    padding-inline:10px!important;
  }
  .connection-secondary-actions{
    padding:0 16px 14px!important;
    flex-wrap:wrap!important;
  }
  .connection-note{
    margin:0 16px 16px!important;
  }
}
@media(max-width:380px){
  .connection-actions{
    grid-template-columns:1fr!important;
  }
}

/* Short landscape screens: compact chrome, preserve content */
@media(max-height:560px) and (orientation:landscape) and (pointer:coarse){
  .app-header-main{
    height:48px!important;
  }
  .app-header-brand .brand>span:last-child{
    display:none!important;
  }
  .app-public-header + .ios-org-home{
    height:calc(var(--app-vh) - 48px - var(--safe-top))!important;
  }
  .ios-org-topbar{
    min-height:44px!important;
    padding-block:7px 5px!important;
  }
  .ios-org-controls{
    padding-bottom:7px!important;
  }
  .app-section-nav{
    height:52px!important;
    bottom:max(6px,var(--safe-bottom))!important;
  }
  .app-section-nav button{
    height:40px!important;
  }
  .app-section-nav button span{
    display:none!important;
  }
  .app-section-nav button .icon{
    width:18px!important;
    height:18px!important;
  }
}

/* High-DPI / large screens stay spacious rather than oversized */
@media(min-width:1800px){
  .departments-shell,.page,.acont{
    max-width:1680px!important;
  }
  .ios-org-surface{
    max-width:1920px;
    margin-inline:auto;
  }
}

/* Accessibility preferences */
@media(prefers-reduced-motion:reduce){
  .side,.modal,.drawer,.profile-popover,.app-section-nav,
  .dept-premium-card,.ref-node,.employee-photo-dropzone{
    transition:none!important;
  }
}
@media(prefers-contrast:more){
  .panel,.dept-premium-card,.modal,.drawer,.profile-popover,
  .app-section-nav,.connection-panel{
    border-color:#aeb5c0!important;
  }
}


/* =========================================================
   MOBILE NAVIGATION FIX — camada independente do header
   ========================================================= */
.app-section-nav{
  position:sticky;
  top:calc(58px + var(--safe-top));
  z-index:40;
}

.app-public-header{
  overflow:visible;
}

.ios-org-home{
  height:calc(var(--app-vh) - 94px - var(--safe-top))!important;
}

.app-section-nav + .page{
  padding-top:28px;
}

/* Evita que backdrop-filter do header altere o contexto do menu */
.profile-menu-wrap{
  position:relative!important;
}
.profile-popover{
  position:absolute!important;
  top:43px!important;
  right:0!important;
}

@media(max-width:820px){
  /* Navegação real presa ao viewport, não ao header */
  .app-section-nav{
    position:fixed!important;
    top:auto!important;
    left:max(10px,var(--safe-left))!important;
    right:max(10px,var(--safe-right))!important;
    bottom:max(10px,var(--safe-bottom))!important;
    z-index:90!important;

    width:auto!important;
    height:60px!important;
    min-height:60px!important;
    margin:0!important;
    padding:5px!important;

    display:grid!important;
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
    align-items:stretch!important;
    gap:3px!important;

    border:1px solid rgba(207,212,220,.88)!important;
    border-radius:19px!important;
    background:rgba(248,249,251,.94)!important;

    box-shadow:
      0 16px 42px rgba(20,25,32,.16),
      0 2px 8px rgba(20,25,32,.06)!important;

    backdrop-filter:blur(26px) saturate(180%)!important;
    -webkit-backdrop-filter:blur(26px) saturate(180%)!important;

    transform:none!important;
    opacity:1!important;
    visibility:visible!important;
    pointer-events:auto!important;
    overflow:visible!important;
  }

  .app-section-nav button{
    min-width:0!important;
    width:100%!important;
    height:48px!important;
    padding:4px 2px!important;

    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
    flex-direction:column!important;
    gap:2px!important;

    border-radius:14px!important;
    overflow:hidden!important;
  }

  .app-section-nav button .icon{
    display:block!important;
    width:16px!important;
    height:16px!important;
    flex:0 0 auto!important;
  }

  .app-section-nav button span{
    display:block!important;
    width:100%!important;
    overflow:hidden!important;
    text-overflow:ellipsis!important;
    white-space:nowrap!important;
    text-align:center!important;
    font-size:8px!important;
    line-height:1.1!important;
  }

  .app-section-nav button.on{
    background:#fff!important;
    box-shadow:0 2px 9px rgba(24,30,38,.075)!important;
  }

  .app-section-nav button.on:after{
    display:none!important;
  }

  .app-header-main{
    height:54px!important;
  }

  #mobileMenu{
    display:none!important;
  }

  /* Espaço reservado para a tab bar inferior */
  .ios-org-home{
    height:calc(var(--app-vh) - 54px - var(--safe-top))!important;
    padding:
      8px
      max(8px,var(--safe-right))
      calc(84px + var(--safe-bottom))
      max(8px,var(--safe-left))!important;
  }

  .app-section-nav + .page,
  .departments-page{
    padding-bottom:calc(90px + var(--safe-bottom))!important;
  }

  /* Menu do avatar ancorado corretamente ao botão */
  .profile-popover{
    position:absolute!important;
    top:43px!important;
    right:0!important;
    width:min(300px,calc(100vw - var(--safe-left) - var(--safe-right) - 20px))!important;
    max-height:calc(var(--app-vh) - var(--safe-top) - 70px)!important;
    overflow:auto!important;
  }
}

@media(max-width:360px){
  .app-section-nav{
    left:max(6px,var(--safe-left))!important;
    right:max(6px,var(--safe-right))!important;
    bottom:max(6px,var(--safe-bottom))!important;
    height:56px!important;
    min-height:56px!important;
    border-radius:17px!important;
  }

  .app-section-nav button{
    height:44px!important;
  }

  .app-section-nav button span{
    font-size:7.5px!important;
  }

  .ios-org-home{
    padding-bottom:calc(76px + var(--safe-bottom))!important;
  }
}

@media(max-height:560px) and (orientation:landscape) and (pointer:coarse){
  .app-section-nav{
    top:auto!important;
    height:50px!important;
    min-height:50px!important;
    bottom:max(5px,var(--safe-bottom))!important;
  }

  .app-section-nav button{
    height:38px!important;
    flex-direction:row!important;
    gap:5px!important;
  }

  .app-section-nav button span{
    display:none!important;
  }

  .ios-org-home{
    padding-bottom:calc(62px + var(--safe-bottom))!important;
  }
}


/* =========================================================

   Logo palette sampled from the supplied artwork:
   navy #17243f · cyan #248bab · red #d9312f
   ========================================================= */
:root{
  --brand-navy:#17243f;
  --brand-navy-2:#203657;
  --brand-cyan:#248bab;
  --brand-cyan-2:#54abc5;
  --brand-cyan-soft:#e9f6fa;
  --brand-red:#d9312f;
  --brand-red-soft:#fff0ef;
  --brand-ice:#f3f8fa;
  --brand-cloud:#edf4f6;
  --brand-line:#d8e5ea;

  --bg:#f3f8fa;
  --s:#ffffff;
  --s2:#f6fafb;
  --txt:#17243f;
  --mut:#6f8190;
  --line:#dbe6ea;
  --pri:#248bab;
  --prih:#187b9a;
  --nav:#17243f;
  --str:#17243f;
  --tac:#248bab;
  --op:#d95a55;
  --ok:#168264;
  --sh:0 14px 38px rgba(23,36,63,.08);
}

html,body{
  background:#f3f8fa!important;
}
body{
  color:var(--brand-navy)!important;
  position:relative;
}

  content:"";

    linear-gradient(rgba(243,248,250,.89),rgba(243,248,250,.89)),
    url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22180%22%20height%3D%22180%22%20viewBox%3D%220%200%20180%20180%22%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22%23248bab%22%20stroke-width%3D%221.3%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20opacity%3D%22.48%22%3E%0A%20%20%3Cpath%20d%3D%22M20%2032c8-6%2016-6%2024%200s16%206%2024%200%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M20%2039c8-6%2016-6%2024%200s16%206%2024%200%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M132%2022c0%207-9%2010-9%2018a9%209%200%200%200%2018%200c0-8-9-11-9-18Z%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M28%20125h18m-9-9v18%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%22142%22%20cy%3D%22135%22%20r%3D%229%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M142%20120v6m0%2018v6m-15-15h6m18%200h6%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M86%2082l8-5%208%205v10l-8%205-8-5Z%22%2F%3E%0A%3C%2Fg%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22%2317243f%22%20stroke-width%3D%221.1%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.34%22%3E%0A%20%20%3Cpath%20d%3D%22M24%2078h28l8%208h18%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2222%22%20cy%3D%2278%22%20r%3D%222.5%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2280%22%20cy%3D%2286%22%20r%3D%222.5%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M108%2058c7%200%207%2012%2014%2012s7-12%2014-12%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M64%20150c9-10%2018-10%2027%200%22%2F%3E%0A%3C%2Fg%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22%23d9312f%22%20stroke-width%3D%221.1%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.25%22%3E%0A%20%20%3Cpath%20d%3D%22M112%20108l5%205%2010-12%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2258%22%20cy%3D%22102%22%20r%3D%225%22%2F%3E%0A%3C%2Fg%3E%0A%3C%2Fsvg%3E");
  background-size:auto,180px 180px;
}
body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(circle at 12% -5%,rgba(36,139,171,.12),transparent 31%),
    radial-gradient(circle at 96% 10%,rgba(23,36,63,.07),transparent 28%),
    radial-gradient(circle at 80% 95%,rgba(217,49,47,.045),transparent 25%);
}

   ========================================================= */

/* Compact filter rail: map gets more vertical importance */

  }

/* Softer doodles in the center, stronger atmosphere at the perimeter */
.org-zone-graph{
  isolation:isolate;
}
.org-zone-graph:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse 62% 72% at 50% 48%,
      rgba(255,255,255,.86) 0%,
      rgba(250,253,254,.73) 42%,
      rgba(244,249,251,.28) 68%,
      rgba(238,246,248,.05) 100%
    );

.map-zone{
  z-index:1!important;
}
.org-links-svg{
  z-index:2!important;
}
.map-zone-grid{
  z-index:3!important;
}

/* Zone backgrounds are quieter; cards become the focal point */
.map-zone-strategic{
  background:
    radial-gradient(circle at 50% 48%,rgba(255,255,255,.50),transparent 43%),
    linear-gradient(180deg,rgba(23,36,63,.020),rgba(23,36,63,.006))!important;
}
.map-zone-tactical{
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.44),transparent 48%),
    linear-gradient(180deg,rgba(36,139,171,.026),rgba(36,139,171,.007))!important;
}
.map-zone-operational{
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.44),transparent 50%),
    linear-gradient(180deg,rgba(217,49,47,.020),rgba(217,49,47,.006))!important;
}

/* Repeated level ribbons are removed from tactical/operational cards.
   Zone label + portrait ring already communicate the level. */
.org-zone-graph .ref-node.tac .level-ribbon,
.org-zone-graph .ref-node.op .level-ribbon{
  display:none!important;
}

/* Premium card surfaces */
.org-zone-graph .ref-node{
  border:1px solid rgba(255,255,255,.96)!important;
  background:
    linear-gradient(145deg,rgba(255,255,255,.985),rgba(250,252,253,.955))!important;
  box-shadow:
    0 10px 24px rgba(23,36,63,.085),
    0 2px 5px rgba(23,36,63,.035),
    inset 0 1px rgba(255,255,255,.94)!important;
  transition:
    transform .20s cubic-bezier(.2,.8,.2,1),
    box-shadow .20s ease,
    opacity .20s ease,
    filter .20s ease,
    border-color .20s ease!important;
}

.org-zone-graph .ref-node:hover{
  transform:translateY(-3px) scale(1.012)!important;
  box-shadow:
    0 17px 34px rgba(23,36,63,.13),
    0 3px 8px rgba(23,36,63,.045)!important;

@media(min-width:901px){
  .org-zone-graph .portrait-orbit{
    width:80px!important;
    height:80px!important;
    left:-28px!important;
  }

  .org-zone-graph .portrait-orbit .avatar{
    width:54px!important;
    height:54px!important;
  }

  .map-zone-operational .portrait-orbit{
    width:72px!important;
    height:72px!important;
    left:-25px!important;
  }

  .map-zone-operational .portrait-orbit .avatar{
    width:48px!important;
    height:48px!important;
  }
}

/* Executive card has its own visual language */
.org-zone-graph .ref-node.depth-0{
  border-color:rgba(23,36,63,.10)!important;
  background:
    radial-gradient(circle at 50% 0,rgba(36,139,171,.095),transparent 34%),
    linear-gradient(150deg,#ffffff 0%,#fbfdfe 52%,#f4f9fb 100%)!important;
  box-shadow:
    0 18px 40px rgba(23,36,63,.12),
    0 3px 9px rgba(23,36,63,.045),

.org-zone-graph .ref-node.depth-0 .portrait-orbit{

.org-zone-graph .ref-node.depth-0 .portrait-orbit .avatar{

.org-zone-graph .ref-node.depth-0 .level-ribbon{

/* Hierarchical focus: selected chain stays vivid, unrelated structure recedes */
.org-zone-graph.org-focus-mode [data-slot-pos]{
  transition:opacity .20s ease,filter .20s ease,transform .20s ease;
}
.org-zone-graph.org-focus-mode [data-slot-pos]:not(.org-focus){
  opacity:.24;
  filter:saturate(.35) grayscale(.12);

.org-zone-graph.org-focus-mode .map-zone-label{

}
.org-toolbar-divider{

.org-map-hint{

  .org-zone-graph .ref-node,
  .org-zone-graph [data-slot-pos],
  .org-links-svg path{

/* The profile popover must be allowed to paint outside the header.

/* =========================================================
   FOTO DE FUNCIONÁRIO — upload robusto e feedback explícito
   ========================================================= */
.employee-photo-dropzone{
  position:relative;
}

.employee-photo-dropzone.photo-working{
  cursor:progress!important;
  border-style:solid!important;
  border-color:rgba(36,139,171,.55)!important;
  background:
    linear-gradient(90deg,rgba(36,139,171,.045),rgba(255,255,255,.82),rgba(36,139,171,.045))!important;
  background-size:220% 100%!important;
  animation:photo-upload-shimmer 1.25s linear infinite;
}

.employee-photo-dropzone.photo-working:after{
  content:"";
  position:absolute;
  top:12px;
  right:12px;
  width:16px;
  height:16px;
  border:2px solid rgba(36,139,171,.18);
  border-top-color:var(--brand-cyan);
  border-radius:50%;
  animation:photo-upload-spin .8s linear infinite;
}

.employee-photo-dropzone.photo-success{
  border-style:solid!important;
  border-color:rgba(22,130,100,.38)!important;
  background:rgba(245,252,249,.92)!important;
}

.employee-photo-dropzone.photo-error{
  border-style:solid!important;
  border-color:rgba(217,49,47,.43)!important;
  background:rgba(255,247,247,.96)!important;
}

.employee-photo-dropzone.photo-readonly{
  border-color:#d7e2e6;
}

.employee-photo-progress{
  margin-top:8px!important;
  min-height:16px;
}

.employee-photo-progress.working{
  color:var(--brand-cyan)!important;
}

.employee-photo-progress.success{
  color:#168264!important;
}

.employee-photo-progress.error{
  color:#bf3e3b!important;
}

.employee-photo-progress.success:before{
  content:"✓ ";
  font-weight:900;
}

.employee-photo-progress.error:before{
  content:"! ";
  font-weight:900;
}

@keyframes photo-upload-spin{
  to{transform:rotate(360deg)}
}

@keyframes photo-upload-shimmer{
  to{background-position:-220% 0}
}

/* =========================================================

   ========================================================= */
.person-form-footer{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) auto auto!important;
  align-items:center!important;
  gap:9px!important;

  min-width:0;

  font-weight:750;

}

.person-save-status.working{

}

.person-save-status.working:before{

  height:11px;
  flex:0 0 auto;

/* =========================================================
   ORGANOGRAMA — hierarchy alignment + clean focus isolation
   ========================================================= */

@media(min-width:901px){
  .hierarchy-zone-graph{
    width:max(100%,var(--hier-min-width,1660px))!important;
    min-width:var(--hier-min-width,1660px)!important;
  }

  .hierarchy-zone-graph .map-zone{
    /* Do not create a stacking context here:
       otherwise connector SVG can paint above cards. */
    z-index:auto!important;
    overflow:visible!important;
  }

  .hierarchy-zone-graph .map-zone-grid{
    width:100%!important;
    min-width:100%!important;
    display:grid!important;
    grid-template-columns:repeat(var(--hier-cols),minmax(0,1fr))!important;
    grid-auto-flow:row!important;
    align-items:center!important;
    justify-items:stretch!important;
    column-gap:34px!important;
    padding-inline:110px!important;
    position:relative!important;
    z-index:3!important;
  }

  .hierarchy-zone-graph .hierarchy-slot{
    width:100%!important;
    min-width:0!important;
    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
    position:relative!important;
    z-index:3!important;
  }

  .hierarchy-zone-graph .hierarchy-slot .nodewrap{
    width:auto!important;
    max-width:100%!important;
    display:flex!important;
    justify-content:center!important;
  }

  /* Parent is centered over the exact horizontal span of its descendants. */
  .hierarchy-zone-graph .map-zone-strategic .hierarchy-slot,
  .hierarchy-zone-graph .map-zone-tactical .hierarchy-slot{
    justify-self:stretch!important;
  }

  /* Correct paint order:
     background < connectors < cards < zone labels. */
  .hierarchy-zone-graph:before{
    z-index:0!important;
  }

  .hierarchy-zone-graph .org-links-svg{
    z-index:2!important;
    pointer-events:none!important;
    overflow:visible!important;
  }

  .hierarchy-zone-graph .map-zone-grid{
    z-index:3!important;
  }

  .hierarchy-zone-graph .map-zone-label{
    z-index:5!important;
  }

  .hierarchy-zone-graph .ref-node{
    position:relative!important;
    z-index:4!important;
  }

  .hierarchy-zone-graph .portrait-orbit,
  .hierarchy-zone-graph .level-ribbon{
    z-index:6!important;
  }

  /* Cleaner, more architectural connectors. */
  .hierarchy-zone-graph .org-connector{
    fill:none!important;
    stroke:rgba(83,126,143,.38)!important;
    stroke-width:1.45!important;
    stroke-linecap:round!important;
    stroke-linejoin:round!important;
    vector-effect:non-scaling-stroke!important;
    shape-rendering:geometricPrecision;
  }

  /* A little extra vertical breathing room makes the chain read top-to-bottom. */
  .hierarchy-zone-graph{
    height:690px!important;
    grid-template-rows:205px 242px 243px!important;
  }

  .hierarchy-zone-graph .map-zone{
    padding-top:38px!important;
    padding-bottom:31px!important;
  }

  /* ============================
     TRUE ACTIVE-CHAIN ISOLATION
     ============================ */

  .hierarchy-zone-graph [data-slot-pos]{
    opacity:1;
    visibility:visible;
    filter:none;
    transition:
      opacity .17s ease,
      transform .19s cubic-bezier(.2,.8,.2,1),
      filter .17s ease,
      visibility 0s linear 0s!important;
  }

  /* Unrelated cards fully disappear but keep their grid space.
     Keeping layout space prevents lines/cards from jumping during focus. */
  .hierarchy-zone-graph.org-focus-mode [data-slot-pos]:not(.org-focus){
    opacity:0!important;
    visibility:hidden!important;
    pointer-events:none!important;
    filter:none!important;
    transition:
      opacity .15s ease,
      visibility 0s linear .15s!important;
  }

  .hierarchy-zone-graph.org-focus-mode [data-slot-pos].org-focus{
    opacity:1!important;
    visibility:visible!important;
    pointer-events:auto!important;
    filter:none!important;
    position:relative!important;
    z-index:7!important;
  }

  .hierarchy-zone-graph.org-focus-mode [data-slot-pos].org-focus-primary{
    z-index:9!important;
  }

  /* While a chain is active, only its connectors remain visible. */
  .hierarchy-zone-graph.org-focus-mode .org-links-svg path{
    opacity:0!important;
    transition:
      opacity .15s ease,
      stroke .15s ease,
      stroke-width .15s ease!important;
  }

  .hierarchy-zone-graph.org-focus-mode .org-links-svg path.focus-link{
    opacity:1!important;
    stroke:var(--brand-cyan)!important;
    stroke-width:2.2!important;
  }

  .hierarchy-zone-graph.org-focus-mode .org-links-svg path.muted-link{
    opacity:0!important;
  }

  /* Remove non-hierarchical visual noise during focus. */
  .hierarchy-zone-graph.org-focus-mode .map-zone-label{
    opacity:0!important;
    visibility:hidden!important;
  }

  .hierarchy-zone-graph.org-focus-mode .map-zone{
    border-color:transparent!important;
    background:transparent!important;
  }

  .hierarchy-zone-graph.org-focus-mode:before{
    opacity:.42!important;
  }

  /* Primary node sits above every line and sibling in the active chain. */
  .hierarchy-zone-graph .org-focus-primary .ref-node{
    z-index:10!important;
    transform:translateY(-3px) scale(1.025)!important;
  }
}

@media(min-width:1500px){
  .hierarchy-zone-graph .map-zone-grid{
    column-gap:40px!important;
    padding-inline:124px!important;
  }
}

@media(prefers-reduced-motion:reduce){
  .hierarchy-zone-graph [data-slot-pos],
  .hierarchy-zone-graph .org-links-svg path{
    transition:none!important;
  }
}

  .hierarchy-zone-graph .formal-connector{
    stroke:rgba(64,125,149,.50)!important;
  }

  .hierarchy-zone-graph .shared-connector{
    stroke:rgba(25,143,181,.78)!important;
    stroke-width:1.65!important;
    stroke-dasharray:none!important;
  }

  .hierarchy-zone-graph .shared-leadership-network{
    stroke-dasharray:none!important;
  }

  /* Focus geometry is rebuilt, so every remaining path is active. */
  .hierarchy-zone-graph.org-focus-mode .org-links-svg path{
    opacity:1!important;
    visibility:visible!important;
  }

  .hierarchy-zone-graph.org-focus-mode .org-connector{
    stroke:var(--brand-cyan)!important;
    stroke-width:2.05!important;
  }

  .hierarchy-zone-graph.org-focus-mode .shared-connector{
    stroke-width:2.2!important;
  }

  /* Cards are always above lines. */
  .hierarchy-zone-graph .map-zone-grid,
  .hierarchy-zone-graph .hierarchy-slot{
    z-index:4!important;
  }

  .hierarchy-zone-graph .ref-node{
    z-index:5!important;
  }

  .hierarchy-zone-graph .portrait-orbit,
  .hierarchy-zone-graph .level-ribbon{
    z-index:7!important;
  }
}

.command-empty>span:last-child{

  font-size:9px;
}

.command-footer{
  min-height:36px;
  padding:6px 11px;
  display:flex;
  align-items:center;
  gap:14px;
  border-top:1px solid #e9eef0;
  background:rgba(247,250,251,.86);

@keyframes command-backdrop-in{

}

@keyframes command-highlight-card{

.employee-history-item.promotion .employee-history-type{

.employee-history-empty,

/* =========================================================
   ADMIN NAVIGATION — rolagem e transições fluidas
   ========================================================= */
:root{
  --admin-side-w:250px;
  --admin-ease:cubic-bezier(.22,.61,.36,1);
  --admin-fast:160ms;
  --admin-normal:240ms;
}

.admin{
  min-height:100svh!important;
  grid-template-columns:var(--admin-side-w) minmax(0,1fr)!important;
  align-items:start!important;
}

/* A própria sidebar não rola: somente a região central de navegação.
   Isso mantém logo e perfil/rodapé sempre previsíveis. */
.side{
  position:sticky!important;
  top:0!important;
  height:100svh!important;
  max-height:100dvh!important;
  min-height:0!important;
  padding:
    max(15px,env(safe-area-inset-top))
    12px
    max(12px,env(safe-area-inset-bottom))!important;
  display:flex!important;
  flex-direction:column!important;
  gap:12px!important;
  overflow:hidden!important;
  overscroll-behavior:none!important;
  scrollbar-gutter:stable!important;
  isolation:isolate;
  box-shadow:1px 0 0 rgba(255,255,255,.025);
}

/* Logo: nunca desaparece ao chegar no final. */
.side>.brand{
  flex:0 0 auto;
  min-height:46px;
  padding:2px 8px 8px!important;
  position:relative;
  z-index:3;
}

/* Região que realmente pode rolar. */
.side>div:not(.sidefoot){
  min-height:0;
}
.side>div:nth-child(2){
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
  scroll-padding-block:12px 22px;
  padding:1px 2px 12px 0;
  mask-image:linear-gradient(
    to bottom,
    transparent 0,
    #000 8px,
    #000 calc(100% - 14px),
    transparent 100%
  );
  -webkit-mask-image:linear-gradient(
    to bottom,
    transparent 0,
    #000 8px,
    #000 calc(100% - 14px),
    transparent 100%
  );
}

/* Perfil/rodapé fica preso no final sem disputar scroll com o menu. */
.sidefoot{
  flex:0 0 auto!important;
  margin-top:0!important;
  padding-top:11px;
  position:relative;
  z-index:4;
  border-top:1px solid rgba(255,255,255,.075);
  background:linear-gradient(
    180deg,
    rgba(17,29,48,0),
    rgba(17,29,48,.92) 18%,
    #111d30 48%
  );
}

/* Links com movimento curto e sem "pulos". */
.slink{
  position:relative;
  transform:translateZ(0);
  transition:
    background-color var(--admin-fast) ease,
    color var(--admin-fast) ease,
    transform var(--admin-fast) var(--admin-ease),
    box-shadow var(--admin-fast) ease!important;
}
.slink:hover{
  transform:translateX(2px);
}
.slink:active{
  transform:translateX(1px) scale(.985);
}
.slink.on{
  background:rgba(255,255,255,.105)!important;
  color:#fff!important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);
}
.slink.on:before{
  content:"";
  position:absolute;
  left:-5px;
  top:10px;
  bottom:10px;
  width:2px;
  border-radius:99px;
  background:rgba(112,199,219,.9);
  box-shadow:0 0 12px rgba(112,199,219,.22);
}
.slink .icon{
  transition:
    transform var(--admin-fast) var(--admin-ease),
    opacity var(--admin-fast) ease;
}
.slink:hover .icon{
  transform:scale(1.05);
}

/* Conteúdo e header não disputam a rolagem com a sidebar. */
.amain{
  min-width:0!important;
  min-height:100svh;
  position:relative;
}
.atop{
  position:sticky!important;
  top:0!important;
  z-index:35!important;
  transform:translateZ(0);
  background:rgba(246,248,251,.84)!important;
  backdrop-filter:blur(18px) saturate(145%)!important;
  -webkit-backdrop-filter:blur(18px) saturate(145%)!important;
  box-shadow:0 1px 0 rgba(218,225,232,.72);
}
.acont{
  min-height:calc(100svh - 68px);
  padding-bottom:max(36px,calc(22px + env(safe-area-inset-bottom)))!important;
  animation:admin-content-in var(--admin-normal) var(--admin-ease) both;
}
@keyframes admin-content-in{
  from{opacity:.001;transform:translateY(5px)}
  to{opacity:1;transform:none}
}

/* Elementos administrativos ganham microtransições consistentes. */
.acont .panel,
.acont .akpi,
.acont .setting,
.acont .dep,
.acont .srow,
.acont .row{
  transition:
    background-color var(--admin-fast) ease,
    border-color var(--admin-fast) ease,
    box-shadow var(--admin-normal) var(--admin-ease),
    transform var(--admin-normal) var(--admin-ease);
}
.acont .panel:hover{
  border-color:#d8e1e7;
}
.acont .srow:hover,
.acont .row:not(.head):hover{
  background:#f7f9fb;
}

/* Evita que o browser "ancore" a página em posições estranhas quando
   listas/paineis mudam de tamanho. */
.admin,
.amain,
.acont{
  overflow-anchor:none;
}

/* Mobile/tablet: drawer verdadeiro, com backdrop e scroll bloqueado. */
@media(max-width:850px){
  html.admin-sidebar-open,
  body.admin-sidebar-open{
    overflow:hidden!important;
    overscroll-behavior:none!important;
  }

  .admin{
    display:block!important;
    min-height:100svh!important;
  }

  .side{
    position:fixed!important;
    inset:
      0 auto 0 0!important;
    width:min(var(--admin-side-w),calc(100vw - 54px))!important;
    height:100dvh!important;
    max-height:none!important;
    transform:translate3d(-104%,0,0)!important;
    visibility:hidden;
    pointer-events:none;
    will-change:transform;
    transition:
      transform var(--admin-normal) var(--admin-ease),
      visibility 0s linear var(--admin-normal),
      box-shadow var(--admin-normal) ease!important;
    box-shadow:none!important;
    z-index:82!important;
  }

  .side.open{
    transform:translate3d(0,0,0)!important;
    visibility:visible;
    pointer-events:auto;
    transition:
      transform var(--admin-normal) var(--admin-ease),
      visibility 0s linear 0s,
      box-shadow var(--admin-normal) ease!important;
    box-shadow:22px 0 52px rgba(15,23,42,.28)!important;
  }

  .side>div:nth-child(2){
    mask-image:none;
    -webkit-mask-image:none;
    padding-bottom:18px;
  }

  .sidebarToggle{
    display:grid!important;
    transition:
      transform var(--admin-fast) var(--admin-ease),
      background-color var(--admin-fast) ease,
      border-color var(--admin-fast) ease!important;
  }
  .sidebarToggle:active{
    transform:scale(.94);
  }

  /* O backdrop existente fica suave e não intercepta nada quando fechado. */
  #overlay{
    transition:
      opacity var(--admin-normal) ease,
      visibility 0s linear var(--admin-normal)!important;
  }
  #overlay.open{
    transition:
      opacity var(--admin-normal) ease,
      visibility 0s linear 0s!important;
  }
}

@media(max-width:620px){
  .atop{
    height:62px!important;
    padding-inline:12px!important;
  }
  .acont{
    min-height:calc(100svh - 62px);
    padding:14px 12px max(28px,calc(16px + env(safe-area-inset-bottom)))!important;
  }
}

/* Respeita usuários que reduziram animações no SO. */
@media(prefers-reduced-motion:reduce){
  .acont{animation:none!important}
  .side,
  .slink,
  .slink .icon,
  .sidebarToggle,
  #overlay,
  .acont .panel,
  .acont .akpi,
  .acont .setting,
  .acont .dep,
  .acont .srow,
  .acont .row{
    transition:none!important;
    scroll-behavior:auto!important;
  }
}


/* =========================================================
   SIDEBAR ADMIN — acabamento contínuo no fim da página
   ========================================================= */

/* Mantém o fundo azul da coluna esquerda por toda a altura do documento,
   mesmo quando a sidebar sticky termina no viewport. */
.admin{
  position:relative!important;
  background:
    linear-gradient(
      to right,
      #14233b 0,
      #14233b var(--admin-side-w),
      transparent var(--admin-side-w),
      transparent 100%
    )!important;
}

/* Sidebar sem sombra lateral / sem recorte visual pesado. */
.side{
  background:linear-gradient(180deg,#15243d 0%,#172a47 100%)!important;
  box-shadow:none!important;
  border-right:1px solid rgba(255,255,255,.035)!important;
}

/* Remove o efeito "caixa escura" e o degradê feio no rodapé do perfil. */
.sidefoot{
  margin-top:0!important;
  padding-top:10px!important;
  border-top:1px solid rgba(255,255,255,.07)!important;
  background:transparent!important;
  box-shadow:none!important;
}

/* O item do usuário vira apenas mais um item limpo da navegação. */
.sidefoot .slink{
  background:transparent!important;
  box-shadow:none!important;
  border:0!important;
}
.sidefoot .slink:hover{
  background:rgba(255,255,255,.055)!important;
  transform:none!important;
}

/* Evita qualquer sombra residual criada em camadas anteriores. */
.side.open{
  box-shadow:none!important;
}

/* Desktop: o fundo azul estrutural continua até o fim da página. */
@media(min-width:851px){
  .admin{
    min-height:100vh!important;
  }

  .side{
    min-height:100svh!important;
  }
}

/* Mobile: não deixa a faixa azul fixa atrás do conteúdo. */
@media(max-width:850px){
  .admin{
    background:transparent!important;
  }

  .side.open{
    box-shadow:18px 0 42px rgba(15,23,42,.16)!important;
  }

  .sidefoot{
    background:#172a47!important;
  }
}


/* =========================================================
   ADMIN LAYOUT — sidebar e cabeçalho realmente FIXOS
   ========================================================= */
:root{
  --admin-side-w:250px;
  --admin-head-h:68px;
}

/* A página administrativa deixa de usar a sidebar como parte do fluxo. */
.admin{
  display:block!important;
  min-height:100vh!important;
  background:#f6f8fb!important;
}

/* Sidebar fixa do topo ao fim da viewport. */
.side{
  position:fixed!important;
  left:0!important;
  top:0!important;
  bottom:0!important;
  width:var(--admin-side-w)!important;
  height:auto!important;
  max-height:none!important;
  min-height:0!important;
  z-index:80!important;
  transform:none!important;
  overflow:hidden!important;
  box-shadow:none!important;
}

/* Conteúdo começa depois da sidebar fixa. */
.amain{
  margin-left:var(--admin-side-w)!important;
  min-width:0!important;
  min-height:100vh!important;
  position:relative!important;
}

/* Cabeçalho congelado na tela, sem desaparecer na rolagem. */
.atop{
  position:fixed!important;
  top:0!important;
  left:var(--admin-side-w)!important;
  right:0!important;
  height:var(--admin-head-h)!important;
  z-index:70!important;
  margin:0!important;
  transform:none!important;
  background:rgba(246,248,251,.95)!important;
  backdrop-filter:blur(18px) saturate(145%)!important;
  -webkit-backdrop-filter:blur(18px) saturate(145%)!important;
  border-bottom:1px solid var(--line)!important;
  box-shadow:none!important;
}

/* Banners e conteúdo ficam abaixo do header fixo. */
.amain>.admin-mode-banner{
  margin-top:var(--admin-head-h)!important;
}

.acont{
  padding-top:clamp(18px,3vw,30px)!important;
  min-height:calc(100vh - var(--admin-head-h))!important;
}

/* Caso não exista banner, garante que o conteúdo não fique atrás do topo. */
.atop + .acont{
  padding-top:calc(var(--admin-head-h) + clamp(18px,3vw,30px))!important;
}

/* Sidebar: logo e perfil fixos; só os links centrais rolam internamente. */
.side>.brand{
  flex:0 0 auto!important;
}
.side>div:nth-child(2){
  flex:1 1 auto!important;
  min-height:0!important;
  overflow-y:auto!important;
  overflow-x:hidden!important;
  overscroll-behavior:contain!important;
}
.sidefoot{
  flex:0 0 auto!important;
  margin-top:0!important;
  background:transparent!important;
  box-shadow:none!important;
}

/* A faixa azul acompanha a sidebar fixa sem depender da altura do documento. */
.admin{
  background:#f6f8fb!important;
}
.side{
  background:linear-gradient(180deg,#15243d 0%,#172a47 100%)!important;
}

/* Desktop: sidebar e header sempre imóveis. */
@media(min-width:851px){
  body{
    overflow-x:hidden;
  }

  .sidebarToggle{
    display:none!important;
  }
}

/* Mobile: continua drawer, porque sidebar fixa de 250px não cabe. */
@media(max-width:850px){
  :root{
    --admin-head-h:62px;
  }

  .admin{
    display:block!important;
  }

  .amain{
    margin-left:0!important;
  }

  .atop{
    left:0!important;
    height:var(--admin-head-h)!important;
  }

  .side{
    width:min(var(--admin-side-w),calc(100vw - 54px))!important;
    transform:translate3d(-104%,0,0)!important;
    visibility:hidden!important;
    pointer-events:none!important;
    transition:
      transform 240ms var(--admin-ease),
      visibility 0s linear 240ms!important;
  }

  .side.open{
    transform:translate3d(0,0,0)!important;
    visibility:visible!important;
    pointer-events:auto!important;
    transition:
      transform 240ms var(--admin-ease),
      visibility 0s linear 0s!important;
  }

  .amain>.admin-mode-banner{
    margin-top:var(--admin-head-h)!important;
  }

  .atop + .acont{
    padding-top:calc(var(--admin-head-h) + 14px)!important;
  }

  .sidebarToggle{
    display:grid!important;
  }
}

/* Evita qualquer sticky legado competir com o novo layout. */
.side,
.atop{
  will-change:auto!important;
}

/* Respeita redução de movimento. */
@media(prefers-reduced-motion:reduce){
  .side{
    transition:none!important;
  }
}


/* Admin status banner removido: o conteúdo começa diretamente sob o cabeçalho fixo. */
.amain>.admin-mode-banner{
  display:none!important;
}
.atop + .acont{
  padding-top:clamp(18px,3vw,30px)!important;
}
@media(max-width:620px){
  .atop + .acont{
    padding-top:14px!important;
  }
}


/* =========================================================
   ADMIN HEADER OFFSET — conteúdo nunca fica sob o header fixo
   ========================================================= */

/* O header administrativo é fixed, então o conteúdo precisa reservar
   explicitamente a altura dele em TODAS as páginas de Gestão. */
.amain > .acont,
.atop + .acont{
  padding-top:
    calc(var(--admin-head-h) + clamp(18px,3vw,30px))!important;
}

/* Mantém um respiro consistente ao navegar diretamente entre páginas. */
.amain > .acont{
  scroll-padding-top:calc(var(--admin-head-h) + 18px);
}

/* Mobile usa cabeçalho menor, mas preserva o mesmo princípio. */
@media(max-width:850px){
  .amain > .acont,
  .atop + .acont{
    padding-top:calc(var(--admin-head-h) + 14px)!important;
  }
}

/* Garante que âncoras/elementos focados também não fiquem escondidos. */
.admin [id]{
  scroll-margin-top:calc(var(--admin-head-h) + 18px);
}

<body>
<div id="app"></div>
<div id="overlay" class="overlay"></div>
<aside id="drawer" class="drawer" aria-hidden="true"></aside>

<div id="toasts" class="toasts" aria-live="assertive"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const CFG={dataProvider:"local",storageKey:"orbia-org-v3",supabaseUrl:"",supabaseAnonKey:"",dbSchema:"organograma",organizationSlug:"orbia",storageBucket:"employee-photos",storagePrivate:true,locale:"pt-BR"};


const SUPABASE_SDK_FALLBACKS=[
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
  "https://unpkg.com/@supabase/supabase-js@2"
];

function loadExternalScript(src){
  return new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src=src;
    script.async=true;
    script.crossOrigin="anonymous";
    script.onload=()=>resolve();
    script.onerror=()=>reject(Error(`Falha ao carregar ${src}`));
    document.head.appendChild(script);
  });
}

async function ensureSupabaseSDK(){
  if(window.supabase?.createClient)return window.supabase;

  for(const src of SUPABASE_SDK_FALLBACKS){
    try{
      await loadExternalScript(src);
      if(window.supabase?.createClient)return window.supabase;
    }catch(err){
      console.warn("Falha ao carregar SDK Supabase:",src,err);
    }
  }

  throw Error("Não foi possível carregar o SDK do Supabase. Verifique sua conexão com a internet, bloqueadores de conteúdo ou políticas de rede do navegador.");
}

const CONNECTION_STORAGE_KEY="orbia-supabase-runtime-v1";
const RuntimeConnection={
  load(){
    try{
      const raw=localStorage.getItem(CONNECTION_STORAGE_KEY);
      return raw?JSON.parse(raw):null;
    }catch{return null}
  },
  hydrate(){
    const saved=this.load();
    if(!saved)return;
    const allowed=["dataProvider","supabaseUrl","supabaseAnonKey","dbSchema","organizationSlug","storageBucket"];
    for(const key of allowed){
      if(saved[key]!==undefined)CFG[key]=saved[key];
    }
  },
  save(values){
    const payload={
      dataProvider:values.dataProvider||"supabase",
      supabaseUrl:values.supabaseUrl||"",
      supabaseAnonKey:values.supabaseAnonKey||"",
      dbSchema:values.dbSchema||"organograma",
      organizationSlug:values.organizationSlug||"orbia",
      storageBucket:values.storageBucket||"employee-photos"
    };
    localStorage.setItem(CONNECTION_STORAGE_KEY,JSON.stringify(payload));
    Object.assign(CFG,payload);
  },
  useLocal(){
    const current=this.load()||{};
    const payload={...current,dataProvider:"local"};
    localStorage.setItem(CONNECTION_STORAGE_KEY,JSON.stringify(payload));
    CFG.dataProvider="local";
  },
  forget(){
    localStorage.removeItem(CONNECTION_STORAGE_KEY);
    Object.assign(CFG,{
      dataProvider:"local",
      supabaseUrl:"",
      supabaseAnonKey:"",
      dbSchema:"organograma",
      organizationSlug:"orbia",
      storageBucket:"employee-photos"
    });
  }
};
RuntimeConnection.hydrate();

function looksLikeServiceRoleKey(key=""){
  const k=String(key).trim();
  if(k.startsWith("sb_secret_"))return true;
  if(k.split(".").length===3){
    try{
      const payload=JSON.parse(atob(k.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
      return payload?.role==="service_role";
    }catch{}
  }
  return false;
}

function connectionFormValues(){
  return {
    supabaseUrl:(document.getElementById("cfgUrl")?.value||"").trim(),
    supabaseAnonKey:(document.getElementById("cfgAnon")?.value||"").trim(),
    dbSchema:(document.getElementById("cfgSchema")?.value||"organograma").trim(),
    organizationSlug:(document.getElementById("cfgSlug")?.value||"orbia").trim(),
    storageBucket:(document.getElementById("cfgBucket")?.value||"employee-photos").trim()
  };
}

function friendlySupabaseError(err){
  const msg=err?.message||String(err||"Erro desconhecido");
  if(/exposed schema|schema.*not.*exposed|PGRST106/i.test(msg)){
    return 'O schema "organograma" ainda não está exposto na Data API. No Supabase, adicione organograma em Project Settings → API → Exposed schemas.';
  }
  if(/SDK do Supabase|supabase-js|createClient|carregar.*Supabase/i.test(msg)){
    return "O SDK do Supabase não carregou. Verifique a conexão com a internet e se o navegador/rede está bloqueando cdn.jsdelivr.net ou unpkg.com.";
  }
  if(/Invalid login credentials|Email not confirmed/i.test(msg)){
    return "E-mail ou senha inválidos, ou o e-mail ainda não foi confirmado no Supabase Auth.";
  }
  if(/Invalid login credentials|invalid_credentials|Email not confirmed/i.test(msg)){
    return "Usuário ou senha inválidos. Para este acesso, use gestao1 (ou gestao1@maisintegradora.com.br) e confirme que o usuário existe no Supabase Authentication.";
  }
  if(/Administrador|Admin|Manager\/Admin|permissão Manager|organization_members/i.test(msg)){
    return "A conta precisa estar vinculada em organograma.organization_members com role admin.";
  }
  if(/row-level security|RLS|policy|permission denied|403/i.test(msg)){
    return "A política de segurança do Supabase bloqueou esta operação. Confirme que a conta está vinculada como admin e que a migration 013 foi aplicada.";
  }
  if(/JWT|apikey|Invalid API key|401/i.test(msg)){
    return "A chave informada não foi aceita. Use a Publishable key / anon public do projeto, nunca a service_role.";
  }
  if(/position_reporting_lines.*schema cache|Could not find the table ['"]?organograma\.position_reporting_lines/i.test(msg)){
    return "A tabela de relações complementares ainda não está disponível no Supabase. A hierarquia principal pode ser movida normalmente; execute a migration 011 apenas para usar relações compartilhadas/funcionais/consultivas.";
  }
  if(/register_employee_movement|set_position_reporting_lines|audit_log/i.test(msg)){
    return "A estrutura final do banco ainda não está instalada. Execute a migration 011_complete_organograma_v1.sql no Supabase.";
  }
  if(/get_public_org_chart|Could not find the function|PGRST202/i.test(msg)){
    return 'A conexão chegou ao projeto, mas uma função do schema organograma ainda não existe. Execute o SQL de setup atualizado.';
  }

function normalizeAppData(data){
  const next=data&&typeof data==="object"?data:U.clone(D);

  next.company=next.company||U.clone(D.company);
  next.departments=Array.isArray(next.departments)?next.departments:[];
  next.people=Array.isArray(next.people)?next.people:[];
  next.positions=Array.isArray(next.positions)?next.positions:[];
  const hadReportingLines=Array.isArray(next.reportingLines);
  next.reportingLines=hadReportingLines?next.reportingLines:[];
  const hadPositionHistory=Array.isArray(next.positionHistory);
  next.positionHistory=hadPositionHistory?next.positionHistory:[];
  if(!hadReportingLines){
    const ids=new Set(next.positions.map(p=>p.id));
    const compatible=(D.reportingLines||[]).filter(line=>
      ids.has(line.parentId)&&ids.has(line.childId)
    );
    next.reportingLines=U.clone(compatible);
  }
  next.activity=Array.isArray(next.activity)?next.activity:[];
  next.employmentEvents=Array.isArray(next.employmentEvents)?next.employmentEvents:[];
  next.departmentLeadershipHistory=Array.isArray(next.departmentLeadershipHistory)?next.departmentLeadershipHistory:[];
  next.auditLogs=Array.isArray(next.auditLogs)?next.auditLogs:[];
  next.settings=next.settings&&typeof next.settings==="object"
    ?next.settings
    :{accessProfile:"viewer"};

  next.people=next.people.map(person=>({
    ...person,
    employmentStatus:person.employmentStatus||(person.active===false?"terminated":"active"),
    active:person.active!==false&&person.employmentStatus!=="terminated"
  }));

  next.positions=next.positions.map(position=>({
    ...position,
    vacancySince:position.vacancySince||null,
    vacancyReason:position.vacancyReason||"",
    vacancyNotes:position.vacancyNotes||"",
    vacancyOwnerEmployeeId:position.vacancyOwnerEmployeeId||null
  }));

  next.reportingLines=next.reportingLines
    .filter(line=>line&&line.parentId&&line.childId&&line.parentId!==line.childId)
    .map(line=>({
      id:line.id||U.id("report"),
      parentId:line.parentId,
      childId:line.childId,
      type:line.type||"shared",
      label:line.label||""
    }));

  if(!hadPositionHistory){
    next.positionHistory=next.positions
      .filter(position=>position.personId)
      .map(position=>{
        const person=next.people.find(p=>p.id===position.personId);
        const department=next.departments.find(d=>d.id===position.departmentId);
        return {
          id:`legacy:${position.personId}:${position.id}`,
          employeeId:position.personId,
          positionId:position.id,
          title:position.title,
          departmentId:position.departmentId||null,
          departmentName:department?.name||"",
          startDate:person?.hireDate||null,
          endDate:null,
          assignmentType:"initial_snapshot",
          notes:"",
          current:true
        };
      });
  }

  next.positionHistory=next.positionHistory
    .filter(item=>item&&item.employeeId&&item.positionId)
    .map(item=>({
      id:item.id||U.id("history"),
      employeeId:item.employeeId,
      positionId:item.positionId,
      title:item.title||next.positions.find(p=>p.id===item.positionId)?.title||"Cargo",
      departmentId:item.departmentId||next.positions.find(p=>p.id===item.positionId)?.departmentId||null,
      departmentName:item.departmentName||next.departments.find(d=>d.id===(item.departmentId||next.positions.find(p=>p.id===item.positionId)?.departmentId))?.name||"",
      startDate:item.startDate||null,
      endDate:item.endDate||null,
      assignmentType:item.assignmentType||"correction",
      notes:item.notes||"",
      current:item.current===true||!item.endDate
    }));

  if(!next.departmentLeadershipHistory.length){
    next.departmentLeadershipHistory=next.departments
      .filter(d=>d.leaderPositionId)
      .map(d=>({
        id:`legacy-lead:${d.id}:${d.leaderPositionId}`,
        departmentId:d.id,positionId:d.leaderPositionId,
        startDate:null,endDate:null,current:true
      }));
  }

  return next;
}

function withTimeout(promise,ms,message="A operação demorou mais que o esperado."){
  let timer;
  return Promise.race([
    Promise.resolve(promise).finally(()=>clearTimeout(timer)),
    new Promise((_,reject)=>{
      timer=setTimeout(()=>reject(Error(message)),ms);
    })
  ]);
}

function photoErrorMessage(error){
  const msg=error?.message||String(error||"Erro desconhecido");

  if(/not authenticated|Auth session missing|sessão.*edição|usuário autenticado|JWT/i.test(msg)){
    return "Faça login na Sessão de edição do Supabase com um usuário Manager/Admin antes de enviar fotos.";
  }
  if(/row-level security|RLS|policy|permission denied|Unauthorized|403/i.test(msg)){
    return "O Supabase bloqueou a operação por RLS/Storage Policy. A sessão existe, mas o usuário precisa ter permissão Manager/Admin para esta organização.";
  }
  if(/409|already exists|Duplicate/i.test(msg)){
    return "Já existe uma foto nesse caminho e o Storage recusou a substituição. Verifique a policy UPDATE do bucket employee-photos.";
  }
  if(/400|Invalid request|invalid.*path/i.test(msg)){
    return "O Storage recusou o caminho ou o arquivo enviado. Verifique o bucket employee-photos e tente novamente.";
  }
  if(/Bucket not found|bucket.*not found/i.test(msg)){
    return `O bucket "${CFG.storageBucket}" não foi encontrado no Supabase.`;
  }
  if(/Payload too large|maximum|too large|5 MB/i.test(msg)){
    return "A imagem é grande demais. Use uma foto de até 5 MB.";
  }
  if(/network|fetch|Failed to fetch|Load failed|tempo excedido|demorou/i.test(msg)){
    return "A conexão com o Supabase falhou ou demorou demais. Verifique a internet e tente novamente.";
  }
  return friendlySupabaseError(error);
}


async function fetchWithTimeout(url,options={},ms=15000,label="A operação excedeu o tempo limite."){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),ms);
  try{
    const response=await fetch(url,{...options,signal:controller.signal});
    return response;
  }catch(error){
    if(error?.name==="AbortError"){
      throw Error(label);
    }
    throw error;
  }finally{
    clearTimeout(timer);
  }
}

async function readHttpError(response,fallback="Falha na operação com o Supabase."){
  let detail="";
  try{
    const text=await response.text();
    if(text){
      try{
        const json=JSON.parse(text);
        detail=json?.message||json?.msg||json?.error_description||json?.error||json?.details||text;
      }catch{
        detail=text;
      }
    }
  }catch{}
  const error=Error(detail||`${fallback} HTTP ${response.status}.`);
  error.status=response.status;
  return error;
}
